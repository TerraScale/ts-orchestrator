# Binary-only A/B self-update (docs/continuous-delivery.md), installed by the
# image with terrascale-orchestrator-selfupdate-watchdog@host.timer.
[Service]
# Runs as root ("+") before every start: seeds the baked binary as the first
# release, rolls back an activation whose signed version proof missed its
# deadline, and refuses a current release whose bytes no longer verify. The
# baked binary hands the step to the node's known-good release, so these
# arguments must stay valid for every release.
ExecStartPre=+/usr/local/bin/terrascale-orchestrator selfupdate prepare --root /var/lib/terrascale-orchestrator --unit terrascale-orchestrator-host.service
ExecStart=
ExecStart=/var/lib/terrascale-orchestrator/current/terrascale-orchestrator host --config /etc/terrascale-orchestrator/host.json
