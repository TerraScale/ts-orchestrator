# Opt-in binary-only A/B self-update (docs/continuous-delivery.md). Not
# installed by the image. Install only together with
# host.self_update_proof_file and /etc/terrascale-orchestrator/selfupdate-terrascale-orchestrator-host.env
# (see selfupdate.env.example) naming the proof file and the identity key.
[Service]
EnvironmentFile=/etc/terrascale-orchestrator/selfupdate-terrascale-orchestrator-host.env
# Runs as root ("+") before every start: seeds the baked binary as the first
# release, rolls back an activation whose signed version proof missed its
# deadline, and refuses a current release whose bytes no longer verify.
ExecStartPre=+/usr/local/bin/terrascale-orchestrator selfupdate prepare --root /var/lib/terrascale-orchestrator --unit terrascale-orchestrator-host.service --proof-file ${TS_SELFUPDATE_PROOF_FILE} --proof-key-file ${TS_SELFUPDATE_PROOF_KEY_FILE}
ExecStart=
ExecStart=/var/lib/terrascale-orchestrator/current/terrascale-orchestrator host --config /etc/terrascale-orchestrator/host.json
