global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    region: gru
rule_files:
  - ../slo-rules.yml
  - operational-rules.yml
  - host-storage-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: peer-topology
    scrape_interval: 5s
    static_configs:
      - targets: ['127.0.0.1:9097']
  - job_name: application-slo
    http_sd_configs:
      - url: http://ts-sjc-1.nb.ts.internal:9108/services
        refresh_interval: 15s
      - url: http://ts-sjc-2.nb.ts.internal:9108/services
        refresh_interval: 15s
      - url: http://ts-fra-1.nb.ts.internal:9108/services
        refresh_interval: 15s
      - url: http://ts-fra-2.nb.ts.internal:9108/services
        refresh_interval: 15s
      - url: http://ts-gru-1.nb.ts.internal:9108/services
        refresh_interval: 15s
      - url: http://ts-gru-2.nb.ts.internal:9108/services
        refresh_interval: 15s
  - job_name: service-readiness
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ['127.0.0.1:9094']
        labels:
          region: gru

  - job_name: host-storage
    sample_limit: 4096
    file_sd_configs:
      - files: ['/run/ts-orch-observability/storage.json']
        refresh_interval: 5s
  - job_name: terrabase-host-storage
    sample_limit: 48
    file_sd_configs:
      - files: ['/run/ts-orch-observability/storage.json']
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*):9108'
        target_label: __address__
        replacement: '${1}:9091'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'terrabase_storage_(queued|running|admitted)'
        action: keep
      - regex: '__name__|host|region|service|instance|job'
        action: labelkeep
