global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    region: gru
rule_files:
  - ../slo-rules.yml
  - operational-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: terrabase
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9091']
        labels:
          region: gru
          service: terrabase
