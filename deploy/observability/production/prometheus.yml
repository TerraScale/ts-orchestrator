global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    region: gru
rule_files:
  - ../slo-rules.yml
  - operational-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: peer-topology
    scrape_interval: 5s
    static_configs:
      - targets: ['127.0.0.1:9097']
  - job_name: terrabase
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9091']
        labels:
          region: gru
          service: terrabase
  - job_name: application-slo
    metrics_path: /metrics
    file_sd_configs:
      - files: ['/run/ts-orch-observability/targets.json']
        refresh_interval: 5s
  - job_name: service-readiness
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ['127.0.0.1:9094']
        labels:
          region: gru
