rule_files:
  - operational-rules.yml
evaluation_interval: 15s
tests:
  - name: History erasure reaches day 20 and recovers
    interval: 15s
    input_series:
      - series: 'terrabase_history_erasure_oldest_age_seconds{service="terrabase",region="gru"}'
        values: '1727999 1728000 0'
    alert_rule_test:
      - eval_time: 0s
        alertname: TerraBaseErasurePendingDay20
        exp_alerts: []
      - eval_time: 15s
        alertname: TerraBaseErasurePendingDay20
        exp_alerts:
          - exp_labels:
              service: terrabase
              severity: warning
            exp_annotations:
              summary: A TerraBase deletion is overdue or stalled by a replica epoch change
              description: Inspect pending holders; escalate epoch stalls to engineering (TS-875), never override coverage. Region removal requires explicit user authorization.
      - eval_time: 30s
        alertname: TerraBaseErasurePendingDay20
        exp_alerts: []
  - name: Database purge alone reaches day 20
    interval: 15s
    input_series:
      - series: 'terrabase_purge_oldest_age_seconds{service="terrabase",region="gru"}'
        values: '1728000+0x60'
    alert_rule_test:
      - eval_time: 0s
        alertname: TerraBaseErasurePendingDay20
        exp_alerts:
          - exp_labels:
              service: terrabase
              severity: warning
            exp_annotations:
              summary: A TerraBase deletion is overdue or stalled by a replica epoch change
              description: Inspect pending holders; escalate epoch stalls to engineering (TS-875), never override coverage. Region removal requires explicit user authorization.
  - name: Epoch stall fires immediately with no age metric
    interval: 15s
    input_series:
      - series: 'terrabase_history_erasure_epoch_stalled{service="terrabase",region="gru"}'
        values: '0 1 0'
    alert_rule_test:
      - eval_time: 0s
        alertname: TerraBaseErasurePendingDay20
        exp_alerts: []
      - eval_time: 15s
        alertname: TerraBaseErasurePendingDay20
        exp_alerts:
          - exp_labels:
              service: terrabase
              severity: warning
            exp_annotations:
              summary: A TerraBase deletion is overdue or stalled by a replica epoch change
              description: Inspect pending holders; escalate epoch stalls to engineering (TS-875), never override coverage. Region removal requires explicit user authorization.
      - eval_time: 30s
        alertname: TerraBaseErasurePendingDay20
        exp_alerts: []
  - name: Missing deletion metrics do not imply completion
    interval: 15s
    alert_rule_test:
      - eval_time: 15m
        alertname: TerraBaseErasurePendingDay20
        exp_alerts: []
  - interval: 15s
    input_series:
      - series: 'terrabase_backup_abandoned_total{service="terrabase",region="gru"}'
        values: '0+0x3 1+0x24'
      - series: 'terrabase_backup_holes_total{service="terrabase",region="gru"}'
        values: '0+0x3 1+0x24'
      - series: 'terrabase_backup_drills_total{service="terrabase",region="gru",result="failed"}'
        values: '0+0x3 1+0x24'
      - series: 'terrabase_replication_send_lag_seconds{service="terrabase",region="gru"}'
        values: '31+0x28'
      - series: 'terrabase_backup_lag_seconds{service="terrabase",region="gru"}'
        values: '601+0x28'
      - series: 'up{job="terrabase",service="terrabase",region="gru"}'
        values: '0+0x28'
    promql_expr_test:
      # The two lag alerts remain pending until their full two-minute hold expires.
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 1m45s
        exp_samples:
          - value: 4
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 2m
        exp_samples:
          - value: 6
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 5m
        exp_samples:
          - value: 6
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 7m
        exp_samples:
          - value: 3
  - interval: 15s
    input_series:
      - series: 'terrascale_service_readiness{service="terrabase",region="gru"}'
        values: '0+0x4 1+0x4'
      - series: 'terrascale_service_readiness{service="ts-auth",region="gru"}'
        values: '0+0x4 1+0x4'
      - series: 'terrascale_service_readiness{service="ts-dashboard",region="gru"}'
        values: '0+0x4 1+0x4'
    alert_rule_test:
      - eval_time: 45s
        alertname: ServiceReadinessFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: ServiceReadinessFailed
        exp_alerts:
          - exp_labels:
              service: terrabase
              region: gru
              severity: critical
            exp_annotations:
              summary: Public service readiness failed
          - exp_labels:
              service: ts-auth
              region: gru
              severity: critical
            exp_annotations:
              summary: Public service readiness failed
          - exp_labels:
              service: ts-dashboard
              region: gru
              severity: critical
            exp_annotations:
              summary: Public service readiness failed
      - eval_time: 1m15s
        alertname: ServiceReadinessFailed
        exp_alerts: []
