rule_files:
  - operational-rules.yml
evaluation_interval: 15s
tests:
  - interval: 1m
    input_series:
      - series: 'ts_auth_emails_total{service="ts-auth",region="gru",outcome="provider_exhausted"}'
        values: '1+0x7 0 1+0x2'
      - series: 'ts_auth_emails_total{service="ts-auth",region="gru",outcome="accepted"}'
        values: '0+10x11'
    alert_rule_test:
      - eval_time: 1m
        alertname: AuthEmailProviderExhausted
        exp_alerts:
          - exp_labels:
              service: ts-auth
              region: gru
              severity: critical
            exp_annotations:
              summary: Authentication email provider capacity exhausted
      - eval_time: 6m
        alertname: AuthEmailProviderExhausted
        exp_alerts: []
      - eval_time: 9m
        alertname: AuthEmailProviderExhausted
        exp_alerts:
          - exp_labels:
              service: ts-auth
              region: gru
              severity: critical
            exp_annotations:
              summary: Authentication email provider capacity exhausted
  - interval: 1m
    input_series:
      - series: 'ts_auth_emails_total{service="ts-auth",region="gru",outcome="accepted"}'
        values: '0+10x2'
    alert_rule_test:
      - eval_time: 1m
        alertname: AuthEmailProviderExhausted
        exp_alerts: []
  - name: History erasure reaches day 20 and recovers
    interval: 15s
    input_series:
      - series: 'terrabase_history_erasure_oldest_age_seconds{service="terrabase",region="gru"}'
        values: '1727999 1728000 0'
    alert_rule_test:
      - eval_time: 0s
        alertname: TerraBaseErasurePendingDay20
        exp_alerts: []
      - eval_time: 15s
        alertname: TerraBaseErasurePendingDay20
        exp_alerts:
          - exp_labels:
              service: terrabase
              severity: warning
            exp_annotations:
              summary: A TerraBase deletion is overdue or stalled by a replica epoch change
              description: Inspect pending holders; escalate epoch stalls to engineering (TS-875), never override coverage. Region removal requires explicit user authorization.
      - eval_time: 30s
        alertname: TerraBaseErasurePendingDay20
        exp_alerts: []
  - name: Database purge alone reaches day 20
    interval: 15s
    input_series:
      - series: 'terrabase_purge_oldest_age_seconds{service="terrabase",region="gru"}'
        values: '1728000+0x60'
    alert_rule_test:
      - eval_time: 0s
        alertname: TerraBaseErasurePendingDay20
        exp_alerts:
          - exp_labels:
              service: terrabase
              severity: warning
            exp_annotations:
              summary: A TerraBase deletion is overdue or stalled by a replica epoch change
              description: Inspect pending holders; escalate epoch stalls to engineering (TS-875), never override coverage. Region removal requires explicit user authorization.
  - name: Epoch stall fires immediately with no age metric
    interval: 15s
    input_series:
      - series: 'terrabase_history_erasure_epoch_stalled{service="terrabase",region="gru"}'
        values: '0 1 0'
    alert_rule_test:
      - eval_time: 0s
        alertname: TerraBaseErasurePendingDay20
        exp_alerts: []
      - eval_time: 15s
        alertname: TerraBaseErasurePendingDay20
        exp_alerts:
          - exp_labels:
              service: terrabase
              severity: warning
            exp_annotations:
              summary: A TerraBase deletion is overdue or stalled by a replica epoch change
              description: Inspect pending holders; escalate epoch stalls to engineering (TS-875), never override coverage. Region removal requires explicit user authorization.
      - eval_time: 30s
        alertname: TerraBaseErasurePendingDay20
        exp_alerts: []
  - name: Missing deletion metrics do not imply completion
    interval: 15s
    alert_rule_test:
      - eval_time: 15m
        alertname: TerraBaseErasurePendingDay20
        exp_alerts: []
  - interval: 15s
    input_series:
      - series: 'terrabase_backup_abandoned_total{service="terrabase",region="gru"}'
        values: '0+0x3 1+0x24'
      - series: 'terrabase_backup_holes_total{service="terrabase",region="gru"}'
        values: '0+0x3 1+0x24'
      - series: 'terrabase_backup_drills_total{service="terrabase",region="gru",result="failed"}'
        values: '0+0x3 1+0x24'
      - series: 'terrabase_replication_send_lag_seconds{service="terrabase",region="gru"}'
        values: '31+0x28'
      - series: 'terrabase_backup_lag_seconds{service="terrabase",region="gru"}'
        values: '601+0x28'
      - series: 'up{job="terrabase",service="terrabase",region="gru"}'
        values: '0+0x28'
    promql_expr_test:
      # The backup lag alert pages after two minutes; replication lag holds five.
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 1m45s
        exp_samples:
          - value: 4
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 2m
        exp_samples:
          - value: 5
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 4m45s
        exp_samples:
          - value: 5
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 5m
        exp_samples:
          - value: 6
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 7m
        exp_samples:
          - value: 3
  - interval: 15s
    input_series:
      - series: 'terrascale_service_readiness{service="terrabase",region="gru"}'
        values: '0+0x20 1+0x60'
      - series: 'terrascale_service_readiness{service="ts-auth",region="gru"}'
        values: '0+0x20 1+0x60'
      - series: 'terrascale_service_readiness{service="ts-dashboard",region="gru"}'
        values: '0+0x20 1+0x60'
    alert_rule_test:
      - eval_time: 4m45s
        alertname: ServiceReadinessFailed
        exp_alerts: []
      - eval_time: 5m
        alertname: ServiceReadinessFailed
        exp_alerts:
          - exp_labels:
              service: terrabase
              region: gru
              severity: critical
            exp_annotations:
              summary: Public service readiness failed
          - exp_labels:
              service: ts-auth
              region: gru
              severity: critical
            exp_annotations:
              summary: Public service readiness failed
          - exp_labels:
              service: ts-dashboard
              region: gru
              severity: critical
            exp_annotations:
              summary: Public service readiness failed
      # Recovered at 5m15s; firing holds ten minutes so a relapse is the same alert.
      - eval_time: 15m
        alertname: ServiceReadinessFailed
        exp_alerts:
          - exp_labels:
              service: terrabase
              region: gru
              severity: critical
            exp_annotations:
              summary: Public service readiness failed
          - exp_labels:
              service: ts-auth
              region: gru
              severity: critical
            exp_annotations:
              summary: Public service readiness failed
          - exp_labels:
              service: ts-dashboard
              region: gru
              severity: critical
            exp_annotations:
              summary: Public service readiness failed
      - eval_time: 15m30s
        alertname: ServiceReadinessFailed
        exp_alerts: []

  - name: Readiness flaps shorter than five minutes never page
    interval: 15s
    input_series:
      - series: 'terrascale_service_readiness{service="ts-auth",region="gru"}'
        values: '0+0x15 1+0x0 0+0x15 1+0x0 0+0x15 1+0x10'
    alert_rule_test:
      - eval_time: 12m
        alertname: ServiceReadinessFailed
        exp_alerts: []

  - name: Wire listener readiness alerts alone and recovers
    interval: 15s
    input_series:
      - series: 'ts_orch_edge_listener_ready{job="host-storage",region="gru",protocol="wire"}'
        values: '0+0x5 1+0x3'
      - series: 'ts_orch_edge_listener_ready{job="host-storage",region="gru",protocol="https"}'
        values: '1+0x9'
    alert_rule_test:
      - eval_time: 45s
        alertname: EdgeListenerUnavailable
        exp_alerts: []
      - eval_time: 1m
        alertname: EdgeListenerUnavailable
        exp_alerts:
          - exp_labels:
              job: host-storage
              region: gru
              protocol: wire
              service: edge
              severity: critical
            exp_annotations:
              summary: A public edge listener is unavailable
              description: Inspect listener bind errors and native wire readiness. Other edge protocols continue serving; no manual release prerequisite is required.
      - eval_time: 90s
        alertname: EdgeListenerUnavailable
        exp_alerts: []
  - name: Shape cleanup parks, overdues and saturates
    interval: 15s
    input_series:
      - series: 'terrabase_shape_cleanup_parked{service="terrabase",region="sjc"}'
        values: '0 1 0'
      - series: 'terrabase_shape_cleanup_oldest_age_seconds{service="terrabase",region="fra"}'
        values: '3600 3601 0'
      - series: 'terrabase_shape_cleanup_saturated{service="terrabase",region="gru"}'
        values: '1+0x24 0'
    alert_rule_test:
      - eval_time: 0s
        alertname: TerraBaseShapeCleanupParked
        exp_alerts: []
      - eval_time: 15s
        alertname: TerraBaseShapeCleanupParked
        exp_alerts:
          - exp_labels:
              service: terrabase
              severity: critical
            exp_annotations:
              summary: TerraBase shape cleanup is parked by a credential or policy refusal
              description: Repair the shape R2 or CDN purge identity in OCI Vault and roll TerraBase; parked inventory resumes at the next start and is never dropped.
      - eval_time: 30s
        alertname: TerraBaseShapeCleanupParked
        exp_alerts: []
      - eval_time: 0s
        alertname: TerraBaseShapeCleanupOverdue
        exp_alerts: []
      - eval_time: 15s
        alertname: TerraBaseShapeCleanupOverdue
        exp_alerts:
          - exp_labels:
              service: terrabase
              severity: warning
            exp_annotations:
              summary: TerraBase shape cleanup has been due for more than an hour
              description: Inspect terrabase_shape_cleanup_attempts_total by stage and outcome, the shared purge budget bucket and Cloudflare purge limits.
      - eval_time: 4m
        alertname: TerraBaseShapeCleanupSaturated
        exp_alerts: []
      - eval_time: 5m
        alertname: TerraBaseShapeCleanupSaturated
        exp_alerts:
          - exp_labels:
              service: terrabase
              severity: warning
            exp_annotations:
              summary: TerraBase shape cleanup inventory refuses new mirror publication
              description: Origin shape reads keep serving; drain pending cleanup before raising any bound.
      - eval_time: 6m15s
        alertname: TerraBaseShapeCleanupSaturated
        exp_alerts: []
