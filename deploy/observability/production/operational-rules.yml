groups:
  - name: peer-topology
    interval: 5s
    rules:
      - alert: RuntimePeerTopologyMismatch
        expr: ts_orch_peer_topology_mismatch > 0 or ts_orch_peer_topology_generation_rejected > 0 or ts_orch_peer_topology_age_seconds > 30
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: A region's service peers file disagrees with the admitted placement, a peers generation was refused, or the region's attestation is missing or stale
          description: ts_orch_peer_topology_mismatch is 1 when the region's peers file for the service is missing or differs from the file rendered from the admitted placement, a region of the service has no admitted node, or the region's attestation is missing, names another topology or region count, or is dated in the future. ts_orch_peer_topology_generation_rejected is 1 when the region kept its last peers file because the nodes answering the mesh ping differ from the admitted placement. ts_orch_peer_topology_age_seconds above 30 means the newest attestation from the region is more than 30 seconds old. Inspect the service peers file and the admitted desired generation. A missed mesh ping does not authorize a drain. Do not repair production peer files by hand.
      - alert: PeerTopologyAttestationDown
        expr: up{job="peer-topology"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Peer topology attestation is unavailable
  - name: terrabase-operations
    rules:
      - alert: TerraBaseErasurePendingDay20
        expr: max by (region) (terrabase_purge_oldest_age_seconds) >= 1728000 or max by (region) (terrabase_backup_purge_oldest_age_seconds) >= 1728000
        labels:
          service: terrabase
          severity: warning
        annotations:
          summary: A TerraBase deletion has stayed pending for twenty days
          description: Inspect pending holders. Region removal requires explicit user authorization.
      - alert: TerraBaseBackupLag
        expr: terrabase_backup_lag_seconds{service="terrabase"} > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: TerraBase backup lag exceeds sixty seconds
          description: terrabase_backup_lag_seconds is the seconds the oldest committed data not yet in the backup bucket has waited, over every file the reporting member ships. Sixty seconds sustained for five minutes erodes the recoverable point; TerraBaseBackupLagCritical pages past three hundred seconds.
          runbook_url: https://github.com/TerraScale/ts-orchestrator/blob/main/docs/disaster-recovery.md
      - alert: TerraBaseBackupLagCritical
        expr: terrabase_backup_lag_seconds{service="terrabase"} > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: TerraBase backup lag exceeds five minutes
          description: The oldest committed data not yet in the backup bucket has waited more than five minutes, so point-in-time recovery is losing window on every file the reporting member ships. Inspect the backup pass on the reporting member and the bucket destination.
          runbook_url: https://github.com/TerraScale/ts-orchestrator/blob/main/docs/disaster-recovery.md
      - alert: TerraBaseBackupSnapshotAge
        expr: (time() - terrabase_backup_bucket_snapshot_seconds{service="terrabase"} > 93600) and (terrabase_backup_bucket_snapshot_seconds{service="terrabase"} > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The newest TerraBase backup bucket snapshot is older than twenty-six hours
          description: terrabase_backup_bucket_snapshot_seconds is the unix time of the newest Tigris snapshot of the backup bucket on the member that takes them and zero on every other member, so zero-valued members never fire. Tigris snapshots land daily; a value older than twenty-six hours means the daily snapshot of the backup bucket did not complete.
          runbook_url: https://github.com/TerraScale/ts-orchestrator/blob/main/docs/disaster-recovery.md
      - alert: TerraBaseBackupDrillStale
        expr: (increase(terrabase_backup_drills_total{service="terrabase"}[26h]) <= 0) or absent(terrabase_backup_drills_total{service="terrabase"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: No TerraBase restore drill has completed in twenty-six hours
          description: terrabase_backup_drills_total counts completed snapshot restore drills by result and drills run daily. No increase for twenty-six hours means no drill completed on the reporting member; a Prometheus with less than twenty-six hours of history truncates the window and can fire earlier. Failed drills page separately through TerraBaseBackupDrillFailed.
          runbook_url: https://github.com/TerraScale/ts-orchestrator/blob/main/docs/disaster-recovery.md#drill
      - alert: TerraBaseBackupFailed
        expr: (increase(terrabase_backup_failures_total{service="terrabase"}[5m]) > 0) or (((terrabase_backup_failures_total{service="terrabase"} > 0) unless terrabase_backup_failures_total{service="terrabase"} offset 5m) and on (instance) (up{job="application-slo"} offset 5m == 1))
        labels:
          severity: warning
        annotations:
          summary: A TerraBase backup pass failed
      - alert: TerraBaseBackupHoles
        expr: (increase(terrabase_backup_holes_recorded_total{service="terrabase"}[5m]) > 0) or (((terrabase_backup_holes_recorded_total{service="terrabase"} > 0) unless terrabase_backup_holes_recorded_total{service="terrabase"} offset 5m) and on (instance) (up{job="application-slo"} offset 5m == 1))
        labels:
          severity: critical
        annotations:
          summary: TerraBase backup contains holes
      - alert: TerraBaseReplicationSendLag
        expr: terrabase_replica_max_lag_milliseconds{service="terrabase"} > 30000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: TerraBase replication send lag exceeds thirty seconds
      - alert: TerraBaseReplicaDiverged
        expr: (increase(terrabase_replica_verifications_total{service="terrabase",result="diverged"}[15m]) > 0) or (((terrabase_replica_verifications_total{service="terrabase",result="diverged"} > 0) unless terrabase_replica_verifications_total{service="terrabase",result="diverged"} offset 15m) and on (instance) (up{job="application-slo"} offset 15m == 1))
        labels:
          severity: critical
        annotations:
          summary: A TerraBase region replica diverged from its home
          description: The replica was deleted and bootstrapped again. Read the replica node's error log for the database and range; repeated divergence points at an engine or sync bug.
      - alert: TerraBaseReplicaUnverified
        expr: max by (host, region) (terrabase_replica_max_verification_age_seconds{service="terrabase"}) > 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A TerraBase region replica has gone an hour without a completed checksum verification
      - alert: TerraBaseMetricsDown
        expr: up{job="application-slo",service="terrabase"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: TerraBase metrics scrape failed
      - alert: TerraBaseHostMetricsDown
        expr: up{job="terrabase-host-storage"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: TerraBase host metrics are not scraped
          description: The terrabase-host-storage scrape of this host's TerraBase metrics on tcp 9091 has been down for two minutes. Check first that the NetBird servers-to-servers-metrics policy is applied, then that TerraBase is listening on 9091 and that the host's NetBird DNS name resolves and answers.
      - alert: TerraBaseBackupDrillFailed
        expr: (increase(terrabase_backup_drills_total{service="terrabase",result="failed"}[5m]) > 0) or (((terrabase_backup_drills_total{service="terrabase",result="failed"} > 0) unless terrabase_backup_drills_total{service="terrabase",result="failed"} offset 5m) and on (instance) (up{job="application-slo"} offset 5m == 1))
        labels:
          severity: critical
        annotations:
          summary: TerraBase backup restore drill failed
      - alert: ServiceReadinessFailed
        expr: min by (service) (terrascale_service_readiness{service=~"terrabase|ts-auth|ts-dashboard"}) == 0
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: Public service readiness failed
      - alert: AuthEmailProviderExhausted
        expr: sum by (service, region) ((increase(ts_auth_emails_total{service="ts-auth",outcome="provider_exhausted"}[5m]) > 0) or (((ts_auth_emails_total{service="ts-auth",outcome="provider_exhausted"} > 0) unless ts_auth_emails_total{service="ts-auth",outcome="provider_exhausted"} offset 5m) and on (instance) (up{job="application-slo"} offset 5m == 1))) > 0
        labels:
          severity: critical
        annotations:
          summary: Authentication email provider capacity exhausted
      - alert: AuthEmailDeliveryFailing
        expr: sum by (service, region) (increase(ts_auth_emails_total{service="ts-auth",outcome=~"admission_unavailable|failed|bounced"}[10m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Authentication email delivery failing
          description: ts-auth sends are ending as admission_unavailable, failed or bounced. Check the admission endpoint and provider response before users are locked out of sign-up.
      - alert: AuthEmailNoneSent
        expr: sum by (service, region) (increase(ts_auth_emails_total{service="ts-auth"}[6h])) > 0 unless sum by (service, region) (increase(ts_auth_emails_total{service="ts-auth",outcome=~"sent|accepted|queued"}[6h])) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'Authentication email: attempts but no successful send in 6 hours'

  - name: edge-listeners
    rules:
      - alert: EdgeListenerUnavailable
        expr: ts_orch_edge_listener_ready{job="host-storage"} == 0
        for: 1m
        labels:
          service: edge
          severity: critical
        annotations:
          summary: A public edge listener is unavailable
          description: Inspect listener bind errors. Other edge protocols continue serving; no manual release prerequisite is required.
  - name: desired-state
    rules:
      - alert: ServiceSpecInvalid
        expr: max by (service) (ts_orch_service_spec_invalid) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Stored service spec rejected; service not managed
          description: The mesh excluded this service from startup because its stored desired state fails validation. Its running task is left alone. Apply a corrected spec to restore management.
  - name: task-responsiveness
    rules:
      - alert: TerraBaseTaskUnresponsive
        expr: ts_orch_task_unresponsive_seconds{service="terrabase"} >= 240
        labels:
          severity: critical
        annotations:
          summary: A TerraBase task has stopped answering its readiness endpoint
      - alert: ServiceTaskUnresponsive
        expr: ts_orch_task_unresponsive_seconds{service!="terrabase"} >= 240
        labels:
          severity: warning
        annotations:
          summary: A service task has stopped answering its readiness endpoint
  - name: monitoring-coverage
    rules:
      - alert: ApplicationTaskMetricsDown
        expr: up{job="application-slo",service!="terrabase"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A running service task cannot be scraped
      - alert: ServiceTaskScrapeCoverageMissing
        expr: ts_host_service_tasks_expected{job="host-storage"} > on (host, region, service) (count by (host, region, service) (up{job="application-slo"} == 1) or on (host, region, service) (0 * ts_host_service_tasks_expected{job="host-storage"}))
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A service has fewer healthy scrape targets than assigned tasks on a node
      - alert: HostOOMKill
        expr: increase(ts_host_oom_kills_total{job="host-storage"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: 'The kernel killed a process on {{ $labels.host }} for lack of memory'
      - alert: CertificateExpirySoon
        expr: min by (service) (terrascale_certificate_expiry_timestamp_seconds) - time() < 1814400
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A public service certificate expires within twenty-one days or cannot be verified
      - alert: MeshStoreLeaderUnavailable
        expr: ts_orch_mesh_store_leader_available == 0 or ts_orch_mesh_store_observed == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The mesh store has no observed leader
      - alert: MeshStoreQuorumUnavailable
        expr: ts_orch_mesh_store_quorum_available == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The mesh store cannot reach its metadata quorum
      - alert: HostUnitRestartLoop
        expr: increase(ts_host_unit_restarts_total[10m]) >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A host service repeatedly restarts
      - alert: ProductionJourneyFailed
        expr: min(terrascale_production_journey_success) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The latest executed production journey failed
      - alert: ProductionJourneyTelemetryMissing
        expr: max(terrascale_production_journey_observation_age_seconds) > 3900 or time() - min(terrascale_production_journey_completed_timestamp_seconds) > 129600 or absent(terrascale_production_journey_observation_age_seconds)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: No recent executed production journey can be verified
      - alert: TerraBaseBackupAge
        expr: (time() - terrabase_backup_last_success_seconds{service="terrabase"} > 86400) and (terrabase_backup_last_success_seconds{service="terrabase"} > 0)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The oldest file shipment has not advanced for twenty-four hours
      - alert: AlertDeliveryHeartbeat
        expr: vector(1)
        labels:
          delivery_probe: heartbeat
        annotations:
          summary: Scheduled alert delivery probe
      - alert: AlertDeliveryProbeStale
        expr: (time() - max(terrascale_alert_delivery_probe_completed_timestamp_seconds) >= 900) and (max(terrascale_alert_delivery_probe_completed_timestamp_seconds) > 0)
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: No alert delivery probe completed in fifteen minutes
      - alert: AlertDeliveryEmailBudgetInvalid
        expr: terrascale_alert_delivery_email_budget_valid{job="service-readiness"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: 'The alert relay on {{ $labels.host }} has no valid rendered email budget and sends with the single-relay share'
          description: The relay found /etc/ts-monitoring/production/email-budget.json missing or invalid, so it uses the whole fleet share of 12 emails per hour and 288 per day. With several relays the fleet can exceed that allowance. Reinstall monitoring on the host with install.sh.
      - alert: AlertmanagerClusterDegraded
        expr: (max by (host) (alertmanager_cluster_members{job="monitoring-alertmanager"}) < on () group_left () count(up{job="monitoring-alertmanager"} == 1)) or (max by (host) (alertmanager_cluster_failed_peers{job="monitoring-alertmanager"}) > 0 and on () (count(up{job="monitoring-alertmanager"} == 1) >= count(up{job="monitoring-alertmanager"})))
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Alertmanager on {{ $labels.host }} sees fewer cluster members than reachable Alertmanagers'
          description: An Alertmanager whose gossip cluster is split or never formed delivers every notification independently, so each page arrives once per partition. Check NetBird UDP and TCP 9095 between the monitoring hosts and the cluster peers in /api/v2/status.
      - alert: AlertDeliveryProbeMissing
        expr: max(terrascale_alert_delivery_probe_completed_timestamp_seconds) == 0 or absent(terrascale_alert_delivery_probe_completed_timestamp_seconds)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: No completed alert delivery probe is observable

  - name: edge-certificates
    rules:
      - alert: EdgeCertificateExpiryWarning
        expr: ts_edge_certificate_not_after - time() < 21 * 86400
        labels:
          severity: warning
        annotations:
          summary: An edge certificate expires within twenty-one days
      - alert: EdgeCertificateExpiryCritical
        expr: ts_edge_certificate_not_after - time() < 5 * 86400
        labels:
          severity: critical
        annotations:
          summary: An edge certificate expires within five days
      - alert: EdgeCertificateMissing
        expr: ts_edge_certificate_names_missing > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: A served edge name has no valid certificate
