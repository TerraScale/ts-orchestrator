groups:
  - name: peer-topology
    interval: 5s
    rules:
      - alert: RuntimePeerTopologyMismatch
        expr: ts_orch_peer_topology_mismatch > 0 or ts_orch_peer_topology_generation_rejected > 0 or ts_orch_peer_topology_age_seconds > 30
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: A region's service peers file disagrees with the admitted placement, a peers generation was refused, or the region's attestation is missing or stale
          description: ts_orch_peer_topology_mismatch is 1 when the region's peers file for the service is missing or differs from the file rendered from the admitted placement, a region of the service has no admitted node, or the region's attestation is missing, names another topology or region count, or is dated in the future. ts_orch_peer_topology_generation_rejected is 1 when the region kept its last peers file because the nodes answering the mesh ping differ from the admitted placement. ts_orch_peer_topology_age_seconds above 30 means the newest attestation from the region is more than 30 seconds old. Inspect the service peers file and the admitted desired generation. A missed mesh ping does not authorize a drain. Do not repair production peer files by hand.
      - alert: PeerTopologyAttestationDown
        expr: up{job="peer-topology"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Peer topology attestation is unavailable
  - name: terrabase-operations
    rules:
      - alert: TerraBaseErasurePendingDay20
        expr: max(terrabase_purge_oldest_age_seconds) >= 1728000 or max(terrabase_backup_purge_oldest_age_seconds) >= 1728000
        labels:
          service: terrabase
          severity: warning
        annotations:
          summary: A TerraBase deletion has stayed pending for twenty days
          description: Inspect pending holders. Region removal requires explicit user authorization.
      - alert: TerraBaseBackupLag
        expr: terrabase_backup_lag_seconds{service="terrabase"} > 600
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: TerraBase backup lag exceeds ten minutes
      # First observed failures also fire; historical failures expire after five minutes.
      - alert: TerraBaseBackupAbandoned
        expr: (increase(terrabase_backup_abandoned_total{service="terrabase"}[5m]) > 0) or ((terrabase_backup_abandoned_total{service="terrabase"} > 0) unless terrabase_backup_abandoned_total{service="terrabase"} offset 5m)
        labels:
          severity: critical
        annotations:
          summary: TerraBase has abandoned a backup
      - alert: TerraBaseBackupHoles
        expr: (increase(terrabase_backup_holes_total{service="terrabase"}[5m]) > 0) or ((terrabase_backup_holes_total{service="terrabase"} > 0) unless terrabase_backup_holes_total{service="terrabase"} offset 5m)
        labels:
          severity: critical
        annotations:
          summary: TerraBase backup contains holes
      - alert: TerraBaseReplicationSendLag
        expr: terrabase_replica_max_lag_milliseconds{service="terrabase"} > 30000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: TerraBase replication send lag exceeds thirty seconds
      # A diverged replica rebootstraps itself; a repeat within 15 minutes waits, so this alert is the operator's signal.
      - alert: TerraBaseReplicaDiverged
        expr: (increase(terrabase_replica_verifications_total{service="terrabase",result="diverged"}[15m]) > 0) or ((terrabase_replica_verifications_total{service="terrabase",result="diverged"} > 0) unless terrabase_replica_verifications_total{service="terrabase",result="diverged"} offset 15m)
        labels:
          severity: critical
        annotations:
          summary: A TerraBase region replica diverged from its home
          description: The replica was deleted and bootstrapped again. Read the replica node's error log for the database and range; repeated divergence points at an engine or sync bug.
      - alert: TerraBaseReplicaUnverified
        expr: max by (host, region) (terrabase_replica_max_verification_age_seconds{service="terrabase"}) > 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A TerraBase region replica has gone an hour without a completed checksum verification
      - alert: TerraBaseMetricsDown
        expr: up{job="application-slo",service="terrabase"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: TerraBase metrics scrape failed
      - alert: TerraBaseHostMetricsDown
        expr: up{job="terrabase-host-storage"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: TerraBase host metrics are not scraped
          description: The terrabase-host-storage scrape of this host's TerraBase metrics on tcp 9091 has been down for two minutes. Check first that the NetBird policy gru-servers-to-servers-metrics is applied, then that TerraBase is listening on 9091 and that the host's NetBird address in /run/ts-orch-observability/storage.json answers.
      - alert: TerraBaseBackupDrillFailed
        expr: (increase(terrabase_backup_drills_total{service="terrabase",result="failed"}[5m]) > 0) or ((terrabase_backup_drills_total{service="terrabase",result="failed"} > 0) unless terrabase_backup_drills_total{service="terrabase",result="failed"} offset 5m)
        labels:
          severity: critical
        annotations:
          summary: TerraBase backup restore drill failed
      - alert: ServiceReadinessFailed
        expr: terrascale_service_readiness{service=~"terrabase|ts-auth|ts-dashboard"} == 0
        # Probe flaps shorter than five minutes never page; a recovery must hold
        # ten minutes before the alert resolves, so one outage is one alert.
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: Public service readiness failed
      - alert: AuthEmailProviderExhausted
        expr: sum by (service, region) ((increase(ts_auth_emails_total{service="ts-auth",outcome="provider_exhausted"}[5m]) > 0) or ((ts_auth_emails_total{service="ts-auth",outcome="provider_exhausted"} > 0) unless ts_auth_emails_total{service="ts-auth",outcome="provider_exhausted"} offset 5m)) > 0
        labels:
          severity: critical
        annotations:
          summary: Authentication email provider capacity exhausted
      - alert: AuthEmailDeliveryFailing
        expr: sum by (service, region) (increase(ts_auth_emails_total{service="ts-auth",outcome=~"admission_unavailable|failed|bounced"}[10m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Authentication email delivery failing
          description: ts-auth sends are ending as admission_unavailable, failed or bounced. Check the admission endpoint and provider response before users are locked out of sign-up.
      - alert: AuthEmailNoneSent
        expr: sum by (service, region) (increase(ts_auth_emails_total{service="ts-auth"}[6h])) > 0 unless sum by (service, region) (increase(ts_auth_emails_total{service="ts-auth",outcome=~"sent|accepted|queued"}[6h])) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'Authentication email: attempts but no successful send in 6 hours'

  - name: edge-listeners
    rules:
      - alert: EdgeListenerUnavailable
        expr: ts_orch_edge_listener_ready{job="host-storage"} == 0
        for: 1m
        labels:
          service: edge
          severity: critical
        annotations:
          summary: A public edge listener is unavailable
          description: Inspect listener bind errors. Other edge protocols continue serving; no manual release prerequisite is required.
  - name: desired-state
    rules:
      - alert: ServiceSpecInvalid
        expr: max by (service) (ts_orch_service_spec_invalid) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Stored service spec rejected; service not managed
          description: The mesh excluded this service from startup because its stored desired state fails validation. Its running task is left alone. Apply a corrected spec to restore management.
  - name: monitoring-coverage
    rules:
      - alert: ApplicationTaskMetricsDown
        expr: up{job="application-slo",service!="terrabase"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A running service task cannot be scraped
      - alert: ServiceTaskScrapeCoverageMissing
        expr: ts_host_service_tasks_expected{job="host-storage"} > on (host, region, service) (count by (host, region, service) (up{job="application-slo"}) or on (host, region, service) (0 * ts_host_service_tasks_expected{job="host-storage"}))
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: A service has fewer scrape targets than running tasks on a node
      - alert: HostServiceTaskInventoryMissing
        expr: |
          absent(ts_host_service_tasks_expected{job="host-storage",host="ts-sjc-1",region="sjc"}) or
          absent(ts_host_service_tasks_expected{job="host-storage",host="ts-sjc-2",region="sjc"}) or
          absent(ts_host_service_tasks_expected{job="host-storage",host="ts-fra-1",region="fra"}) or
          absent(ts_host_service_tasks_expected{job="host-storage",host="ts-fra-2",region="fra"}) or
          absent(ts_host_service_tasks_expected{job="host-storage",host="ts-gru-1",region="gru"}) or
          absent(ts_host_service_tasks_expected{job="host-storage",host="ts-gru-2",region="gru"})
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'Service task inventory is absent on {{ $labels.host }}'
      - alert: HostOOMKill
        expr: increase(ts_host_oom_kills_total{job="host-storage"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: 'The kernel killed a process on {{ $labels.host }} for lack of memory'
      - alert: CertificateExpirySoon
        expr: terrascale_certificate_expiry_timestamp_seconds - time() < 1814400
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A public service certificate expires within twenty-one days or cannot be verified
      - alert: MeshStoreLeaderUnavailable
        expr: ts_orch_mesh_store_leader_available == 0 or ts_orch_mesh_store_observed == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The mesh store has no observed leader
      - alert: MeshStoreQuorumUnavailable
        expr: ts_orch_mesh_store_quorum_available == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The mesh store cannot reach its metadata quorum
      - alert: HostUnitRestartLoop
        expr: increase(ts_host_unit_restarts_total[10m]) >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A host service repeatedly restarts
      - alert: ProductionJourneyFailed
        expr: terrascale_production_journey_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The latest executed production journey failed
      - alert: ProductionJourneyTelemetryMissing
        expr: terrascale_production_journey_observation_age_seconds > 3900 or time() - terrascale_production_journey_completed_timestamp_seconds > 129600 or absent(terrascale_production_journey_observation_age_seconds)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: No recent executed production journey can be verified
      - alert: TerraBaseBackupAge
        expr: (time() - terrabase_backup_last_success_seconds{service="terrabase"} > 86400) and (terrabase_backup_last_success_seconds{service="terrabase"} > 0)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The oldest file shipment has not advanced for twenty-four hours
