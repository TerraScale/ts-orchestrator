groups:
  - name: peer-topology
    interval: 5s
    rules:
      - alert: RuntimePeerTopologyMismatch
        expr: ts_orch_peer_topology_mismatch > 0 or ts_orch_peer_topology_runtime_mismatch > 0 or ts_orch_peer_topology_generation_rejected > 0 or ts_orch_peer_topology_age_seconds > 30
        for: 5s
        labels:
          severity: critical
        annotations:
          summary: Runtime peers disagree with independently admitted service placement
          description: Inspect the service topology manifest, native runtime verdict and admitted desired generation. A missed mesh ping does not authorize a drain. Do not repair production peer files by hand.
      - alert: PeerTopologyAttestationDown
        expr: up{job="peer-topology"} == 0
        for: 5s
        labels:
          severity: critical
        annotations:
          summary: Peer topology attestation is unavailable
  - name: terrabase-operations
    rules:
      - alert: TerraBaseErasurePendingDay20
        expr: max(terrabase_history_erasure_oldest_age_seconds) >= 1728000 or max(terrabase_purge_oldest_age_seconds) >= 1728000 or max(terrabase_history_erasure_epoch_stalled) > 0
        labels:
          service: terrabase
          severity: warning
        annotations:
          summary: A TerraBase deletion is overdue or stalled by a replica epoch change
          description: Inspect pending holders; escalate epoch stalls to engineering (TS-875), never override coverage. Region removal requires explicit user authorization.
      - alert: TerraBaseBackupLag
        expr: terrabase_backup_lag_seconds{service="terrabase",region="gru"} > 600
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: TerraBase backup lag exceeds ten minutes
      # First observed failures also fire; historical failures expire after five minutes.
      - alert: TerraBaseBackupAbandoned
        expr: (increase(terrabase_backup_abandoned_total{service="terrabase",region="gru"}[5m]) > 0) or ((terrabase_backup_abandoned_total{service="terrabase",region="gru"} > 0) unless terrabase_backup_abandoned_total{service="terrabase",region="gru"} offset 5m)
        labels:
          severity: critical
        annotations:
          summary: TerraBase has abandoned a backup
      - alert: TerraBaseBackupHoles
        expr: (increase(terrabase_backup_holes_total{service="terrabase",region="gru"}[5m]) > 0) or ((terrabase_backup_holes_total{service="terrabase",region="gru"} > 0) unless terrabase_backup_holes_total{service="terrabase",region="gru"} offset 5m)
        labels:
          severity: critical
        annotations:
          summary: TerraBase backup contains holes
      - alert: TerraBaseReplicationSendLag
        expr: terrabase_replication_send_lag_seconds{service="terrabase",region="gru"} > 30
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: TerraBase replication send lag exceeds thirty seconds
      - alert: TerraBaseMetricsDown
        expr: up{job="terrabase",region="gru"} == 0
        labels:
          severity: critical
        annotations:
          summary: TerraBase metrics scrape failed
      - alert: TerraBaseBackupDrillFailed
        expr: (increase(terrabase_backup_drills_total{service="terrabase",region="gru",result="failed"}[5m]) > 0) or ((terrabase_backup_drills_total{service="terrabase",region="gru",result="failed"} > 0) unless terrabase_backup_drills_total{service="terrabase",region="gru",result="failed"} offset 5m)
        labels:
          severity: critical
        annotations:
          summary: TerraBase backup restore drill failed
      - alert: ServiceReadinessFailed
        expr: terrascale_service_readiness{region="gru",service=~"terrabase|ts-auth|ts-dashboard"} == 0
        # Probe flaps shorter than five minutes never page; a recovery must hold
        # ten minutes before the alert resolves, so one outage is one alert.
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: Public service readiness failed
      - alert: AuthEmailProviderExhausted
        expr: sum by (service, region) ((increase(ts_auth_emails_total{service="ts-auth",outcome="provider_exhausted"}[5m]) > 0) or ((ts_auth_emails_total{service="ts-auth",outcome="provider_exhausted"} > 0) unless ts_auth_emails_total{service="ts-auth",outcome="provider_exhausted"} offset 5m)) > 0
        labels:
          severity: critical
        annotations:
          summary: Authentication email provider capacity exhausted

  - name: edge-listeners
    rules:
      - alert: EdgeListenerUnavailable
        expr: ts_orch_edge_listener_ready{job="host-storage"} == 0
        for: 1m
        labels:
          service: edge
          severity: critical
        annotations:
          summary: A public edge listener is unavailable
          description: Inspect listener bind errors and native wire readiness. Other edge protocols continue serving; no manual release prerequisite is required.
