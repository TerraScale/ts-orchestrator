route:
  receiver: local-relay
  group_by: [alertname, region, service]
  group_wait: 30s
  group_interval: 30s
  repeat_interval: 4h
  routes:
    - matchers: ['service="host-storage"']
      group_by: [service, severity]
    - matchers: ['alertname=~"RuntimePeerTopologyMismatch|PeerTopologyAttestationDown"']
      receiver: local-relay
      group_wait: 5s
      group_interval: 5s
receivers:
  - name: local-relay
    webhook_configs:
      - url: http://127.0.0.1:9094/alerts
        send_resolved: true
        max_alerts: 64

inhibit_rules:
  - source_matchers: ['alertname="HostStorageCritical"']
    target_matchers: ['alertname="HostStorageWarning"']
    equal: [host, region, service]
