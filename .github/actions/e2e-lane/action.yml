name: M1 e2e lane
description: Builds or downloads the agent and the lane's journey entry points, restores the pinned runtime packages and runs one lane.
inputs:
  lane:
    description: Lane name shown in the run and summary.
    required: true
  timeout:
    description: Existing lane execution limit in minutes.
    required: true
  entry:
    description: Lane script under test/e2e/m1.
    required: true
  packages:
    description: Go packages of the lane's journey entry points, separated by spaces.
    default: ''
outputs:
  clean:
    description: Whether the lane started without leftovers.
    value: ${{ steps.clean.outcome }}
  teardown:
    description: Whether the lane released its host resources.
    value: ${{ steps.teardown.outcome }}
runs:
  using: composite
  steps:
    - id: clean
      name: Check clean host for ${{ inputs.lane }}
      shell: bash
      run: bash test/e2e/m1/teardown.sh check
    - if: ${{ github.event_name == 'push' }}
      name: Build the agent and journey entry points from the warm cache
      shell: bash
      env:
        M1_PACKAGES: ${{ inputs.packages }}
      run: |
        read -r -a packages <<< "$M1_PACKAGES"
        timeout --foreground 300 test/e2e/m1/build.sh "$RUNNER_TEMP/m1-bin" ./cmd/terrascale-orchestrator "${packages[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
    - if: ${{ github.event_name != 'push' && inputs.packages != '' }}
      name: Build this lane's journey entry points
      shell: bash
      env:
        M1_PACKAGES: ${{ inputs.packages }}
      run: |
        read -r -a packages <<< "$M1_PACKAGES"
        timeout --foreground 300 test/e2e/m1/build.sh "$RUNNER_TEMP/m1-bin" "${packages[@]}"
    - if: ${{ github.event_name != 'push' }}
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: e2e-m1-bin
        path: ${{ runner.temp }}/m1-bin
    - if: ${{ github.event_name != 'push' }}
      shell: bash
      run: chmod +x "$RUNNER_TEMP/m1-bin/"*
    - name: Pinned runtime packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/ts-m1-runtime
        key: m1-runtime-${{ runner.arch }}-${{ hashFiles('deploy/m1/host-runtime.sh', 'internal/netbird/manager/server_cli.go', 'deploy/m1/install.sh') }}
    - name: Run ${{ inputs.lane }}
      shell: bash
      env:
        M1_ENTRY: ${{ inputs.entry }}
        M1_TIMEOUT: ${{ inputs.timeout }}
      run: |
        setsid timeout --foreground "${M1_TIMEOUT}m" bash "test/e2e/m1/$M1_ENTRY" "$RUNNER_TEMP/m1-bin/terrascale-orchestrator" &
        lane_pid=$!
        echo "$lane_pid" > "$RUNNER_TEMP/m1-lane-process-group"
        wait "$lane_pid"
    - id: teardown
      if: ${{ always() }}
      name: Tear down ${{ inputs.lane }}
      shell: bash
      run: timeout --foreground 180 bash test/e2e/m1/teardown.sh
