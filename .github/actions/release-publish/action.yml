name: Publish this main run's release
description: Sign this run's binaries and publish their existing GitHub and regional release channels.
inputs:
  domain-url:
    required: true
    description: OCI identity domain.
  client-id:
    required: true
    description: OCI token exchange client.
  client-secret:
    required: true
    description: OCI token exchange credential.
runs:
  using: composite
  steps:
    - name: Download this run's release binaries
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh release download "ci-${GITHUB_SHA}-run-${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --dir dist \
          --pattern terrascale-orchestrator-linux-amd64 --pattern terrascale-orchestrator-linux-arm64
        chmod +x dist/terrascale-orchestrator-linux-amd64

    - name: Attest the published binaries
      id: attest
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: |
          dist/terrascale-orchestrator-linux-amd64
          dist/terrascale-orchestrator-linux-arm64
        show-summary: false

    - name: Publish the attestation with the release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      run: |
        set -euo pipefail
        cp "$BUNDLE" dist/provenance.sigstore.json
        gh release upload "ci-${GITHUB_SHA}-run-${GITHUB_RUN_ID}" dist/provenance.sigstore.json --repo "${GITHUB_REPOSITORY}" --clobber

    - name: Publish the signed GitHub release
      shell: bash
      run: |
        set -euo pipefail
        tag="ci-${GITHUB_SHA}-run-${GITHUB_RUN_ID}"
        gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
        test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$GITHUB_SHA"

    - name: Write the release's channel document
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p channel
        dist/terrascale-orchestrator-linux-amd64 release channel prepare dist "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" channel/channel.json

    - name: Sign the channel document
      id: channel
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: channel/channel.json
        show-summary: false

    - name: Log in to each region's OCIR
      uses: ./.github/actions/ocir-login
      with:
        regions: us-sanjose-1 eu-frankfurt-1 sa-saopaulo-1
        domain-url: ${{ inputs.domain-url }}
        client-id: ${{ inputs.client-id }}
        client-secret: ${{ inputs.client-secret }}

    - name: Publish the release and its channel to every region's OCIR
      shell: bash
      env:
        BUNDLE: ${{ steps.channel.outputs.bundle-path }}
      run: |
        set -euo pipefail
        cp "$BUNDLE" channel/channel.sigstore.json
        dist/terrascale-orchestrator-linux-amd64 release channel publish dist channel
