name: Go toolchain and caches
description: Installs the pinned Go and restores the calling job's build and module caches.
inputs:
  cache:
    description: Cache name of the calling job; main pushes save it under the same name.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
        cache: false
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ inputs.cache }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-${{ inputs.cache }}-${{ hashFiles('go.sum') }}-
          go-${{ inputs.cache }}-
    - name: Verify the Go toolchain
      shell: bash
      run: test "$(go env GOVERSION)" = "go$(go list -m -f '{{.GoVersion}}')"
