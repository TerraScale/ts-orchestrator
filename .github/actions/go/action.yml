name: Go toolchain and caches
description: Installs the pinned Go and restores the calling job's build and module caches.
inputs:
  cache:
    description: Cache name of the calling job; main pushes save it under the same name.
    required: true
  modules-only:
    description: Restore module sources without compiled build outputs.
    default: 'false'
outputs:
  cache-paths:
    description: Paths restored by this job and saved by its main-push producer.
    value: ${{ steps.go.outputs.paths }}
  cache-hit:
    description: Whether this day already has a cache for these inputs.
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-key:
    description: Key under which a main push saves the calling job's caches.
    value: ${{ steps.cache.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version-file: go.mod
        cache: false
    - id: go
      name: Verify the Go toolchain
      shell: bash
      env:
        MODULES_ONLY: ${{ inputs.modules-only }}
      run: |
        version=$(go env GOVERSION)
        test "$version" = "go$(go list -m -f '{{.GoVersion}}')"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
        {
          echo 'paths<<EOF'
          if [ "$MODULES_ONLY" != true ]; then
            echo '~/.cache/go-build'
          fi
          echo '~/go/pkg/mod'
          echo EOF
        } >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.go.outputs.paths }}
        key: go-${{ inputs.cache }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum') }}-${{ steps.go.outputs.day }}
        restore-keys: |
          go-${{ inputs.cache }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum') }}-
