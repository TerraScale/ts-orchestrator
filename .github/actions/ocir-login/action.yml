name: OCIR login
description: Exchange this job's GitHub OIDC token for an OCI UPST of ts-ci-ocir and log docker in to each region's OCIR.
inputs:
  regions:
    description: Space-separated OCI region names, such as "us-sanjose-1 eu-frankfurt-1 sa-saopaulo-1".
    required: true
  domain-url:
    description: The identity domain URL, vars.OCI_IDENTITY_DOMAIN_URL.
    required: true
  client-id:
    description: The token-exchange app's client ID, vars.OCI_TOKEN_EXCHANGE_CLIENT_ID.
    required: true
  client-secret:
    description: The token-exchange app's client secret, secrets.OCI_TOKEN_EXCHANGE_CLIENT_SECRET.
    required: true
  repository:
    description: Exact namespace/repository path for a pull,push-scoped login in an isolated DOCKER_CONFIG.
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        REGIONS: ${{ inputs.regions }}
        DOMAIN_URL: ${{ inputs.domain-url }}
        CLIENT_ID: ${{ inputs.client-id }}
        CLIENT_SECRET: ${{ inputs.client-secret }}
        REPOSITORY: ${{ inputs.repository }}
      run: bash "$GITHUB_ACTION_PATH/login.sh"
