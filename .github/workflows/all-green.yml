name: all-green
# The one required check on main. It waits for every other check and commit status on the PR head
# and passes only when all of them passed or were skipped, so a PR opened with
# `gh pr merge --auto --squash` merges itself as soon as everything is green.
# It only waits (no tests), so it may run longer than the 5-minute test-job budget.
# After rerunning a failed job, rerun this check too (or push): it fails as soon as any check fails.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  checks: read
  statuses: read
concurrency:
  group: all-green-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  all-green:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for every other check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sleep 30  # let the other workflows of this push register their checks
          while :; do
            all=$( {
              gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                -q '.check_runs[] | select(.name != "all-green") | [.name, .status, (.conclusion // "")] | @tsv'
              gh api "repos/$REPO/commits/$SHA/status" \
                -q '.statuses[] | [.context, (if .state == "pending" then "pending" else "completed" end), .state] | @tsv'
            } | sed '/^$/d' )
            bad=$(printf '%s\n' "$all" | awk -F'\t' '$2 == "completed" && $3 !~ /^(success|skipped|neutral)$/')
            if [ -n "$bad" ]; then printf 'Failed:\n%s\n' "$bad"; exit 1; fi
            pending=$(printf '%s\n' "$all" | awk -F'\t' 'NF && $2 != "completed"')
            if [ -z "$pending" ]; then printf 'All green:\n%s\n' "$all"; exit 0; fi
            sleep 20
          done
