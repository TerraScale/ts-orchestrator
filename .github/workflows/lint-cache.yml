name: Lint cache

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go
        with:
          cache: lint-v2
      - run: |
          base=${{ github.event.before }}
          if ! git cat-file -e "$base^{commit}"; then
            base=$(git rev-parse HEAD^)
          fi
          make lint GO=go CHANGE_BASE="$base"
      - run: make --jobs=2 release-check GO=go
      - run: bash scripts/ci/audit-dependencies.sh source
      - run: bash scripts/ci/audit-dependencies.sh release
      - if: ${{ github.event_name == 'push' && steps.go.outputs.cache-hit != 'true' }}
        run: python3 scripts/ci/trim-go-cache.py
      - if: ${{ github.event_name == 'push' && steps.go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}
