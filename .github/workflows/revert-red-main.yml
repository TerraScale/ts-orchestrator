name: Revert red main
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions: {}
jobs:
  revert:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: TerraScale/.github/.github/workflows/revert-red-main.yml@a617bf5ca1de55464f761419574891b04d64d9c5
    with:
      run-id: ${{ format('{0}', github.event.workflow_run.id) }}
      head-sha: ${{ github.event.workflow_run.head_sha }}
      workflow-name: ${{ github.event.workflow_run.name }}
