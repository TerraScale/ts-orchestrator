name: App release canary

# Proves app auto-deploy after each successful main release: publishes
# ghcr.io/terrascale/app-canary (traefik/whoami relabelled with this commit,
# so every push is a new digest) and releases its linux/arm64 digest to every
# targeted region with `ts-orch release app`. Hosts admit this workflow's OIDC token
# for the app-canary service only (releasepush appServices). The job summary
# shows published -> serving in every region.
on:
  workflow_run:
    workflows: [TerraScale Orchestrator Go checks]
    types: [completed]
    branches: [main]

# An admitted rollout must finish or roll back before another canary starts.
concurrency:
  group: production-app-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # The receiver must be upgraded before the canary exercises the release API.
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' }}
    name: app-canary/release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: deploy/m1/regions.json
          sparse-checkout-cone-mode: false

      - name: Download the newest main ts-orch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Releases become visible before upload finishes; require the final qualification marker as well as the client.
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            --jq '[.[] | select(.draft == false and (.tag_name | startswith("ci-")) and
              any(.assets[]?; .name == "terrascale-orchestrator-linux-amd64") and
              any(.assets[]?; .name == "qualification.json"))] |
              sort_by(.created_at) | last | .tag_name // ""')
          test -n "$tag"
          gh release download "$tag" --repo TerraScale/ts-orchestrator --dir dist --pattern terrascale-orchestrator-linux-amd64
          chmod +x dist/terrascale-orchestrator-linux-amd64

      - name: Publish the canary image
        id: image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image=ghcr.io/terrascale/app-canary
          # shellcheck disable=SC2016 # Docker expands this build argument.
          printf '%s\n' 'FROM docker.io/traefik/whoami@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44' \
            'ARG REVISION' 'LABEL org.opencontainers.image.revision=$REVISION' > "${RUNNER_TEMP}/Dockerfile"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx create --use --driver docker-container >/dev/null
          # FROM + LABEL only: no emulation needed for arm64.
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg "REVISION=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${image}:${GITHUB_SHA}" --push "${RUNNER_TEMP}"
          digest=$(docker buildx imagetools inspect "${image}:${GITHUB_SHA}" --format '{{json .Manifest}}' |
            jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')
          test -n "$digest"
          echo "ref=${image}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Published \`${image}@${digest}\` (linux/arm64)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Release to every region
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          dist/terrascale-orchestrator-linux-amd64 release app --service app-canary --image "$IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
