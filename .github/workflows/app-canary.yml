name: App release canary

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: production-app-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' }}
    name: app-canary/release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: deploy/m1/regions.json
          sparse-checkout-cone-mode: false

      - name: Download the newest main ts-orch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            --jq '[.[] | select(.draft == false and (.tag_name | startswith("ci-")) and
              any(.assets[]?; .name == "terrascale-orchestrator-linux-amd64") and
              any(.assets[]?; .name == "qualification.json"))] |
              sort_by(.created_at) | last | .tag_name // ""')
          test -n "$tag"
          revision=${tag#ci-}
          revision=${revision%-run-*}
          echo "ORCHESTRATOR_REVISION=$revision" >> "$GITHUB_ENV"
          gh release download "$tag" --repo TerraScale/ts-orchestrator --dir dist --pattern terrascale-orchestrator-linux-amd64
          chmod +x dist/terrascale-orchestrator-linux-amd64

      - name: Observe the orchestrator on every registered host
        run: dist/terrascale-orchestrator-linux-amd64 release hosts "$ORCHESTRATOR_REVISION"

      - name: Publish the canary image
        id: image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image=ghcr.io/terrascale/app-canary
          printf '%s\n' 'FROM docker.io/traefik/whoami@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44' \
             'ARG REVISION' "LABEL org.opencontainers.image.revision=\$REVISION" > "${RUNNER_TEMP}/Dockerfile"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx create --use --driver docker-container >/dev/null
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg "REVISION=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${image}:${GITHUB_SHA}" --push "${RUNNER_TEMP}"
          digest=$(docker buildx imagetools inspect "${image}:${GITHUB_SHA}" --format '{{json .Manifest}}' |
            jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')
          test -n "$digest"
          echo "arm64=${digest}" >> "$GITHUB_OUTPUT"
          echo "ref=${image}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Published \`${image}@${digest}\` (linux/arm64)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/terrascale/app-canary
          subject-digest: ${{ steps.image.outputs.arm64 }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/terrascale/app-canary@${{ steps.image.outputs.arm64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/terrascale/app-canary
          subject-digest: ${{ steps.image.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      - name: Verify attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://ghcr.io/terrascale/app-canary@${{ steps.image.outputs.arm64 }}" \
            --owner TerraScale \
            --signer-workflow TerraScale/ts-orchestrator/.github/workflows/app-canary.yml \
            --bundle-from-oci

      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad

      - name: Attest the selected release
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          jq -cn --arg revision "$GITHUB_SHA" '{service:"app-canary", revision:$revision}' > "$RUNNER_TEMP/release-selection.json"
          cosign attest --yes --type https://terrascale.tech/attestations/release-selection/v1 \
            --predicate "$RUNNER_TEMP/release-selection.json" "$IMAGE"

      - name: Publish the selected image for host pulls
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: docker buildx imagetools create --prefer-index=false --tag ghcr.io/terrascale/app-canary:release "$IMAGE"

      - name: Observe the pulled release over HTTPS
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: dist/terrascale-orchestrator-linux-amd64 release wait --service app-canary --image "$IMAGE"
