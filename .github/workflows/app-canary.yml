name: App release canary

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: production-app-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' }}
    name: app-canary/release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            deploy/m1/regions.json
            .github/actions/ocir-login
          sparse-checkout-cone-mode: false

      - name: Download the newest main ts-orch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            --jq '[.[] | select(.draft == false and (.tag_name | startswith("ci-")) and
              any(.assets[]?; .name == "terrascale-orchestrator-linux-amd64") and
              any(.assets[]?; .name == "qualification.json"))] |
              sort_by(.created_at) | last | .tag_name // ""')
          test -n "$tag"
          revision=${tag#ci-}
          revision=${revision%-run-*}
          echo "ORCHESTRATOR_REVISION=$revision" >> "$GITHUB_ENV"
          gh release download "$tag" --repo TerraScale/ts-orchestrator --dir dist --pattern terrascale-orchestrator-linux-amd64
          chmod +x dist/terrascale-orchestrator-linux-amd64

      - name: Observe the orchestrator on every registered host
        run: dist/terrascale-orchestrator-linux-amd64 release hosts "$ORCHESTRATOR_REVISION"

      - uses: ./.github/actions/ocir-login
        with:
          regions: us-sanjose-1 eu-frankfurt-1 sa-saopaulo-1
          domain-url: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          client-id: ${{ vars.OCI_TOKEN_EXCHANGE_CLIENT_ID }}
          client-secret: ${{ secrets.OCI_TOKEN_EXCHANGE_CLIENT_SECRET }}

      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with:
          version: 1.3.6

      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad
        with:
          cosign-release: v3.0.2

      - name: Publish the canary image
        id: image
        shell: bash
        env:
          NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
        run: |
          set -euo pipefail
          test -n "$NAMESPACE"
          image="us-sanjose-1.ocir.io/$NAMESPACE/terrascale/app-canary"
          context="$RUNNER_TEMP/app-canary-build"
          mkdir -p "$context"
          printf '%s\n' 'FROM docker.io/traefik/whoami@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44' \
             'ARG REVISION' "LABEL org.opencontainers.image.revision=\$REVISION" > "$context/Dockerfile"
          docker buildx create --use --driver docker-container >/dev/null
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg "REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$image:$GITHUB_SHA" --push "$context"
          digest=$(docker buildx imagetools inspect "$image:$GITHUB_SHA" --format '{{json .Manifest}}' |
            jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')
          {
            echo "arm64=$digest"
            echo "repository=$image"
            echo "ref=$image@$digest"
            echo "fleet=app-canary@$digest"
          } >> "$GITHUB_OUTPUT"
          oras manifest fetch --output "$RUNNER_TEMP/app-canary-manifest.json" "$image@$digest"
          test "sha256:$(sha256sum "$RUNNER_TEMP/app-canary-manifest.json" | cut -d ' ' -f1)" = "$digest"

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.arm64 }}

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ${{ steps.image.outputs.ref }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        id: sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json

      - name: Attest the selected release
        run: |
          jq -cn --arg revision "$GITHUB_SHA" '{service:"app-canary", revision:$revision}' > "$RUNNER_TEMP/release-selection.json"
          cosign attest-blob --yes --new-bundle-format \
            --type https://terrascale.tech/attestations/release-selection/v1 \
            --predicate "$RUNNER_TEMP/release-selection.json" \
            --bundle "$RUNNER_TEMP/selection.sigstore.json" "$RUNNER_TEMP/app-canary-manifest.json"

      - name: Publish images and bundles in every environment
        shell: bash
        env:
          NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
          IMAGE: ${{ steps.image.outputs.ref }}
          DIGEST: ${{ steps.image.outputs.arm64 }}
          BUILD_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          media=application/vnd.dev.sigstore.bundle.v0.3+json
          cp "$BUILD_BUNDLE" "$RUNNER_TEMP/build.sigstore.json"
          cp "$SBOM_BUNDLE" "$RUNNER_TEMP/sbom.sigstore.json"
          cd "$RUNNER_TEMP"
          for destination in us-sanjose-1/terrascale eu-frankfurt-1/terrascale sa-saopaulo-1/terrascale us-sanjose-1/terrascale-stg; do
            region=${destination%/*}
            prefix=${destination#*/}
            repo="$region.ocir.io/$NAMESPACE/$prefix/app-canary"
            if [ "$repo@$DIGEST" != "$IMAGE" ]; then
              oras cp "$IMAGE" "$repo@$DIGEST"
            fi
            test "$(oras resolve "$repo@$DIGEST")" = "$DIGEST"
            for bundle in build.sigstore.json selection.sigstore.json sbom.sigstore.json; do
              oras attach --distribution-spec v1.1-referrers-tag --artifact-type "$media" "$repo@$DIGEST" "$bundle:$media"
            done
            oras discover --distribution-spec v1.1-referrers-tag --artifact-type "$media" --format json "$repo@$DIGEST" |
              jq -e '.referrers | length >= 3'
            "$GITHUB_WORKSPACE/dist/terrascale-orchestrator-linux-amd64" release verify-provenance \
              --image "$repo@$DIGEST" \
              --workflow TerraScale/ts-orchestrator/.github/workflows/app-canary.yml@refs/heads/main \
              --revision "$GITHUB_SHA"
          done
          for destination in us-sanjose-1/terrascale eu-frankfurt-1/terrascale sa-saopaulo-1/terrascale us-sanjose-1/terrascale-stg; do
            region=${destination%/*}
            prefix=${destination#*/}
            repo="$region.ocir.io/$NAMESPACE/$prefix/app-canary"
            oras tag "$repo@$DIGEST" release
            test "$(oras resolve "$repo:release")" = "$DIGEST"
          done

      - name: Observe the pulled release over HTTPS
        env:
          IMAGE: ${{ steps.image.outputs.fleet }}
        run: dist/terrascale-orchestrator-linux-amd64 release wait --service app-canary --image "$IMAGE"
