name: TerraScale E2E

on:
  pull_request:
    paths:
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
      - 'scripts/e2e/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Checks to run (local HTTP-fake contracts; prod read-only approved project)
        required: true
        default: local
        type: choice
        options:
          - local
          - prod

# Production dispatches keep their run and serialize at the job below.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.target == 'prod' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && !(github.event_name == 'workflow_dispatch' && inputs.target == 'prod') }}

permissions:
  contents: read

env:
  CI: 'true'
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GOFLAGS: -p=4
  GOMAXPROCS: '2'
  E2E_REPORT: report.json

defaults:
  run:
    shell: bash
    working-directory: e2e

jobs:
  local:
    name: HTTP-fake contracts
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'local' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: ${{ github.ref == 'refs/heads/main' }}
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - name: Verify the source revision and Go toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA:?event SHA is required}"
          test "$(go env GOVERSION)" = go1.27.3
          mkdir -p "$(go env GOCACHE)" "$(go env GOMODCACHE)"
          test -w "$(go env GOCACHE)"
          test -w "$(go env GOMODCACHE)"

      - name: Test, vet and build the standalone E2E module
        run: |
          set -euo pipefail
          go test -race ./...
          go vet ./...
          go build ./...
          python3 ../scripts/e2e/install-production-credential.py --self-test


  prod:
    environment: production
    name: production E2E (manual only)
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'prod' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: production-e2e
      cancel-in-progress: false
    env:
      E2E_TARGET: prod
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: ${{ github.ref == 'refs/heads/main' }}
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - name: Verify the source revision and Go toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA:?event SHA is required}"
          test "$(go env GOVERSION)" = go1.27.3
          mkdir -p "$(go env GOCACHE)" "$(go env GOMODCACHE)"
          test -w "$(go env GOCACHE)"
          test -w "$(go env GOMODCACHE)"

      - name: Read the approved project and verify authorization denials
        env:
          E2E_PROJECT_CREDENTIAL: ${{ secrets.E2E_PROJECT_CREDENTIAL }}
          E2E_ORGANIZATION_ID: ${{ vars.E2E_ORGANIZATION_ID }}
          E2E_PROJECT_ID: ${{ vars.E2E_PROJECT_ID }}
          E2E_DATABASE: ${{ vars.E2E_DATABASE }}
          E2E_UNRELATED_PROJECT_ID: ${{ vars.E2E_UNRELATED_PROJECT_ID }}
        run: go run .

      - name: Retain the production JSON report even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-prod-${{ github.sha }}-${{ github.run_id }}
          path: e2e/report.json
          if-no-files-found: warn
          retention-days: 30
