name: Multi-region mesh check

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    name: multi-region/mesh-check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the region list
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            deploy/m1/regions.json
          sparse-checkout-cone-mode: false

      - name: Download the newest main release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            --jq '[.[] | select(.draft == false and (.tag_name | startswith("ci-")) and
              any(.assets[]?; .name == "terrascale-orchestrator-linux-amd64") and
              any(.assets[]?; .name == "qualification.json"))] |
              sort_by(.created_at) | last | .tag_name // ""')
          test -n "$tag" || { echo "no ci-* release found" >&2; exit 1; }
          echo "Release: \`${tag}\`" | tee -a "${GITHUB_STEP_SUMMARY}"
          gh release download "$tag" --repo "${GITHUB_REPOSITORY}" --dir dist --pattern terrascale-orchestrator-linux-amd64
          chmod +x dist/terrascale-orchestrator-linux-amd64

      - name: Read authenticated health and fetch in every region
        shell: bash
        run: |
          set -euo pipefail
          status=0
          dist/terrascale-orchestrator-linux-amd64 release mesh-check > "${RUNNER_TEMP}/mesh-check.md" || status=$?
          tee -a "${GITHUB_STEP_SUMMARY}" < "${RUNNER_TEMP}/mesh-check.md"
          exit "$status"
