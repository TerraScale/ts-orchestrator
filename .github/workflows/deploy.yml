name: Deploy ts-orch to every region

# ci.yml dispatches this workflow as its last step on main (trigger "ci"),
# once the revision's release is retained. Every green main push deploys;
# docs/deploy-pipeline.md lists every input. Each region signs, publishes and
# rolls independently; quorum, health gates and automatic rollback remain.
# A failure never cancels another region. Deployments
# queue rather than cancel each other, so CI never abandons a region
# mid-rollout: a running deployment always finishes, a newer dispatch
# replaces one still pending, and a queued deployment that a newer qualified
# revision has overtaken skips itself. An operator can dispatch a
# CI-qualified main revision, with its ci.yml run, that is newer than every
# region's channel.
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Full SHA of a main revision with a successful ci.yml run
        required: true
        type: string
      source_ci_run_id:
        description: The revision's successful ci.yml run ID
        required: true
        type: string
      source_ci_run_number:
        description: The revision's successful ci.yml run number
        required: true
        type: string
      trigger:
        description: "ci for the automatic deployment, manual otherwise"
        required: false
        default: manual
        type: string

concurrency:
  group: ts-orchestrator-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  deploy:
    environment: production
    permissions:
      contents: read
      actions: read
    if: ${{ github.ref == 'refs/heads/main' }}
    name: deploy/every-region
    runs-on: ubuntu-24.04
    # Five minutes for the dispatching CI job to finish, thirty for the
    # concurrent region rollouts, and fifteen for signing/build setup.
    timeout-minutes: 50
    env:
      SOURCE_SHA: ${{ inputs.source_revision }}
      SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
      SOURCE_CI_RUN_NUMBER: ${{ inputs.source_ci_run_number }}
    steps:
      # The lineage proof needs main's history.
      - name: Check out the named source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      # Verify main ancestry before any deployment credential is used.
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'


      - name: Verify the source revision and Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ ${SOURCE_SHA} =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git merge-base --is-ancestor "${SOURCE_SHA}" refs/remotes/origin/main
          test "$(go env GOVERSION)" = go1.27.1
          printf 'GOCACHE=%s\nGOMODCACHE=%s\n' "${RUNNER_TEMP}/go/build" "${RUNNER_TEMP}/go/mod" >> "${GITHUB_ENV}"
      - name: Wait for ci.yml and skip a failed or overtaken revision
        id: gate
        if: ${{ inputs.trigger == 'ci' }}
        shell: bash
        env:
          GATE_WORKFLOW: deploy.yml
        run: |
          bash scripts/ci/image-superseded.sh "${SOURCE_SHA}" "${SOURCE_CI_RUN_ID}" "${SOURCE_CI_RUN_NUMBER}" 300

      - name: Sign and deploy every region concurrently
        if: ${{ steps.gate.outputs.skip != 'true' }}
        shell: bash
        env:
          TS_OBJECT_NAMESPACE: ${{ vars.TS_OBJECT_NAMESPACE }}
          TS_RELEASE_VAULT_ID: ${{ vars.TS_RELEASE_VAULT_ID }}
          TS_RELEASE_LEAF_SECRET: ${{ vars.TS_RELEASE_LEAF_SECRET }}
          TS_DEPLOY_OCI_USER: ${{ vars.TS_DEPLOY_OCI_USER }}
          TS_DEPLOY_OCI_TENANCY: ${{ vars.TS_DEPLOY_OCI_TENANCY }}
          TS_DEPLOY_OCI_FINGERPRINT: ${{ vars.TS_DEPLOY_OCI_FINGERPRINT }}
          TS_DEPLOY_OCI_KEY: ${{ secrets.TS_DEPLOY_OCI_KEY }}
        run: bash scripts/ci/deploy-fleet.sh
