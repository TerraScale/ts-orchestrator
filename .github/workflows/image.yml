name: Qualified GRU ARM64 image

# ci.yml dispatches this workflow as its last step on main (trigger "ci"),
# once the revision's release is retained, so this job never holds a builder
# slot while the checks run. The gate still confirms that ci.yml run
# succeeded and skips the build if it failed, was cancelled or has been
# overtaken. Automatic builds queue rather than cancel each other, so a
# build in progress always finishes, and a queued build that a newer
# qualified revision has overtaken skips itself. An operator can dispatch
# any CI-qualified main revision; those runs are always built.
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Full SHA of a main revision with a successful ci.yml run
        required: true
        type: string
      source_ci_run_id:
        description: Dispatching ci.yml run ID for automatic builds
        required: false
        type: string
      source_ci_run_number:
        description: Dispatching ci.yml run number for automatic builds
        required: false
        type: string
      trigger:
        description: "ci for the automatic build, manual otherwise"
        required: false
        default: manual
        type: string

concurrency:
  group: ts-orchestrator-image-${{ inputs.trigger == 'ci' && 'ci' || inputs.source_revision }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  image:
    environment: production
    permissions:
      contents: write
      actions: read
    if: ${{ github.ref == 'refs/heads/main' }}
    name: build/qualified-gru-arm64-image
    runs-on: ubuntu-24.04
    # 100 minutes for the gate's wait (6000s), 10 for the qualification
    # budget (scripts/ci/qualify-image.sh) and 65 for the build and release.
    timeout-minutes: 175
    env:
      SOURCE_SHA: ${{ inputs.source_revision }}
      SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
      SOURCE_CI_RUN_NUMBER: ${{ inputs.source_ci_run_number }}
    steps:
      - name: Check out the named source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - name: Verify the source revision and Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ ${SOURCE_SHA} =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git merge-base --is-ancestor "${SOURCE_SHA}" refs/remotes/origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(go env GOVERSION)" = go1.27.3
          printf 'source=%s tree=%s kvm=%s\n' "${SOURCE_SHA}" "$(git rev-parse 'HEAD^{tree}')" \
            "$([[ -w /dev/kvm ]] && echo available || echo unavailable)"

      - name: Install Nix for checksum-pinned image tooling
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - name: Prepare the pinned image tools
        shell: bash
        run: bash deploy/image/tools.sh true

      - name: Wait for ci.yml and skip a failed or overtaken revision
        id: gate
        if: ${{ inputs.trigger == 'ci' }}
        shell: bash
        run: |
          bash scripts/ci/image-superseded.sh "${SOURCE_SHA}" "${SOURCE_CI_RUN_ID}" "${SOURCE_CI_RUN_NUMBER}" 6000

      # Qualification tier (T2): real TerraBase and cross-language fixtures,
      # before any image exists. Every suite runs; a missing fixture or a
      # skipped test fails the build. Fixture requirements are documented in
      # scripts/ci/qualify-image.sh.
      - name: Qualify the revision against real infrastructure
        if: ${{ steps.gate.outputs.skip != 'true' }}
        shell: bash
        env:
          TS_TEST_TIER: qualification
          TS_QUALIFICATION_SUITES: terrabase-walkthrough terrabase-successor native-validator rendered-sjc-enrollment terrabase-binary terrabase-release ts-auth-terrabase
        run: bash scripts/ci/qualify-image.sh

      # The gate has already waited for the dispatching ci.yml run, and a
      # manual dispatch names a revision whose run has succeeded, so the
      # build checks the run once instead of polling it again.
      - name: Build the image from the qualified candidate
        if: ${{ steps.gate.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/image/tools.sh \
            bash deploy/image/build-image.sh --source "${SOURCE_SHA}" --out dist/image

      # Keep unsigned bytes available to the disposable qualifier even when
      # no final-image production proof exists yet.
      - name: Retain the unsigned image candidate for disposable qualification
        if: ${{ steps.gate.outputs.skip != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-image-${{ inputs.source_revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/image/terrascale-gru-arm64.qcow2
            dist/image/guest-kernel
            dist/image/image-qualification.json
            dist/image/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Admit retained qualification of the final image bytes
        id: image_admission
        if: ${{ steps.gate.outputs.skip != 'true' }}
        shell: bash
        run: bash scripts/ci/qualify-image-production.sh dist/image

      - name: Retain final-image admission diagnostics
        if: ${{ always() && steps.gate.outputs.skip != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-production-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/image/image-production-admission.jsonl
          if-no-files-found: ignore
          retention-days: 30

      - name: Retain the image release
        if: ${{ steps.gate.outputs.skip != 'true' && steps.image_admission.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/image/publish-image.sh dist/image
