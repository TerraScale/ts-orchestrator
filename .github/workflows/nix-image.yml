name: Nix image

on:
  workflow_call:

permissions:
  contents: read

env:
  NIX_INSTALLER_URL: https://releases.nixos.org/nix/nix-2.35.6/install
  NIX_INSTALLER_SHA256: 6f7bf206efb54cd4941fb274930dbc74fdfc16fcb06757ef261c8d7d69cfd60e

jobs:
  oci-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Fetch and verify the Nix 2.35.6 installer
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nix-install" "$NIX_INSTALLER_URL"
          echo "$NIX_INSTALLER_SHA256  $RUNNER_TEMP/nix-install" | sha256sum -c
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
        with:
          install_url: file://${{ runner.temp }}/nix-install
      - name: Allow unprivileged user namespaces for systemd-repart
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build packages.aarch64-linux.oci-image
        run: nix build -L .#packages.aarch64-linux.oci-image
      - name: Image size
        run: |
          image=result/terrascale-node.qcow2
          nix shell --inputs-from . nixpkgs#qemu-utils -c qemu-img info "$image" | tee info.txt
          {
            echo "### OCI image"
            echo '```'
            ls -l "$image"
            cat info.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
