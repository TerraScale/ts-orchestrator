name: TerraScale Orchestrator Go checks

# Main qualifies Fast and publishes that build; Slow runs independently.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Builds may overlap an admitted release. A newer revision replaces obsolete
# build work; release-push below always lets the active rollout finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # The revision this change starts from; empty for scheduled and manual runs.
  CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  # Bound nested parallelism: make, Go packages and race shards otherwise
  # each try to use every CPU of the runner.
  GOFLAGS: -p=4
  GOMAXPROCS: '2'
  # Pull requests retain their existing affected-package checks.
  TS_TEST_TIER: ${{ github.event_name == 'pull_request' && 'change' || 'full' }}

jobs:
  # Pull requests use one runner; main has one Fast/build runner.
  change:
    if: ${{ github.event_name == 'pull_request' }}
    name: ${{ github.event_name == 'pull_request' && 'test' || 'verify/change' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TS_CI_SHARD: 1/1
      TS_RACE_MACHINE: '1'
      GOMAXPROCS: '1'
      TS_RACE_PACKAGE_JOBS: '1'
      TS_RACE_IDLE_JOBS: '1'
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks for changed files
        id: changes
        run: |
          set -euo pipefail
          cpus=$(getconf _NPROCESSORS_ONLN)
          echo "TS_RACE_JOBS=$cpus" >> "$GITHUB_ENV"
          echo "CPU budget: $cpus race workers, GOMAXPROCS=$GOMAXPROCS per worker"
          python3 scripts/ci/check-inputs.py "$CHANGE_BASE" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/verify
        if: ${{ steps.changes.outputs.checks == 'true' }}
      - uses: ./.github/actions/go
        if: ${{ steps.changes.outputs.checks != 'true' }}
        with:
          cache: race-1
      - name: Audit selected and locally replaced package graphs
        run: bash scripts/ci/audit-dependencies.sh source

  # Fast and publication share the compiled Go cache and exact source revision.
  build:
    concurrency:
      group: fast-build-${{ github.ref }}
      cancel-in-progress: true
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: write
      actions: read
    # A release cannot publish until its own Fast tests pass.
    name: verify/go + artifact/linux-amd64-arm64
    outputs:
      publication: ${{ steps.inputs.outputs.publication }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          cache: release
      - name: Scan legacy terms within CI
        run: |
          scanner="$RUNNER_TEMP/legacy-scanner"
          mkdir -p "$scanner"
          for file in scan.py terms.json allow-list.json owners.json; do
            curl --fail --silent --show-error --location --retry 2 \
              "https://raw.githubusercontent.com/TerraScale/terrascale/a2e200187ffe32084a10f2a81c9e3e1f59b49a29/scripts/legacy-scan/$file" \
              --output "$scanner/$file" &
          done
          wait
          base="$CHANGE_BASE"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            base=$(git rev-parse "$SOURCE_SHA^")
          fi
          # A temporary index makes the existing scanner see changed files only.
          export GIT_INDEX_FILE="$RUNNER_TEMP/legacy-changed-index"
          git read-tree --empty
          git diff --name-only --diff-filter=ACMR -z "$base" "$SOURCE_SHA" | git update-index --add -z --stdin
          python3 "$scanner/scan.py" --repo ts-orchestrator --root . --output "$RUNNER_TEMP/legacy-hits.md"
      - name: Verify exact-commit dev-host Fast evidence
        id: fast-proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # ts-ship skips tests for documentation-only commits, the same set
          # as its docs() rule. Their evidence is the newest first-parent
          # ancestor that changed anything else.
          docs_only() {
            local path
            while IFS= read -r path; do
              case "$path" in
                .cos/*|AGENTS.md|*/AGENTS.md|CLAUDE.md|*/CLAUDE.md) ;;
                src/*|tests/*|scripts/*|docs-site/*) return 1 ;;
                *.md|*.MD|*.mdx|*.rst) ;;
                docs/*.png|docs/*.jpg|docs/*.jpeg|docs/*.gif|docs/*.webp|docs/*.svg) ;;
                *) return 1 ;;
              esac
            done < <(git diff --no-renames --name-only "$1^" "$1")
          }
          evidence=$GITHUB_SHA
          for _ in $(seq 100); do
            git rev-parse --verify --quiet "$evidence^" > /dev/null && docs_only "$evidence" || break
            evidence=$(git rev-parse "$evidence^")
          done
          # Public commit metadata requires no additional token permission.
          if statuses=$(curl --fail --silent --show-error --max-time 15 --retry 2 \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$evidence/statuses?per_page=100") &&
             jq -e '[.[] | select(.context | startswith("ts-ship/"))] | group_by(.context) | map(max_by(.id)) | length > 0 and all(.[]; .state == "success" and ((.creator.login // "" | ascii_downcase) == "mariogk"))' <<< "$statuses" > /dev/null; then
            echo 'verified=true' >> "$GITHUB_OUTPUT"
            echo "Affected Fast passed on a dev host for $evidence; verified ts-ship statuses by MarioGK; later commits to $GITHUB_SHA change documentation only." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'verified=false' >> "$GITHUB_OUTPUT"
          fi
      # Compilation has its own clock, as in ts-ship: the 5-minute Fast
      # budget measures test execution, not a cold build cache.
      - name: Compile Fast test binaries
        if: steps.fast-proof.outputs.verified != 'true'
        timeout-minutes: 10
        run: make test-fast-build GO=go
      - name: Qualify this revision with Fast tests
        if: steps.fast-proof.outputs.verified != 'true'
        timeout-minutes: 5
        run: make test-fast GO=go
      - name: Audit release package graphs
        run: bash scripts/ci/audit-dependencies.sh source
      - name: Compare executable inputs with retained qualification
        id: inputs
        shell: bash
        env:
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          status=0
          python3 -B scripts/ci/release-inputs-changed.py || status=$?
          case $status in
            0) echo 'publication=required' >> "$GITHUB_OUTPUT" ;;
            3) echo 'publication=unchanged' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Build and verify this revision's static release binaries
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        shell: bash
        run: make --jobs=2 release-check GO=go
      - name: Audit both actual release binaries before publication
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        run: bash scripts/ci/audit-dependencies.sh release

      - name: Retain verified binaries and qualification manifest
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-qualification.sh
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-release-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # Push the retained release to every region's ts-orch over NATS
  # (deploy/m1/regions.json); fails when any region does not serve it. Only
  # this job can mint the GitHub OIDC token that is the push credential.
  release-push:
    needs: [build]
    if: ${{ always() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.publication == 'required' }}
    name: deploy/release-push
    concurrency:
      group: production-ts-orch
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the region list
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: deploy/m1/regions.json
          sparse-checkout-cone-mode: false

      - name: Download this run's release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "ci-${GITHUB_SHA}-run-${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --dir dist \
            --pattern terrascale-orchestrator-linux-amd64 --pattern terrascale-orchestrator-linux-arm64
          chmod +x dist/terrascale-orchestrator-linux-amd64

      - name: Push the release to every region
        shell: bash
        run: |
          set -euo pipefail
          status=0
          dist/terrascale-orchestrator-linux-amd64 release push --sha "${GITHUB_SHA}" --dir dist \
            > "${RUNNER_TEMP}/release-push.jsonl" || status=$?
          cat "${RUNNER_TEMP}/release-push.jsonl"
          jq -r '"| \(.region) | \(.state // "-") | \(.connect_ms) | \(.accepted_ms) | \(.serving_ms) | \(.error // "") |"' "${RUNNER_TEMP}/release-push.jsonl" \
            | { printf '| Region | State | Connect ms | Accepted ms | Serving ms | Error |\n|---|---|---|---|---|---|\n'; cat; } >> "${GITHUB_STEP_SUMMARY}"
          exit "$status"
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-push-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-push.jsonl
          if-no-files-found: ignore
          retention-days: 30

  test:
    if: ${{ always() }}
    needs: [change, build]
    uses: TerraScale/.github/.github/workflows/result.yml@3a54c0184eacdc45466c1123bca67a99db62e91c
    with:
      result: ${{ github.event_name == 'pull_request' && needs.change.result || needs.build.result }}
