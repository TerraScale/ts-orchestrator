name: CI

on:
  schedule:
    - cron: '23 4 * * *'
  pull_request:
  push:
    branches: [main]

# Builds may overlap an admitted release. A newer revision replaces obsolete
# build work; release-push below always lets the active rollout finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  lint:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          cache: lint
      - run: make lint GO=go
      - run: make --jobs=2 release-check GO=go
      - run: bash scripts/ci/audit-dependencies.sh source
      - run: bash scripts/ci/audit-dependencies.sh release

  e2e-lane:
    if: ${{ github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: core, entry: run.sh, timeout: 8}
          - {lane: websocket, entry: websocket.sh, timeout: 8}
          - {lane: certificates, entry: certificates/run.sh, timeout: 5, packages: "./test/e2e/m1/certificates"}
          - {lane: fabric, entry: fabric/run.sh, timeout: 3, packages: "./test/e2e/m1/fabric"}
          - {lane: regional, entry: regional.sh, timeout: 3, packages: "./test/e2e/m1/regional"}
          - {lane: nodelist, entry: nodelist.sh, timeout: 8, packages: "./test/e2e/m1/nodelist"}
          - {lane: restarts, entry: restarts.sh, timeout: 8, packages: "./test/e2e/m1/lifecycle ./test/e2e/m1/lifecycle/server"}
          - {lane: readiness, entry: readiness.sh, timeout: 10, packages: "./test/e2e/m1/lifecycle ./test/e2e/m1/lifecycle/server"}
          - {lane: rollback, entry: rollback.sh, timeout: 8}
          - {lane: host-logs, entry: host-logs.sh, timeout: 12}
          - {lane: monitoring, entry: monitoring.sh, timeout: 8, packages: "./test/e2e/m1/monitoring"}
          - {lane: boot-order, entry: boot-order.sh, timeout: 8, packages: "./test/e2e/m1/boot-order"}
          - {lane: updater-preflight, entry: updater-preflight.sh, timeout: 12}
          - {lane: host-credentials, entry: host-credentials.sh, timeout: 5, packages: "./test/e2e/m1/host-credentials"}
          - {lane: release-contracts, entry: release-contracts.sh, timeout: 5, packages: "./test/e2e/m1/revision-gate ./test/e2e/m1/vault-policy"}
          - {lane: metadata-upgrade, entry: metadata-upgrade.sh, timeout: 8}
          - {lane: rollout, entry: rollout.sh, timeout: 10}
          - {lane: rollout-install, entry: rollout-install.sh, timeout: 10}
          - {lane: recovery, entry: recovery.sh, timeout: 5}
          - {lane: operator, entry: operator.sh, timeout: 8, packages: "./test/e2e/m1/operator-truth ./test/e2e/m1/startup"}
          - {lane: data-volume, entry: data-volume.sh, timeout: 8, packages: "./test/e2e/m1/region-volume ./test/e2e/m1/data-mount ./test/e2e/m1/cloudinit"}
    name: e2e-m1 / ${{ matrix.lane }}
    concurrency:
      group: e2e-m1-${{ matrix.lane }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: ${{ matrix.lane == 'certificates' && '0' || '1' }}
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go
        with:
          cache: e2e-arm64
      - name: Build the agent and journey entry points from the warm cache
        env:
          M1_PACKAGES: ${{ matrix.packages }}
        run: |
          read -r -a packages <<< "$M1_PACKAGES"
          test/e2e/m1/build.sh "$RUNNER_TEMP/m1-bin" "${packages[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pinned runtime packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ts-m1-runtime
          key: m1-runtime-${{ runner.arch }}-${{ hashFiles('deploy/m1/host-runtime.sh', 'internal/netbird/manager/server_cli.go', 'deploy/m1/install.sh') }}
      - name: Run the lane
        run: bash "test/e2e/m1/${{ matrix.entry }}" "$RUNNER_TEMP/m1-bin/terrascale-orchestrator"
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.lane == 'core' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go.outputs.cache-key }}

  e2e-m1:
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: e2e-lane
    concurrency:
      group: e2e-m1-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - env:
          LANES: ${{ needs.e2e-lane.result }}
        run: test "$LANES" = success

  caller-key-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          cache: lint
      - id: paths
        run: python3 test/e2e/m1/callerkey/inputs.py

  caller-key-build:
    needs: [caller-key-changes]
    if: ${{ needs.caller-key-changes.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go
        with:
          cache: lint
      - name: Build the overlay command and journey once
        run: bash test/e2e/m1/callerkey/build.sh "$RUNNER_TEMP/caller-key-bin"
      - name: Prove the shard partition
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/caller-key-bin/callerkey"
          for shard in {0..7}; do
            "$binary" list "$shard" 8
          done | sort > "$RUNNER_TEMP/sharded.txt"
          "$binary" list | sort > "$RUNNER_TEMP/unsharded.txt"
          diff -u "$RUNNER_TEMP/unsharded.txt" "$RUNNER_TEMP/sharded.txt"
          test -z "$(uniq -d "$RUNNER_TEMP/sharded.txt")"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caller-key-bin
          path: |
            ${{ runner.temp }}/caller-key-bin/callerkey
            ${{ runner.temp }}/caller-key-bin/terrascale-orchestrator
          retention-days: 1

  caller-key:
    needs: [caller-key-changes, caller-key-build]
    if: ${{ needs.caller-key-changes.outputs.changed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    name: caller-key / ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: caller-key-bin
          path: ${{ runner.temp }}/caller-key-bin
      - name: Run caller-key lifecycle and recovery shard
        run: |
          set -euo pipefail
          start=$(date +%s)
          chmod +x "$RUNNER_TEMP/caller-key-bin/"*
          "$RUNNER_TEMP/caller-key-bin/callerkey" run "$RUNNER_TEMP/caller-key-bin/terrascale-orchestrator" "${{ matrix.shard }}" 8
          echo "caller-key shard ${{ matrix.shard }}/8: $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

  build:
    concurrency:
      group: fast-build-${{ github.ref }}
      cancel-in-progress: true
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
      actions: read
    name: verify/go + artifact/linux-amd64-arm64
    outputs:
      publication: ${{ steps.inputs.outputs.publication }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go
        with:
          cache: release
      - name: Scan legacy terms within CI
        run: |
          scanner="$RUNNER_TEMP/legacy-scanner"
          mkdir -p "$scanner"
          for file in scan.py terms.json allow-list.json owners.json; do
            curl --fail --silent --show-error --location --retry 2 \
              "https://raw.githubusercontent.com/TerraScale/terrascale/a2e200187ffe32084a10f2a81c9e3e1f59b49a29/scripts/legacy-scan/$file" \
              --output "$scanner/$file" &
          done
          wait
          base="$CHANGE_BASE"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            base=$(git rev-parse "$SOURCE_SHA^")
          fi
          # A temporary index makes the existing scanner see changed files only.
          export GIT_INDEX_FILE="$RUNNER_TEMP/legacy-changed-index"
          git read-tree --empty
          git diff --name-only --diff-filter=ACMR -z "$base" "$SOURCE_SHA" | git update-index --add -z --stdin
          python3 "$scanner/scan.py" --repo ts-orchestrator --root . --output "$RUNNER_TEMP/legacy-hits.md"
      - name: Audit release package graphs
        run: bash scripts/ci/audit-dependencies.sh source
      - name: Compare executable inputs with retained qualification
        id: inputs
        shell: bash
        env:
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          status=0
          python3 -B scripts/ci/release-inputs-changed.py || status=$?
          case $status in
            0) echo 'publication=required' >> "$GITHUB_OUTPUT" ;;
            3) echo 'publication=unchanged' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Build and verify this revision's static release binaries
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        shell: bash
        run: make --jobs=2 release-check GO=go
      - name: Audit both actual release binaries before publication
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        run: bash scripts/ci/audit-dependencies.sh release

      - name: Retain verified binaries and qualification manifest
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-qualification.sh
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go.outputs.cache-key }}

  # Push the retained release to every region's ts-orch over NATS
  # (deploy/m1/regions.json); fails when any region does not serve it. Only
  # this job can mint the GitHub OIDC token that is the push credential.
  release-push:
    needs: [build, e2e-m1, caller-key-changes, caller-key]
    if: ${{ always() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.publication == 'required' && needs.e2e-m1.result == 'success' && needs.caller-key-changes.result == 'success' && (needs.caller-key-changes.outputs.changed == 'true' || needs.caller-key-changes.outputs.changed == 'false') && (needs.caller-key.result == 'success' || (needs.caller-key-changes.outputs.changed == 'false' && needs.caller-key.result == 'skipped')) }}
    name: deploy/release-push
    concurrency:
      group: production-ts-orch
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the region list
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            deploy/m1/regions.json
          sparse-checkout-cone-mode: false

      - name: Download this run's release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "ci-${GITHUB_SHA}-run-${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --dir dist \
            --pattern terrascale-orchestrator-linux-amd64 --pattern terrascale-orchestrator-linux-arm64
          chmod +x dist/terrascale-orchestrator-linux-amd64

      - name: Push the release one region at a time
        shell: bash
        run: |
          set -euo pipefail
          status=0
          dist/terrascale-orchestrator-linux-amd64 release push --sha "${GITHUB_SHA}" --dir dist \
            > "${RUNNER_TEMP}/release-push.jsonl" || status=$?
          cat "${RUNNER_TEMP}/release-push.jsonl"
          jq -r '"| \(.region) | \(.state // "-") | \(.started_at // "-") | \(.connect_ms) | \(.accepted_ms) | \(.serving_ms) | \(.healthy_ms) | \(.health // "") | \(.error // "") |"' "${RUNNER_TEMP}/release-push.jsonl" \
            | { printf '| Region | State | Started | Connect ms | Accepted ms | Serving ms | Healthy ms | Health | Error |\n|---|---|---|---|---|---|---|---|---|\n'; cat; } >> "${GITHUB_STEP_SUMMARY}"
          exit "$status"
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-push-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-push.jsonl
          if-no-files-found: ignore
          retention-days: 30

  all-green:
    name: all-green
    if: ${{ always() }}
    needs: [lint, e2e-m1, caller-key-changes, caller-key-build, caller-key, build, release-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: |
          set -euo pipefail
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
          test "${{ needs.caller-key-changes.result == 'success' && (needs.caller-key-changes.outputs.changed == 'true' || needs.caller-key-changes.outputs.changed == 'false') && (needs.caller-key.result == 'success' || (needs.caller-key-changes.outputs.changed == 'false' && needs.caller-key.result == 'skipped')) }}" = true
