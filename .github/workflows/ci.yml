name: TerraScale Orchestrator Go checks

# PRs check affected packages; the merge queue qualifies the tree before main.
# Main only builds and delivers changed executable inputs.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  # The merge queue tests each group on the latest main before it merges.
  merge_group:
  workflow_dispatch:
  # Weekly full verification also refreshes the main-only race caches.
  schedule:
    - cron: '17 3 * * 1'

# The newest run of a pull request cancels its older runs (user decision
# 2026-10-22). A main run always finishes, so it qualifies, releases and saves
# its caches; a newer main revision waiting behind it replaces any older one
# still waiting. Each merge-queue entry keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # The revision this change starts from; empty for scheduled and manual runs.
  CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
  # Bound nested parallelism: make, Go packages and race shards otherwise
  # each try to use every CPU of the runner.
  GOFLAGS: -p=4
  GOMAXPROCS: '2'
  # All full-tier coverage moves before merge; main never repeats that suite.
  TS_TEST_TIER: ${{ github.event_name == 'pull_request' && 'change' || 'full' }}

jobs:
  # PRs use one runner. The merge queue runs full coverage before main;
  # scheduled/manual runs keep the same qualification path available.
  change:
    if: ${{ github.event_name == 'pull_request' }}
    name: ${{ github.event_name == 'pull_request' && 'test' || 'verify/change' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TS_CI_SHARD: 1/1
      TS_RACE_MACHINE: '1'
      GOMAXPROCS: '1'
      TS_RACE_PACKAGE_JOBS: '1'
      TS_RACE_IDLE_JOBS: '1'
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks for changed files
        id: changes
        run: |
          set -euo pipefail
          cpus=$(getconf _NPROCESSORS_ONLN)
          echo "TS_RACE_JOBS=$cpus" >> "$GITHUB_ENV"
          echo "CPU budget: $cpus race workers, GOMAXPROCS=$GOMAXPROCS per worker"
          python3 scripts/ci/check-inputs.py "$CHANGE_BASE" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/verify
        if: ${{ steps.changes.outputs.checks == 'true' }}

  race:
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
    name: verify/race ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TS_CI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      TS_RACE_MACHINE: ${{ matrix.shard }}
      TS_RACE_JOBS: '2'
      TS_RACE_PACKAGE_JOBS: '1'
      TS_RACE_IDLE_JOBS: '1'
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks for changed files
        id: changes
        run: python3 scripts/ci/check-inputs.py "$CHANGE_BASE" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/verify
        if: ${{ steps.changes.outputs.checks == 'true' }}
      # Weekly/manual main verification refreshes test caches; queue/PR runs only restore.
      - if: ${{ github.ref == 'refs/heads/main' && steps.changes.outputs.checks == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.run_id }}

  # Only retained main releases publish; the merge queue already checked the tree.
  build:
    needs: [race]
    if: ${{ always() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && (needs.race.result == 'success' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.race.result == 'skipped')) }}
    permissions:
      contents: write
      actions: read
    # Main was qualified before merge; scheduled/develop builds await full checks.
    name: verify/go + artifact/linux-amd64-arm64
    outputs:
      publication: ${{ steps.inputs.outputs.publication }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          cache: release
      - name: Compare executable inputs with retained qualification
        id: inputs
        shell: bash
        env:
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          status=0
          python3 -B scripts/ci/release-inputs-changed.py || status=$?
          case $status in
            0) echo 'publication=required' >> "$GITHUB_OUTPUT" ;;
            3) echo 'publication=unchanged' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Build and verify this revision's static release binaries
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        shell: bash
        run: make --jobs=2 release-check GO=go

      - name: Retain verified binaries and qualification manifest
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-qualification.sh
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-release-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # Push the retained release to every region's ts-orch over NATS
  # (deploy/m1/regions.json); fails when any region does not serve it. Only
  # this job can mint the GitHub OIDC token that is the push credential.
  release-push:
    needs: [build]
    if: ${{ always() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.publication == 'required' }}
    name: deploy/release-push
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the region list
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: deploy/m1/regions.json
          sparse-checkout-cone-mode: false

      - name: Download this run's release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "ci-${GITHUB_SHA}-run-${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --dir dist \
            --pattern terrascale-orchestrator-linux-amd64 --pattern terrascale-orchestrator-linux-arm64
          chmod +x dist/terrascale-orchestrator-linux-amd64

      - name: Push the release to every region
        shell: bash
        run: |
          set -euo pipefail
          status=0
          dist/terrascale-orchestrator-linux-amd64 release push --sha "${GITHUB_SHA}" --dir dist \
            > "${RUNNER_TEMP}/release-push.jsonl" || status=$?
          cat "${RUNNER_TEMP}/release-push.jsonl"
          jq -r '"| \(.region) | \(.state // "-") | \(.connect_ms) | \(.accepted_ms) | \(.serving_ms) | \(.error // "") |"' "${RUNNER_TEMP}/release-push.jsonl" \
            | { printf '| Region | State | Connect ms | Accepted ms | Serving ms | Error |\n|---|---|---|---|---|---|\n'; cat; } >> "${GITHUB_STEP_SUMMARY}"
          exit "$status"
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-push-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-push.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # PR verification reports test directly; other events aggregate their jobs.
  test:
    name: ${{ github.event_name == 'pull_request' && 'test/summary' || 'test' }}
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [change, race, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHANGE: ${{ needs.change.result }}
          RACE: ${{ needs.race.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "change=$CHANGE race=$RACE build=$BUILD"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            test "$RACE" = skipped
          else
            test "$RACE" = success
          fi
          test "$BUILD" = success || test "$BUILD" = skipped

  # Weekly list of the tests that passed only on retry.
  flaky-report:
    if: ${{ github.event_name == 'schedule' }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash scripts/ci/flaky-report.sh "$RUNNER_TEMP/flaky-list.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flaky-list
          path: ${{ runner.temp }}/flaky-list.txt
          retention-days: 90
