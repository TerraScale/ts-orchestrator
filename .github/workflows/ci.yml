name: CI

on:
  schedule:
    - cron: "23 4 * * *"
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_gate:
        description: Run the full PR gate on this ref without publication
        type: boolean # zero-config: input name and type fixed by the shared revert-red-main dispatch; every dispatch runs the PR gate
        default: false
      push_main_run:
        description: Green main CI run of this commit whose published release this dispatch pushes to the regions running d360f05de
        type: string
        default: ''
      push_regions:
        description: Regions still running d360f05de to push, in order (a subsequence of sjc fra gru)
        type: string
        default: sjc fra gru

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      runtime: ${{ steps.paths.outputs.runtime }}
      certificates: ${{ steps.paths.outputs.certificates }}
      caller: ${{ steps.paths.outputs.caller }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import subprocess
          from pathlib import Path

          runtime = certificates = caller = True
          if os.environ["EVENT"] == "pull_request":
              base = os.environ["CHANGE_BASE"]
              paths = subprocess.check_output([
                  "git", "diff", "--name-only", "--no-renames", "-z", base + "...HEAD"
              ], text=True).split("\0")
              paths = [path for path in paths if path]
              shared = any(path.startswith((".github/", "test/e2e/")) or path in {
                  "go.mod", "go.sum", "Makefile", "mise.toml", ".mise.toml"
              } for path in paths)
              runtime = shared or any(not (
                  path.startswith(("docs/", "ops-notes/")) or
                  path.endswith((".md", ".mdx", ".rst")) or path in {"LICENSE", "CODEOWNERS"}
              ) for path in paths)
              certificates = shared or any(re.match(
                  r"^(cmd/|internal/(app/|edge/|natscell/mesh/|cli/)|deploy/|third_party/|docs/edge-certificates\.md$)", path
              ) for path in paths)
              caller = runtime or any(path in {"docs/caller-keys.md", "docs/e2e-ci.md"} for path in paths)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              for name, value in {"runtime": runtime, "certificates": certificates, "caller": caller}.items():
                  output.write(f"{name}={str(value).lower()}\n")
          PYTHON

  lint:
    needs: paths
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.paths.outputs.runtime == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          cache: lint-v2
      - run: make lint GO=go CHANGE_BASE="${CHANGE_BASE:-$(git merge-base origin/main HEAD)}"
      - run: make --jobs=2 release-check GO=go
      - run: bash scripts/ci/audit-dependencies.sh source
      - run: bash scripts/ci/audit-dependencies.sh release

  e2e-build:
    needs: paths
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.paths.outputs.runtime == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          cache: e2e-arm64
      - name: Build the PR agent once
        run: test/e2e/m1/build.sh "$RUNNER_TEMP/m1-bin" ./cmd/terrascale-orchestrator
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-m1-bin
          path: ${{ runner.temp }}/m1-bin/terrascale-orchestrator
          retention-days: 1

  e2e-lane:
    needs: [paths, e2e-build]
    if: ${{ !cancelled() && !failure() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.paths.outputs.runtime == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: core, entry: run.sh, timeout: 8}
          - {lane: websocket, entry: websocket.sh, timeout: 8}
          - {lane: fabric, entry: fabric/run.sh, timeout: 3, packages: "./test/e2e/m1/fabric"}
          - {lane: regional, entry: regional.sh, timeout: 3, packages: "./test/e2e/m1/regional"}
          - {lane: fleet, entry: fleet.sh, timeout: 4, packages: "./test/e2e/m1/regional"}
          - {lane: restarts, entry: restarts.sh, timeout: 8, packages: "./test/e2e/m1/lifecycle ./test/e2e/m1/lifecycle/server"}
          - {lane: autoscale-up, entry: autoscale-up.sh, timeout: 5, packages: "./test/e2e/m1/lifecycle ./test/e2e/m1/lifecycle/server"}
          - {lane: autoscale-down, entry: autoscale-down.sh, timeout: 5, packages: "./test/e2e/m1/lifecycle ./test/e2e/m1/lifecycle/server"}
          - {lane: readiness, entry: readiness.sh, timeout: 10, packages: "./test/e2e/m1/lifecycle ./test/e2e/m1/lifecycle/server"}
          - {lane: rollback, entry: rollback.sh, timeout: 8}
          - {lane: host-logs, entry: host-logs.sh, timeout: 12}
          - {lane: monitoring, entry: monitoring.sh, timeout: 8, packages: "./test/e2e/m1/monitoring"}
          - {lane: boot-order, entry: boot-order.sh, timeout: 8, packages: "./test/e2e/m1/boot-order"}
          - {lane: updater-preflight, entry: updater-preflight.sh, timeout: 12}
          - {lane: host-credentials, entry: host-credentials.sh, timeout: 5, packages: "./test/e2e/m1/host-credentials"}
          - {lane: release-contracts, entry: release-contracts.sh, timeout: 5, packages: "./test/e2e/m1/revision-gate ./test/e2e/m1/vault-policy"}
          - {lane: metadata-upgrade, entry: metadata-upgrade.sh, timeout: 8}
          - {lane: node-upgrade, entry: node-upgrade.sh, timeout: 10}
          - {lane: rollout, entry: rollout.sh, timeout: 10}
          - {lane: oracle-regions, entry: oracle-regions.sh, timeout: 7, packages: "./test/e2e/m1/oracle-regions"}
          - {lane: release-probation, entry: release-probation.sh, timeout: 7, packages: "./test/e2e/m1/release-probation"}
          - {lane: region-fallback, entry: region-fallback.sh, timeout: 4, packages: "./test/e2e/m1/oracle-regions"}
          - {lane: rollout-install, entry: rollout-install.sh, timeout: 10}
          - {lane: pull-update, entry: pull-update.sh, timeout: 5, packages: "./test/e2e/m1/pull-update"}
          - {lane: pull-handover, entry: pull-handover.sh, timeout: 5, packages: "./test/e2e/m1/pull-update"}
          - {lane: pull-degraded, entry: pull-degraded.sh, timeout: 5, packages: "./test/e2e/m1/pull-update"}
          - {lane: recovery, entry: recovery.sh, timeout: 5}
          - {lane: operator, entry: operator.sh, timeout: 8, packages: "./test/e2e/m1/operator-truth ./test/e2e/m1/startup"}
          - {lane: data-volume, entry: data-volume.sh, timeout: 8, packages: "./test/e2e/m1/region-volume ./test/e2e/m1/data-mount ./test/e2e/m1/cloudinit"}
          - {lane: postgres-preauth, entry: postgres-preauth.sh, timeout: 3, packages: "./test/e2e/m1/postgres-preauth"}
          - {lane: edge-limits, entry: edge-limits.sh, timeout: 15, packages: "./test/e2e/m1/postgres-preauth"}
    name: e2e-m1 / ${{ matrix.lane }}
    concurrency:
      group: e2e-m1-${{ matrix.lane }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go
        with:
          cache: e2e-arm64
      - if: ${{ github.event_name == 'push' }}
        name: Build the agent and journey entry points from the warm cache
        env:
          M1_PACKAGES: ${{ matrix.packages }}
        run: |
          read -r -a packages <<< "$M1_PACKAGES"
          test/e2e/m1/build.sh "$RUNNER_TEMP/m1-bin" ./cmd/terrascale-orchestrator "${packages[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: ${{ github.event_name != 'push' && matrix.packages != '' }}
        name: Build this lane's journey entry points
        env:
          M1_PACKAGES: ${{ matrix.packages }}
        run: |
          read -r -a packages <<< "$M1_PACKAGES"
          test/e2e/m1/build.sh "$RUNNER_TEMP/m1-bin" "${packages[@]}"
      - if: ${{ github.event_name != 'push' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: e2e-m1-bin
          path: ${{ runner.temp }}/m1-bin
      - if: ${{ github.event_name != 'push' }}
        run: chmod +x "$RUNNER_TEMP/m1-bin/"*
      - name: Pinned runtime packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ts-m1-runtime
          key: m1-runtime-${{ runner.arch }}-${{ hashFiles('deploy/m1/host-runtime.sh', 'internal/netbird/manager/server_cli.go', 'deploy/m1/install.sh') }}
      - name: Run the lane
        run: bash "test/e2e/m1/${{ matrix.entry }}" "$RUNNER_TEMP/m1-bin/terrascale-orchestrator"
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.lane == 'core' && steps.go.outputs.cache-hit != 'true' }}
        run: python3 scripts/ci/trim-go-cache.py
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.lane == 'core' && steps.go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}

  e2e-m1:
    if: ${{ always() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.paths.outputs.runtime == 'true') }}
    needs: [paths, e2e-lane]
    concurrency:
      group: e2e-m1-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Check upstream results
        env:
          LANES: ${{ needs.e2e-lane.result }}
        run: test "$LANES" = success

  certificate-paths:
    needs: paths
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      changed: ${{ needs.paths.outputs.certificates }}
    steps:
      - run: test -n "${{ needs.paths.outputs.certificates }}"

  caller-key-changes:
    needs: paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - if: ${{ github.event_name == 'push' }}
        id: go
        uses: ./.github/actions/go
        with:
          cache: caller-key-changes
          modules-only: 'true'
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          CALLER_INPUTS: ${{ needs.paths.outputs.caller }}
        run: |
          if [ "$EVENT" = push ]; then
            python3 test/e2e/m1/callerkey/inputs.py
          else
            echo "changed=$CALLER_INPUTS" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}

  e2e-certificates:
    needs: certificate-paths
    if: ${{ needs.certificate-paths.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          cache: e2e-arm64
      - name: Install certificate lane tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb containerd iproute2 iptables ca-certificates
      - name: Build ts-orch
        run: go build -trimpath -o "$RUNNER_TEMP/terrascale-orchestrator" ./cmd/terrascale-orchestrator
      - name: Run real lease, rollout and recovery proofs
        run: bash test/e2e/m1/certificates/run.sh "$RUNNER_TEMP/terrascale-orchestrator"

  caller-key-build:
    needs: [caller-key-changes]
    if: ${{ needs.caller-key-changes.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go
        with:
          cache: caller-key-build
      - name: Build the overlay command and journey once
        run: bash test/e2e/m1/callerkey/build.sh "$RUNNER_TEMP/caller-key-bin"
      - name: Prove the shard partition
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/caller-key-bin/callerkey"
          for shard in {0..7}; do
            "$binary" list "$shard" 8
          done | sort > "$RUNNER_TEMP/sharded.txt"
          "$binary" list | sort > "$RUNNER_TEMP/unsharded.txt"
          diff -u "$RUNNER_TEMP/unsharded.txt" "$RUNNER_TEMP/sharded.txt"
          test -z "$(uniq -d "$RUNNER_TEMP/sharded.txt")"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caller-key-bin
          path: |
            ${{ runner.temp }}/caller-key-bin/callerkey
            ${{ runner.temp }}/caller-key-bin/terrascale-orchestrator
          retention-days: 1
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true' }}
        run: python3 scripts/ci/trim-go-cache.py
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}

  caller-key:
    needs: [caller-key-changes, caller-key-build]
    if: ${{ needs.caller-key-changes.outputs.changed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    name: caller-key / ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: caller-key-bin
          path: ${{ runner.temp }}/caller-key-bin
      - name: Run caller-key lifecycle and recovery shard
        run: |
          set -euo pipefail
          start=$(date +%s)
          chmod +x "$RUNNER_TEMP/caller-key-bin/"*
          "$RUNNER_TEMP/caller-key-bin/callerkey" run "$RUNNER_TEMP/caller-key-bin/terrascale-orchestrator" "${{ matrix.shard }}" 8
          echo "caller-key shard ${{ matrix.shard }}/8: $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

  build:
    concurrency:
      group: fast-build-${{ github.ref }}
      cancel-in-progress: true
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
      actions: read
    name: verify/go + artifact/linux-amd64-arm64
    outputs:
      publication: ${{ steps.inputs.outputs.publication }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go
        with:
          cache: release
      - name: Scan legacy terms within CI
        run: |
          scanner="$RUNNER_TEMP/legacy-scanner"
          mkdir -p "$scanner"
          for file in scan.py terms.json allow-list.json owners.json; do
            curl --fail --silent --show-error --location --retry 2 \
              "https://raw.githubusercontent.com/TerraScale/terrascale/a2e200187ffe32084a10f2a81c9e3e1f59b49a29/scripts/legacy-scan/$file" \
              --output "$scanner/$file" &
          done
          wait
          base="$CHANGE_BASE"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            base=$(git rev-parse "$SOURCE_SHA^")
          fi
          # A temporary index makes the existing scanner see changed files only.
          export GIT_INDEX_FILE="$RUNNER_TEMP/legacy-changed-index"
          git read-tree --empty
          git diff --name-only --diff-filter=ACMR -z "$base" "$SOURCE_SHA" | git update-index --add -z --stdin
          python3 "$scanner/scan.py" --repo ts-orchestrator --root . --output "$RUNNER_TEMP/legacy-hits.md"
      - name: Audit release package graphs
        run: bash scripts/ci/audit-dependencies.sh source
      - name: Compare executable inputs with retained qualification
        id: inputs
        shell: bash
        env:
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          status=0
          python3 -B scripts/ci/release-inputs-changed.py || status=$?
          case $status in
            0) echo 'publication=required' >> "$GITHUB_OUTPUT" ;;
            3) echo 'publication=unchanged' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Build and verify this revision's static release binaries
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        shell: bash
        run: make --jobs=2 release-check GO=go
      - name: Audit both actual release binaries before publication
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        run: bash scripts/ci/audit-dependencies.sh release

      - name: Retain verified binaries and qualification manifest
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-qualification.sh
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true' }}
        run: python3 scripts/ci/trim-go-cache.py
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}

  release-publish:
    needs: [build, e2e-m1, certificate-paths, e2e-certificates, caller-key-changes, caller-key]
    if: ${{ always() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.publication == 'required' && needs.e2e-m1.result == 'success' && needs.certificate-paths.result == 'success' && (needs.e2e-certificates.result == 'success' || (needs.e2e-certificates.result == 'skipped' && needs.certificate-paths.outputs.changed == 'false')) && needs.caller-key-changes.result == 'success' && (needs.caller-key.result == 'success' || needs.caller-key.result == 'skipped') }}
    name: deploy/release-publish
    concurrency:
      group: production-ts-orch
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the region list
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            deploy/m1/regions.json
          sparse-checkout-cone-mode: false

      - name: Download this run's release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "ci-${GITHUB_SHA}-run-${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --dir dist \
            --pattern terrascale-orchestrator-linux-amd64 --pattern terrascale-orchestrator-linux-arm64
          chmod +x dist/terrascale-orchestrator-linux-amd64

      - name: Attest the published binaries
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/terrascale-orchestrator-linux-amd64
            dist/terrascale-orchestrator-linux-arm64
          show-summary: false

      - name: Publish the attestation with the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" dist/provenance.sigstore.json
          gh release upload "ci-${GITHUB_SHA}-run-${GITHUB_RUN_ID}" dist/provenance.sigstore.json --repo "${GITHUB_REPOSITORY}" --clobber


  release-push-once:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.push_main_run != '' }}
    name: deploy/release-push-once
    concurrency:
      group: production-ts-orch
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go
        with:
          cache: release-push-once
          modules-only: 'true'
      - name: Take the published binaries of this commit's green main run
        shell: bash
        env:
          RUN: ${{ inputs.push_main_run }}
        run: |
          set -euo pipefail
          [[ $RUN =~ ^[0-9]+$ ]]
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}" --jq '[.head_sha, .event, .head_branch, .path, .conclusion] | join(" ")')" = "${GITHUB_SHA} push main .github/workflows/ci.yml success"
          mkdir dist published
          gh release download "ci-${GITHUB_SHA}-run-${RUN}" --repo "${GITHUB_REPOSITORY}" --dir published \
            --pattern terrascale-orchestrator-linux-amd64 --pattern terrascale-orchestrator-linux-arm64 --pattern qualification.json
          jq -e --arg sha "$GITHUB_SHA" --argjson run "$RUN" '.source_revision == $sha and .verification.run_id == $run' published/qualification.json
          for architecture in amd64 arm64; do
            name="terrascale-orchestrator-linux-${architecture}"
            test "$(sha256sum "published/${name}" | awk '{print $1}')" = "$(jq -r --arg name "$name" '.artifacts[] | select(.name == $name) | .sha256' published/qualification.json)"
            cp "published/${name}" "dist/${name}"
          done
          sha256sum dist/* | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Publish the same binaries under this run
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-qualification.sh
      - name: Push each region with the running fleet's release client and confirm it with this build
        shell: bash
        env:
          FLEET_SHA: d360f05deb329f04d2ebad17216393a723f73fef
          FLEET_RUN: '43970746718'
          REGIONS: ${{ inputs.push_regions }}
        run: |
          set -euo pipefail
          [[ -n $REGIONS && $REGIONS =~ ^(sjc( |$))?(fra( |$))?(gru)?$ && $REGIONS != *" " ]]
          mkdir pusher
          gh release download "ci-${FLEET_SHA}-run-${FLEET_RUN}" --repo "${GITHUB_REPOSITORY}" --dir pusher \
            --pattern terrascale-orchestrator-linux-amd64 --pattern qualification.json
          jq -e --arg sha "$FLEET_SHA" '.source_revision == $sha' pusher/qualification.json
          test "$(sha256sum pusher/terrascale-orchestrator-linux-amd64 | awk '{print $1}')" = "$(jq -r '.artifacts[] | select(.name == "terrascale-orchestrator-linux-amd64") | .sha256' pusher/qualification.json)"
          chmod +x pusher/terrascale-orchestrator-linux-amd64 dist/terrascale-orchestrator-linux-amd64
          gh api "repos/${GITHUB_REPOSITORY}/contents/deploy/m1/regions.json?ref=${FLEET_SHA}" --jq .content | base64 -d > pusher/regions.json
          for region in $REGIONS; do
            jq -e --arg region "$region" '[.[] | select(.region == $region)] | if length == 1 then . else error("unknown region") end' pusher/regions.json > "pusher/${region}.json"
            status=0
            pusher/terrascale-orchestrator-linux-amd64 release push --sha "${GITHUB_SHA}" --dir dist --regions "pusher/${region}.json" \
              > "pusher/${region}.jsonl" || status=$?
            tee -a "${RUNNER_TEMP}/release-push.jsonl" < "pusher/${region}.jsonl"
            jq -se --arg sha "$GITHUB_SHA" --arg region "$region" --argjson status "$status" \
              'length == 1 and .[0].region == $region and .[0].state == "installed" and
              (if $status == 0 then (.[0].error // "") == "" else .[0].error == ("timed out waiting for the region to serve " + $sha) end)' \
              "pusher/${region}.jsonl"
            mkdir -p "observe/${region}/deploy/m1"
            jq -n --arg region "$region" '[{region: $region}]' > "observe/${region}/deploy/m1/regions.json"
            (cd "observe/${region}" && timeout 600 "${GITHUB_WORKSPACE}/dist/terrascale-orchestrator-linux-amd64" release hosts "${GITHUB_SHA}") \
              | tee -a "${GITHUB_STEP_SUMMARY}"
          done
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-push-once-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-push.jsonl
          if-no-files-found: ignore
          retention-days: 30

  all-green:
    name: all-green
    if: ${{ always() }}
    needs: [paths, lint, e2e-build, e2e-lane, e2e-m1, certificate-paths, e2e-certificates, caller-key-changes, caller-key-build, caller-key, build, release-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Check upstream results
        run: |
          set -euo pipefail
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
          test "${{ needs.certificate-paths.result == 'success' && (needs.e2e-certificates.result == 'success' || needs.certificate-paths.outputs.changed == 'false') }}" = true
          test "${{ needs.caller-key-changes.result == 'success' && (needs.caller-key.result == 'success' || needs.caller-key.result == 'skipped') }}" = true
          test "${{ github.event_name != 'workflow_dispatch' || (needs.lint.result == 'success' && needs.e2e-m1.result == 'success' && needs.e2e-certificates.result == 'success' && needs.caller-key.result == 'success' && needs.build.result == 'skipped' && needs.release-publish.result == 'skipped') }}" = true
