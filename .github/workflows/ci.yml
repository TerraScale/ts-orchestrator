name: CI

on:
  schedule:
    - cron: "23 4 * * *"
  pull_request:
  push:
    branches: [main]

# Builds may overlap an admitted release. A newer revision replaces obsolete
# build work; release-push below always lets the active rollout finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  lint:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          cache: lint
      - run: make lint GO=go
      - run: make --jobs=2 release-check GO=go
      - run: bash scripts/ci/audit-dependencies.sh source
      - run: bash scripts/ci/audit-dependencies.sh release

  e2e-lane:
    if: ${{ github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: core, entry: run.sh, timeout: 8}
          - {lane: websocket, entry: websocket.sh, timeout: 8}
          - {lane: regional, entry: regional.sh, timeout: 3, packages: "./test/e2e/m1/regional"}
          - {lane: nodelist, entry: nodelist.sh, timeout: 8, packages: "./test/e2e/m1/nodelist"}
          - {lane: restarts, entry: restarts.sh, timeout: 8}
          - {lane: rollback, entry: rollback.sh, timeout: 8}
          - {lane: monitoring, entry: monitoring.sh, timeout: 8, packages: "./test/e2e/m1/monitoring"}
          - {lane: boot-order, entry: boot-order.sh, timeout: 8, packages: "./test/e2e/m1/boot-order"}
          - {lane: operator, entry: operator.sh, timeout: 8, packages: "./test/e2e/m1/operator-truth ./test/e2e/m1/startup"}
    name: e2e-m1 / ${{ matrix.lane }}
    concurrency:
      group: e2e-m1-${{ matrix.lane }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go
        with:
          cache: e2e-arm64
      - name: Build the agent and journey entry points from the warm cache
        env:
          M1_PACKAGES: ${{ matrix.packages }}
        run: |
          read -r -a packages <<< "$M1_PACKAGES"
          test/e2e/m1/build.sh "$RUNNER_TEMP/m1-bin" "${packages[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pinned runtime packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ts-m1-runtime
          key: m1-runtime-${{ runner.arch }}-${{ hashFiles('deploy/m1/host-runtime.sh', 'internal/netbird/manager/server_cli.go', 'deploy/m1/install.sh') }}
      - name: Run the lane
        run: bash "test/e2e/m1/${{ matrix.entry }}" "$RUNNER_TEMP/m1-bin/terrascale-orchestrator"
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.lane == 'core' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go.outputs.cache-key }}

  e2e-m1:
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: e2e-lane
    concurrency:
      group: e2e-m1-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - env:
          LANES: ${{ needs.e2e-lane.result }}
        run: test "$LANES" = success

  certificate-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${CHANGE_BASE:-HEAD^}" HEAD)
          if rg -q '^(internal/edge/|internal/natscell/mesh/|internal/cli/|test/e2e/m1/certificates/|docs/edge-certificates.md|go.mod|go.sum|.github/)' <<< "$changed"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  e2e-certificates:
    needs: certificate-paths
    if: ${{ needs.certificate-paths.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          cache: e2e-arm64
      - name: Install certificate lane tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb containerd iproute2 ca-certificates
      - name: Build ts-orch
        run: go build -trimpath -o "$RUNNER_TEMP/terrascale-orchestrator" ./cmd/terrascale-orchestrator
      - name: Run real lease, rollout and recovery proofs
        run: bash test/e2e/m1/certificates/run.sh "$RUNNER_TEMP/terrascale-orchestrator"

  build:
    concurrency:
      group: fast-build-${{ github.ref }}
      cancel-in-progress: true
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
      actions: read
    name: verify/go + artifact/linux-amd64-arm64
    outputs:
      publication: ${{ steps.inputs.outputs.publication }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go
        with:
          cache: release
      - name: Scan legacy terms within CI
        run: |
          scanner="$RUNNER_TEMP/legacy-scanner"
          mkdir -p "$scanner"
          for file in scan.py terms.json allow-list.json owners.json; do
            curl --fail --silent --show-error --location --retry 2 \
              "https://raw.githubusercontent.com/TerraScale/terrascale/a2e200187ffe32084a10f2a81c9e3e1f59b49a29/scripts/legacy-scan/$file" \
              --output "$scanner/$file" &
          done
          wait
          base="$CHANGE_BASE"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            base=$(git rev-parse "$SOURCE_SHA^")
          fi
          # A temporary index makes the existing scanner see changed files only.
          export GIT_INDEX_FILE="$RUNNER_TEMP/legacy-changed-index"
          git read-tree --empty
          git diff --name-only --diff-filter=ACMR -z "$base" "$SOURCE_SHA" | git update-index --add -z --stdin
          python3 "$scanner/scan.py" --repo ts-orchestrator --root . --output "$RUNNER_TEMP/legacy-hits.md"
      - name: Audit release package graphs
        run: bash scripts/ci/audit-dependencies.sh source
      - name: Compare executable inputs with retained qualification
        id: inputs
        shell: bash
        env:
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          status=0
          python3 -B scripts/ci/release-inputs-changed.py || status=$?
          case $status in
            0) echo 'publication=required' >> "$GITHUB_OUTPUT" ;;
            3) echo 'publication=unchanged' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Build and verify this revision's static release binaries
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        shell: bash
        run: make --jobs=2 release-check GO=go
      - name: Audit both actual release binaries before publication
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        run: bash scripts/ci/audit-dependencies.sh release

      - name: Retain verified binaries and qualification manifest
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-qualification.sh
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go.outputs.cache-key }}

  # Push the retained release to every region's ts-orch over NATS
  # (deploy/m1/regions.json); fails when any region does not serve it. Only
  # this job can mint the GitHub OIDC token that is the push credential.
  release-push:
    needs: [build, e2e-m1, e2e-certificates]
    if: ${{ always() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.publication == 'required' && needs.e2e-m1.result == 'success' && (needs.e2e-certificates.result == 'success' || needs.e2e-certificates.result == 'skipped') }}
    name: deploy/release-push
    concurrency:
      group: production-ts-orch
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the region list
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            deploy/m1/regions.json
          sparse-checkout-cone-mode: false

      - name: Download this run's release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "ci-${GITHUB_SHA}-run-${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --dir dist \
            --pattern terrascale-orchestrator-linux-amd64 --pattern terrascale-orchestrator-linux-arm64
          chmod +x dist/terrascale-orchestrator-linux-amd64

      - name: Push the release one region at a time
        shell: bash
        run: |
          set -euo pipefail
          status=0
          dist/terrascale-orchestrator-linux-amd64 release push --sha "${GITHUB_SHA}" --dir dist \
            > "${RUNNER_TEMP}/release-push.jsonl" || status=$?
          cat "${RUNNER_TEMP}/release-push.jsonl"
          jq -r '"| \(.region) | \(.state // "-") | \(.started_at // "-") | \(.connect_ms) | \(.accepted_ms) | \(.serving_ms) | \(.healthy_ms) | \(.health // "") | \(.error // "") |"' "${RUNNER_TEMP}/release-push.jsonl" \
            | { printf '| Region | State | Started | Connect ms | Accepted ms | Serving ms | Healthy ms | Health | Error |\n|---|---|---|---|---|---|---|---|---|\n'; cat; } >> "${GITHUB_STEP_SUMMARY}"
          exit "$status"
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-push-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-push.jsonl
          if-no-files-found: ignore
          retention-days: 30

  all-green:
    name: all-green
    if: ${{ always() }}
    needs: [lint, e2e-m1, certificate-paths, e2e-certificates, build, release-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
