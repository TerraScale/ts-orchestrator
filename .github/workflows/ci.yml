name: CI

on:
  schedule:
    - cron: "23 4 * * *"
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_gate:
        description: Run the full PR gate on this ref without publication
        type: boolean # zero-config: input name and type fixed by the shared revert-red-main dispatch; every dispatch runs the PR gate
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      runtime: ${{ steps.paths.outputs.runtime }}
      certificates: ${{ steps.paths.outputs.certificates }}
      caller: ${{ steps.paths.outputs.caller }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import subprocess
          from pathlib import Path

          runtime = certificates = caller = True
          if os.environ["EVENT"] == "pull_request":
              base = os.environ["CHANGE_BASE"]
              paths = subprocess.check_output([
                  "git", "diff", "--name-only", "--no-renames", "-z", base + "...HEAD"
              ], text=True).split("\0")
              paths = [path for path in paths if path]
              shared = any(path.startswith((".github/", "test/e2e/")) or path in {
                  "go.mod", "go.sum", "Makefile", "mise.toml", ".mise.toml"
              } for path in paths)
              runtime = shared or any(not (
                  path.startswith(("docs/", "ops-notes/")) or
                  path.endswith((".md", ".mdx", ".rst")) or path in {"LICENSE", "CODEOWNERS"}
              ) for path in paths)
              certificates = shared or any(re.match(
                  r"^(cmd/|internal/(app/|edge/|natscell/mesh/|cli/)|deploy/|third_party/|docs/edge-certificates\.md$)", path
              ) for path in paths)
              caller = runtime or any(path in {"docs/caller-keys.md", "docs/e2e-ci.md"} for path in paths)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              for name, value in {"runtime": runtime, "certificates": certificates, "caller": caller}.items():
                  output.write(f"{name}={str(value).lower()}\n")
          PYTHON

  lint:
    needs: paths
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.paths.outputs.runtime == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          cache: lint-v2
      - run: make lint GO=go CHANGE_BASE="${CHANGE_BASE:-$(git merge-base origin/main HEAD)}"
      - run: make --jobs=2 release-check GO=go
      - run: bash scripts/ci/audit-dependencies.sh source
      - run: bash scripts/ci/audit-dependencies.sh release

  e2e-build:
    needs: paths
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.paths.outputs.runtime == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          cache: e2e-arm64
      - name: Build the PR agent once
        run: test/e2e/m1/build.sh "$RUNNER_TEMP/m1-bin" ./cmd/terrascale-orchestrator
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-m1-bin
          path: ${{ runner.temp }}/m1-bin/terrascale-orchestrator
          retention-days: 1

  e2e-lane:
    needs: [paths, e2e-build]
    if: ${{ !cancelled() && !failure() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.paths.outputs.runtime == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            deadline: 92
            lanes:
              - {lane: edge-limits, entry: edge-limits.sh, timeout: 15, budget: 25, packages: "./test/e2e/m1/postgres-preauth"}
              - {lane: release-probation, entry: release-probation.sh, timeout: 7, budget: 17, packages: "./test/e2e/m1/release-probation"}
              - {lane: pull-handover, entry: pull-handover.sh, timeout: 5, budget: 15, packages: "./test/e2e/m1/pull-update"}
              - {lane: host-credentials, entry: host-credentials.sh, timeout: 5, budget: 15, packages: "./test/e2e/m1/host-credentials"}
          - group: 2
            deadline: 105
            lanes:
              - {lane: rollout, entry: rollout.sh, timeout: 10, budget: 20}
              - {lane: boot-order, entry: boot-order.sh, timeout: 8, budget: 18, packages: "./test/e2e/m1/boot-order"}
              - {lane: node-upgrade, entry: node-upgrade.sh, timeout: 10, budget: 20}
              - {lane: region-fallback, entry: region-fallback.sh, timeout: 4, budget: 14, packages: "./test/e2e/m1/oracle-regions"}
              - {lane: ocir, entry: ocir.sh, timeout: 3, budget: 13, packages: "./test/e2e/m1/ocir"}
          - group: 3
            deadline: 94
            lanes:
              - {lane: rollout-install, entry: rollout-install.sh, timeout: 10, budget: 20}
              - {lane: oracle-regions, entry: oracle-regions.sh, timeout: 7, budget: 17, packages: "./test/e2e/m1/oracle-regions"}
              - {lane: host-logs, entry: host-logs.sh, timeout: 12, budget: 22}
              - {lane: pull-degraded, entry: pull-degraded.sh, timeout: 5, budget: 15, packages: "./test/e2e/m1/pull-update"}
          - group: 4
            deadline: 119
            lanes:
              - {lane: readiness, entry: readiness.sh, timeout: 10, budget: 20, packages: "./test/e2e/m1/lifecycle ./test/e2e/m1/lifecycle/server"}
              - {lane: pull-update, entry: pull-update.sh, timeout: 5, budget: 15, packages: "./test/e2e/m1/pull-update"}
              - {lane: pull-bake, entry: pull-bake.sh, timeout: 5, budget: 15, packages: "./test/e2e/m1/pull-update"}
              - {lane: fabric, entry: fabric/run.sh, timeout: 3, budget: 13, packages: "./test/e2e/m1/fabric"}
              - {lane: websocket, entry: websocket.sh, timeout: 8, budget: 18}
              - {lane: rollback, entry: rollback.sh, timeout: 8, budget: 18}
          - group: 5
            deadline: 88
            lanes:
              - {lane: updater-preflight, entry: updater-preflight.sh, timeout: 12, budget: 22}
              - {lane: autoscale-down, entry: autoscale-down.sh, timeout: 5, budget: 15, packages: "./test/e2e/m1/lifecycle ./test/e2e/m1/lifecycle/server"}
              - {lane: data-volume, entry: data-volume.sh, timeout: 8, budget: 18, packages: "./test/e2e/m1/region-volume ./test/e2e/m1/data-mount ./test/e2e/m1/cloudinit"}
              - {lane: regional, entry: regional.sh, timeout: 3, budget: 13, packages: "./test/e2e/m1/regional"}
          - group: 6
            deadline: 128
            lanes:
              - {lane: upgrade-next, entry: upgrade-next.sh, timeout: 14, budget: 24, packages: "./test/e2e/m1/upgrade-gate"}
              - {lane: operator, entry: operator.sh, timeout: 8, budget: 18, packages: "./test/e2e/m1/operator-truth ./test/e2e/m1/startup"}
              - {lane: autoscale-up, entry: autoscale-up.sh, timeout: 5, budget: 15, packages: "./test/e2e/m1/lifecycle ./test/e2e/m1/lifecycle/server"}
              - {lane: metadata-upgrade, entry: metadata-upgrade.sh, timeout: 8, budget: 18}
              - {lane: restarts, entry: restarts.sh, timeout: 8, budget: 18, packages: "./test/e2e/m1/lifecycle ./test/e2e/m1/lifecycle/server"}
              - {lane: release-contracts, entry: release-contracts.sh, timeout: 5, budget: 15, packages: "./test/e2e/m1/revision-gate ./test/e2e/m1/vault-policy"}
          - group: 7
            deadline: 122
            lanes:
              - {lane: upgrade-previous, entry: upgrade-previous.sh, timeout: 14, budget: 24, packages: "./test/e2e/m1/upgrade-gate"}
              - {lane: monitoring, entry: monitoring.sh, timeout: 8, budget: 18, packages: "./test/e2e/m1/monitoring"}
              - {lane: fleet, entry: fleet.sh, timeout: 4, budget: 14, packages: "./test/e2e/m1/regional"}
              - {lane: core, entry: run.sh, timeout: 8, budget: 18}
              - {lane: recovery, entry: recovery.sh, timeout: 5, budget: 15}
              - {lane: postgres-preauth, entry: postgres-preauth.sh, timeout: 3, budget: 13, packages: "./test/e2e/m1/postgres-preauth"}
    name: e2e-m1 / group ${{ matrix.group }}
    concurrency:
      group: e2e-m1-group-${{ matrix.group }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ matrix.deadline }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go
        with:
          cache: e2e-arm64
      - name: Prepare the hosted runner
        run: timeout --foreground 180 bash test/e2e/m1/teardown.sh prepare
      - id: lane0
        if: ${{ !cancelled() && matrix.lanes[0] != null }}
        name: e2e-m1 / ${{ matrix.lanes[0].lane }}
        timeout-minutes: ${{ matrix.lanes[0].budget }}
        uses: ./.github/actions/e2e-lane
        continue-on-error: true
        with:
          lane: ${{ matrix.lanes[0].lane }}
          entry: ${{ matrix.lanes[0].entry }}
          packages: ${{ matrix.lanes[0].packages }}
          timeout: ${{ matrix.lanes[0].timeout }}
      - id: lane1
        if: ${{ !cancelled() && matrix.lanes[1] != null }}
        name: e2e-m1 / ${{ matrix.lanes[1].lane }}
        timeout-minutes: ${{ matrix.lanes[1].budget }}
        uses: ./.github/actions/e2e-lane
        continue-on-error: true
        with:
          lane: ${{ matrix.lanes[1].lane }}
          entry: ${{ matrix.lanes[1].entry }}
          packages: ${{ matrix.lanes[1].packages }}
          timeout: ${{ matrix.lanes[1].timeout }}
      - id: lane2
        if: ${{ !cancelled() && matrix.lanes[2] != null }}
        name: e2e-m1 / ${{ matrix.lanes[2].lane }}
        timeout-minutes: ${{ matrix.lanes[2].budget }}
        uses: ./.github/actions/e2e-lane
        continue-on-error: true
        with:
          lane: ${{ matrix.lanes[2].lane }}
          entry: ${{ matrix.lanes[2].entry }}
          packages: ${{ matrix.lanes[2].packages }}
          timeout: ${{ matrix.lanes[2].timeout }}
      - id: lane3
        if: ${{ !cancelled() && matrix.lanes[3] != null }}
        name: e2e-m1 / ${{ matrix.lanes[3].lane }}
        timeout-minutes: ${{ matrix.lanes[3].budget }}
        uses: ./.github/actions/e2e-lane
        continue-on-error: true
        with:
          lane: ${{ matrix.lanes[3].lane }}
          entry: ${{ matrix.lanes[3].entry }}
          packages: ${{ matrix.lanes[3].packages }}
          timeout: ${{ matrix.lanes[3].timeout }}
      - id: lane4
        if: ${{ !cancelled() && matrix.lanes[4] != null }}
        name: e2e-m1 / ${{ matrix.lanes[4].lane }}
        timeout-minutes: ${{ matrix.lanes[4].budget }}
        uses: ./.github/actions/e2e-lane
        continue-on-error: true
        with:
          lane: ${{ matrix.lanes[4].lane }}
          entry: ${{ matrix.lanes[4].entry }}
          packages: ${{ matrix.lanes[4].packages }}
          timeout: ${{ matrix.lanes[4].timeout }}
      - id: lane5
        if: ${{ !cancelled() && matrix.lanes[5] != null }}
        name: e2e-m1 / ${{ matrix.lanes[5].lane }}
        timeout-minutes: ${{ matrix.lanes[5].budget }}
        uses: ./.github/actions/e2e-lane
        continue-on-error: true
        with:
          lane: ${{ matrix.lanes[5].lane }}
          entry: ${{ matrix.lanes[5].entry }}
          packages: ${{ matrix.lanes[5].packages }}
          timeout: ${{ matrix.lanes[5].timeout }}
      - name: Record each lane and queue only its existing automatic rerun
        if: ${{ !cancelled() }}
        env:
          LANES: ${{ toJSON(matrix.lanes) }}
          RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib

          lanes, results = json.loads(os.environ["LANES"]), json.loads(os.environ["RESULTS"])
          target = pathlib.Path(os.environ["RUNNER_TEMP"], "rerun")
          target.mkdir()
          errors = []
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### e2e lane results\n\n| Lane | First attempt |\n|---|---|\n")
              for index, lane in enumerate(lanes):
                  result = results[f"lane{index}"]
                  outcome = result["outcome"]
                  summary.write(f"| {lane['lane']} | {outcome} |\n")
                  if result["outputs"].get("clean") != "success" or result["outputs"].get("teardown") != "success":
                      errors.append(f"Host isolation failed for {lane['lane']}; this failure cannot be rerun away")
                      continue
                  if outcome == "failure":
                      (target / f"{lane['lane']}.json").write_text(json.dumps(lane))
                  elif outcome != "success":
                      errors.append(f"Lane {lane['lane']} did not finish: {outcome}")
          if errors:
              raise SystemExit("\n".join(errors))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-rerun-${{ github.run_attempt }}-group-${{ matrix.group }}
          path: ${{ runner.temp }}/rerun/
          if-no-files-found: ignore
          retention-days: 30
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.group == 7 && steps.go.outputs.cache-hit != 'true' }}
        run: python3 scripts/ci/trim-go-cache.py
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.group == 7 && steps.go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}

  e2e-rerun-plan:
    needs: [paths, e2e-lane]
    if: ${{ !cancelled() && needs.e2e-lane.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - id: plan
        name: Collect the lanes that failed their first attempt
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import subprocess

          repository, run, attempt = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]

          def pages(path, key):
              return [item for page in json.loads(subprocess.check_output(["gh", "api", "--paginate", "--slurp", path])) for item in page[key]]

          artifacts = {artifact["name"] for artifact in pages(f"repos/{repository}/actions/runs/{run}/artifacts?per_page=100", "artifacts")}
          latest = {job["name"].removeprefix("e2e-m1 / group "): job["run_attempt"] for job in pages(f"repos/{repository}/actions/runs/{run}/jobs?filter=latest&per_page=100", "jobs")
                    if job["name"].startswith("e2e-m1 / group ")}
          names = sorted(f"e2e-rerun-{lane_attempt}-group-{group}" for group, lane_attempt in latest.items() if f"e2e-rerun-{lane_attempt}-group-{group}" in artifacts)
          lanes = []
          for name in names:
              target = pathlib.Path(os.environ["RUNNER_TEMP"], name)
              subprocess.check_call(["gh", "run", "download", run, "--repo", repository, "--name", name, "--dir", str(target)])
              lanes += [json.loads(path.read_text()) for path in sorted(target.glob("*.json"))]
          for lane in lanes:
              lane["job_timeout"] = lane["timeout"] + 30
          record = {"run_id": int(run), "run_attempt": int(attempt), "sha": os.environ["SOURCE_SHA"], "event": os.environ["GITHUB_EVENT_NAME"],
                    "reruns": [{"lane": lane["lane"], "first_attempt": "failure", "rerun_job": f"e2e-m1 / {lane['lane']} (rerun)"} for lane in lanes]}
          pathlib.Path(os.environ["RUNNER_TEMP"], "e2e-reruns.json").write_text(json.dumps(record, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"lanes={json.dumps({'include': lanes})}\ncount={len(lanes)}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              if lanes:
                  summary.write("### Automatic e2e reruns\n\nEach lane below failed its first attempt and runs once more; its rerun decides this run.\n\n")
                  summary.writelines(f"- e2e-m1 / {lane['lane']}\n" for lane in lanes)
              else:
                  summary.write("Every e2e lane passed its first attempt; no rerun.\n")
          PYTHON
      - if: ${{ steps.plan.outputs.count != '0' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-reruns-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-reruns.json
          retention-days: 90

  e2e-lane-rerun:
    needs: [paths, e2e-rerun-plan]
    if: ${{ !cancelled() && needs.e2e-rerun-plan.result == 'success' && needs.e2e-rerun-plan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.e2e-rerun-plan.outputs.lanes) }}
    name: e2e-m1 / ${{ matrix.lane }} (rerun)
    concurrency:
      group: e2e-m1-rerun-${{ matrix.lane }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ matrix.job_timeout }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          cache: e2e-arm64
      - name: Prepare the hosted runner
        run: timeout --foreground 180 bash test/e2e/m1/teardown.sh prepare
      - name: e2e-m1 / ${{ matrix.lane }} (rerun)
        timeout-minutes: ${{ matrix.budget }}
        uses: ./.github/actions/e2e-lane
        with:
          lane: ${{ matrix.lane }}
          entry: ${{ matrix.entry }}
          packages: ${{ matrix.packages }}
          timeout: ${{ matrix.timeout }}
      - if: ${{ always() }}
        name: Record the rerun
        env:
          NAME: ${{ matrix.lane }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ]; then
            echo "### e2e-m1 / $NAME passed its automatic rerun after failing its first attempt: a flake, recorded in e2e-reruns-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### e2e-m1 / $NAME failed its first attempt and its one automatic rerun: the run stays red" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=e2e-m1 / $NAME::failed its first attempt and its one automatic rerun"
          fi

  e2e-m1:
    if: ${{ always() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.paths.outputs.runtime == 'true') }}
    needs: [paths, e2e-lane, e2e-rerun-plan, e2e-lane-rerun]
    concurrency:
      group: e2e-m1-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Check upstream results
        env:
          LANES: ${{ needs.e2e-lane.result }}
          PLAN: ${{ needs.e2e-rerun-plan.result }}
          RERUNS: ${{ needs.e2e-rerun-plan.outputs.count }}
          RERUN: ${{ needs.e2e-lane-rerun.result }}
        run: |
          test "$LANES" = success
          test "$PLAN" = success
          test "$RERUNS" = 0 || test "$RERUN" = success

  certificate-paths:
    needs: paths
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      changed: ${{ needs.paths.outputs.certificates }}
    steps:
      - run: test -n "${{ needs.paths.outputs.certificates }}"

  caller-key-changes:
    needs: paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - if: ${{ github.event_name == 'push' }}
        id: go
        uses: ./.github/actions/go
        with:
          cache: caller-key-changes
          modules-only: 'true'
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          CALLER_INPUTS: ${{ needs.paths.outputs.caller }}
        run: |
          if [ "$EVENT" = push ]; then
            python3 test/e2e/m1/callerkey/inputs.py
          else
            echo "changed=$CALLER_INPUTS" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}

  e2e-certificates:
    needs: certificate-paths
    if: ${{ needs.certificate-paths.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          cache: e2e-arm64
      - name: Install certificate lane tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb containerd iproute2 iptables ca-certificates
      - name: Build ts-orch
        run: go build -trimpath -o "$RUNNER_TEMP/terrascale-orchestrator" ./cmd/terrascale-orchestrator
      - name: Run real lease, rollout and recovery proofs
        run: bash test/e2e/m1/certificates/run.sh "$RUNNER_TEMP/terrascale-orchestrator"

  caller-key-build:
    needs: [caller-key-changes]
    if: ${{ needs.caller-key-changes.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go
        with:
          cache: caller-key-build
      - name: Build the overlay command and journey once
        run: bash test/e2e/m1/callerkey/build.sh "$RUNNER_TEMP/caller-key-bin"
      - name: Prove the shard partition
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/caller-key-bin/callerkey"
          for shard in {0..7}; do
            "$binary" list "$shard" 8
          done | sort > "$RUNNER_TEMP/sharded.txt"
          "$binary" list | sort > "$RUNNER_TEMP/unsharded.txt"
          diff -u "$RUNNER_TEMP/unsharded.txt" "$RUNNER_TEMP/sharded.txt"
          test -z "$(uniq -d "$RUNNER_TEMP/sharded.txt")"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caller-key-bin
          path: |
            ${{ runner.temp }}/caller-key-bin/callerkey
            ${{ runner.temp }}/caller-key-bin/terrascale-orchestrator
          retention-days: 1
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true' }}
        run: python3 scripts/ci/trim-go-cache.py
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}

  caller-key:
    needs: [caller-key-changes, caller-key-build]
    if: ${{ needs.caller-key-changes.outputs.changed == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    name: caller-key / ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: caller-key-bin
          path: ${{ runner.temp }}/caller-key-bin
      - name: Run caller-key lifecycle and recovery shard
        run: |
          set -euo pipefail
          start=$(date +%s)
          chmod +x "$RUNNER_TEMP/caller-key-bin/"*
          "$RUNNER_TEMP/caller-key-bin/callerkey" run "$RUNNER_TEMP/caller-key-bin/terrascale-orchestrator" "${{ matrix.shard }}" 8
          echo "caller-key shard ${{ matrix.shard }}/8: $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

  build:
    concurrency:
      group: fast-build-${{ github.ref }}
      cancel-in-progress: true
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    name: verify/go + artifact/linux-amd64-arm64
    outputs:
      publication: ${{ steps.inputs.outputs.publication }}
      qualified: ${{ steps.qualification.outputs.qualified }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - id: go
        uses: ./.github/actions/go
        with:
          cache: release
      - name: Prove this tree passed its PR gate
        id: qualification
        env:
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
        run: python3 -B scripts/ci/qualified-pr-tree.py
      - name: Scan legacy terms within CI
        run: |
          scanner="$RUNNER_TEMP/legacy-scanner"
          mkdir -p "$scanner"
          for file in scan.py terms.json allow-list.json owners.json; do
            curl --fail --silent --show-error --location --retry 2 \
              "https://raw.githubusercontent.com/TerraScale/terrascale/a2e200187ffe32084a10f2a81c9e3e1f59b49a29/scripts/legacy-scan/$file" \
              --output "$scanner/$file" &
          done
          wait
          base="$CHANGE_BASE"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            base=$(git rev-parse "$SOURCE_SHA^")
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/legacy-changed-index"
          git read-tree --empty
          git diff --name-only --diff-filter=ACMR -z "$base" "$SOURCE_SHA" | git update-index --add -z --stdin
          python3 "$scanner/scan.py" --repo ts-orchestrator --root . --output "$RUNNER_TEMP/legacy-hits.md"
      - name: Audit release package graphs
        if: ${{ steps.qualification.outputs.qualified != 'true' }}
        run: bash scripts/ci/audit-dependencies.sh source
      - name: Compare executable inputs with retained qualification
        id: inputs
        shell: bash
        env:
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          status=0
          python3 -B scripts/ci/release-inputs-changed.py || status=$?
          case $status in
            0) echo 'publication=required' >> "$GITHUB_OUTPUT" ;;
            3) echo 'publication=unchanged' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Build and verify this revision's static release binaries
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        shell: bash
        run: make --jobs=2 release-check GO=go
      - name: Audit and retain the verified release
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
        run: bash scripts/ci/retain-release.sh
      - id: provenance
        if: ${{ steps.qualification.outputs.qualified == 'true' && steps.inputs.outputs.publication == 'required' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
        run: bash scripts/ci/admit-provenance.sh check
      - name: Attest the release binaries
        if: ${{ steps.qualification.outputs.qualified == 'true' && steps.inputs.outputs.publication == 'required' && steps.provenance.outputs.need_attest == 'true' }}
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/terrascale-orchestrator-linux-amd64
            dist/terrascale-orchestrator-linux-arm64
          show-summary: false
      - name: Publish the signed GitHub release
        if: ${{ steps.qualification.outputs.qualified == 'true' && steps.inputs.outputs.publication == 'required' }}
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
        run: bash scripts/ci/publish-github-release.sh
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}

  release-publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.publication == 'required' && needs.build.outputs.qualified == 'true' }}
    name: ${{ needs.build.outputs.qualified == 'true' && 'deploy/release-publish' || 'deploy/release-publish (PR tree did not qualify)' }}
    concurrency:
      group: production-ts-orch
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            deploy/m1/regions.json
            .github/actions/ocir-login
            .github/actions/ocir-login/login.sh
            .github/actions/release-publish
            scripts/ci/admit-provenance.sh
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/release-publish
        with:
          domain-url: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          client-id: ${{ vars.OCI_TOKEN_EXCHANGE_CLIENT_ID }}
          client-secret: ${{ secrets.OCI_TOKEN_EXCHANGE_CLIENT_SECRET }}

  release-publish-after-lanes:
    needs: [build, e2e-m1, certificate-paths, e2e-certificates, caller-key-changes, caller-key]
    if: ${{ always() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.publication == 'required' && needs.build.outputs.qualified == 'false' && needs.e2e-m1.result == 'success' && needs.certificate-paths.result == 'success' && (needs.e2e-certificates.result == 'success' || (needs.e2e-certificates.result == 'skipped' && needs.certificate-paths.outputs.changed == 'false')) && needs.caller-key-changes.result == 'success' && (needs.caller-key.result == 'success' || needs.caller-key.result == 'skipped') }}
    name: ${{ needs.build.outputs.qualified == 'false' && 'deploy/release-publish' || 'deploy/release-publish (PR tree qualified)' }}
    concurrency:
      group: production-ts-orch
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            deploy/m1/regions.json
            .github/actions/ocir-login
            .github/actions/ocir-login/login.sh
            .github/actions/release-publish
            scripts/ci/admit-provenance.sh
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/release-publish
        with:
          domain-url: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          client-id: ${{ vars.OCI_TOKEN_EXCHANGE_CLIENT_ID }}
          client-secret: ${{ secrets.OCI_TOKEN_EXCHANGE_CLIENT_SECRET }}


  staging-latency:
    needs: [release-publish, release-publish-after-lanes]
    if: ${{ always() && (needs.release-publish.result == 'success' || needs.release-publish-after-lanes.result == 'success') }}
    name: deploy/staging-latency
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the released revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          cache: staging-latency
      - name: Read staging latency proof for this release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staging-latency-${{ github.sha }}
          path: ${{ runner.temp }}/staging-latency
      - name: Run the staging latency lane
        id: lane
        shell: bash
        run: |
          go run ./scripts/latency deploy/observability/production/latency-budgets.json "${RUNNER_TEMP}/staging-latency/manifest.json" > "${RUNNER_TEMP}/staging-latency/ci.json"
          python3 scripts/latency/verify.py deploy/observability/production/latency-budgets.json "${RUNNER_TEMP}/staging-latency" | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Write the staging bake latency input
        if: ${{ always() }}
        shell: bash
        env:
          LANE_OUTCOME: ${{ steps.lane.outcome }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          if not run.startswith("https://"):
              raise ValueError("latency run URL must use HTTPS")
          verdict = {"verdict": "pass" if os.environ["LANE_OUTCOME"] == "success" else "fail", "run": run}
          Path(os.environ["RUNNER_TEMP"], "staging-latency.json").write_text(json.dumps(verdict) + "\n")
          print(json.dumps(verdict))
          PYTHON
      - name: Upload the latency verdict to the released tag
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "ci-${GITHUB_SHA}-run-${GITHUB_RUN_ID}" "${RUNNER_TEMP}/staging-latency.json" --repo "${GITHUB_REPOSITORY}" --clobber

  all-green:
    name: all-green
    if: ${{ always() }}
    needs: [paths, lint, e2e-build, e2e-lane, e2e-rerun-plan, e2e-lane-rerun, e2e-m1, certificate-paths, e2e-certificates, caller-key-changes, caller-key-build, caller-key, build, release-publish, release-publish-after-lanes, staging-latency]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Check upstream results
        run: |
          set -euo pipefail
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
          test "${{ github.event_name != 'push' || needs.build.outputs.publication != 'required' || needs.release-publish.result == 'success' || needs.release-publish-after-lanes.result == 'success' }}" = true
          test "${{ needs.certificate-paths.result == 'success' && (needs.e2e-certificates.result == 'success' || needs.certificate-paths.outputs.changed == 'false') }}" = true
          test "${{ needs.caller-key-changes.result == 'success' && (needs.caller-key.result == 'success' || needs.caller-key.result == 'skipped') }}" = true
          test "${{ github.event_name != 'workflow_dispatch' || (needs.lint.result == 'success' && needs.e2e-m1.result == 'success' && needs.e2e-certificates.result == 'success' && needs.caller-key.result == 'success' && needs.build.result == 'skipped' && needs.release-publish.result == 'skipped' && needs.release-publish-after-lanes.result == 'skipped') }}" = true
