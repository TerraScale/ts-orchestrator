name: TerraScale Orchestrator Go checks

# Every change is checked. Only changed executable/image inputs publish bytes.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  # Weekly full check of main that also rebuilds the image, so base and
  # package updates land even when no image input changed.
  schedule:
    - cron: '17 3 * * 1'

# A newer push supersedes a running check of the same branch. On main the
# newer revision contains the older one and becomes the candidate.
concurrency:
  group: ts-orchestrator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  # TS-795 switch guard: fails when the change adds an on/off setting.
  # Policy is vendored so fork PRs require no external credentials.
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          ZERO_CONFIG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ZERO_CONFIG_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          if [ -z "$ZERO_CONFIG_BASE" ] || [ "$ZERO_CONFIG_BASE" = "0000000000000000000000000000000000000000" ]; then
            ZERO_CONFIG_BASE=$(git rev-parse "$ZERO_CONFIG_HEAD^")
          fi
          python3 scripts/ci/zero-config-check.py "$ZERO_CONFIG_BASE" "$ZERO_CONFIG_HEAD"
          python3 scripts/ci/test_zero_config_check.py -v
          python3 -I -B -m unittest discover -s scripts/ci -p test_image_inputs_changed.py -v
          python3 -I -B -m unittest discover -s scripts/ci -p test_ci_artifact_graph.py -v

  build:
    permissions:
      contents: write
      actions: write
      statuses: write
      # GitHub OIDC token: the release push credential (no stored secret).
      id-token: write
    needs: [guard]
    name: verify/go + artifact/linux-amd64-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Bound nested parallelism: make, Go packages and race shards
      # otherwise each try to use every CPU on the shared builder.
      GOFLAGS: -p=4
      GOMAXPROCS: '2'
      TS_RACE_JOBS: '6'
      # Timer-bound controller labs run in their own pool beside the CPU jobs.
      TS_RACE_IDLE_JOBS: '5'
      # Pull requests run the fast tier (go test -short); pushes run every
      # tier-gated test and the fixturetest build. Images are built only
      # from main pushes, so the full tier still gates every image.
      TS_TEST_TIER: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - name: Verify the source revision and Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "${source_commit}" = "${SOURCE_SHA:?event SHA is required}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          go_version="$(go env GOVERSION)"
          test "${go_version}" = "go1.27.1"
          mkdir -p "$(go env GOCACHE)" "$(go env GOMODCACHE)"
          test -w "$(go env GOCACHE)"
          test -w "$(go env GOMODCACHE)"
          df -h /tmp
          printf 'gocache=%s gomodcache=%s goflags=%s gomaxprocs=%s cpus=%s\n' \
            "$(go env GOCACHE)" "$(go env GOMODCACHE)" "$(go env GOFLAGS)" "${GOMAXPROCS}" "$(nproc)"
          for pressure in cpu io memory; do
            if [[ -r /proc/pressure/${pressure} ]]; then
              printf '%s pressure: ' "${pressure}"
              cat "/proc/pressure/${pressure}"
            fi
          done
          printf 'source=%s tree=%s go=%s\n' \
            "${source_commit}" "$(git rev-parse "HEAD^{tree}")" "${go_version}"

      # Go's test cache keys the repository files a test reads on size and
      # modification time. Content-derived times let tests whose inputs did
      # not change hit the persistent cache after this fresh checkout.
      - name: Install shell validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Stamp tracked files with content-derived times
        shell: bash
        run: go run ./scripts/ci/stablemtime

      - name: Check and test every revision
        shell: bash
        run: make ci-check GO=go GOFMT=gofmt

      - name: Compare executable and image inputs with retained qualification
        id: inputs
        shell: bash
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          status=0
          python3 -B scripts/ci/release-inputs-changed.py || status=$?
          case $status in
            0) echo 'publication=required' >> "$GITHUB_OUTPUT" ;;
            3) echo 'publication=unchanged' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Build and verify this revision's static release binaries
        if: ${{ steps.inputs.outputs.publication == 'required' }}
        shell: bash
        run: make --jobs=2 release-check GO=go

      - name: Retain verified binaries and qualification manifest
        if: ${{ steps.inputs.outputs.publication == 'required' && github.event_name != 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-qualification.sh


      # Deployment failure must not erase the time this build became qualified.
      - name: Record the qualified main build for the deployment-lag guard
        if: ${{ steps.inputs.outputs.publication == 'required' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=deployment/qualified \
            -f description='Verified main build ready for automatic deployment'
      # Last, after the release is retained, so the image job never holds a
      # builder slot while it waits for these checks; it still confirms this
      # run succeeded and skips itself if it did not. The run's own result
      # never depends on it: a failed dispatch is visible here and is
      # repaired by dispatching image.yml for this revision by hand. Only a
      # change to an image input (scripts/ci/image-inputs-changed.sh) or the
      # weekly schedule starts a build.
      - name: Start the image build for this revision
        if: ${{ steps.inputs.outputs.publication == 'required' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/dispatch-image.sh

      # Push the retained release to every region's ts-orch over NATS
      # (deploy/m1/regions.json); fails when any region does not serve it.
      - name: Push the release to every region
        if: ${{ steps.inputs.outputs.publication == 'required' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="ci-${GITHUB_SHA}-run-${GITHUB_RUN_ID}"
          dist/terrascale-orchestrator-linux-amd64 release push --sha "${GITHUB_SHA}" --tag "${tag}" --dir dist \
            | tee "${RUNNER_TEMP}/release-push.jsonl"
          jq -r '"| \(.region) | \(.state) | \(.connect_ms) | \(.accepted_ms) | \(.serving_ms) |"' "${RUNNER_TEMP}/release-push.jsonl" \
            | { printf '| Region | State | Connect ms | Accepted ms | Serving ms |\n|---|---|---|---|---|\n'; cat; } >> "${GITHUB_STEP_SUMMARY}"
