name: CI time
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch) || github.run_id }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}
permissions:
  actions: read
  checks: read
  issues: write
jobs:
  ci-time:
    uses: TerraScale/.github/.github/workflows/ci-time.yml@b2244dc7f9f527ca7a24e86854741ba7671ad265
