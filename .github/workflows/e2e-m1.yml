name: M1 end to end

# The whole milestone 1 flow on a disposable arm64 host, like ts-gru-1:
# install.sh, single-host, service apply, the HTTPS edge, restarts, service rm.
# Step timings land in the job summary (test/e2e/m1/run.sh).
# The merge queue proves the exact tree main receives, so main pushes do not
# run it again.
on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

# The newest run of a pull request or branch cancels its older runs (user
# decision 2026-10-22); each merge-queue entry keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  m1:
    name: e2e/m1-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks for changed files
        id: changes
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 scripts/ci/check-inputs.py "$CHANGE_BASE" HEAD >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/go
        if: ${{ steps.changes.outputs.checks == 'true' }}
        with:
          cache: release
      - name: Build ts-orch
        if: ${{ steps.changes.outputs.checks == 'true' }}
        run: |
          start=$(date +%s)
          go build -trimpath -o "$RUNNER_TEMP/terrascale-orchestrator" ./cmd/terrascale-orchestrator
          echo "build: $(($(date +%s) - start)) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the M1 flow
        if: ${{ steps.changes.outputs.checks == 'true' }}
        run: test/e2e/m1/run.sh "$RUNNER_TEMP/terrascale-orchestrator"
