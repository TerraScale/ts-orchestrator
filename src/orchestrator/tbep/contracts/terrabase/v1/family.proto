syntax = "proto3";

package terrabase.v1;

option go_package = "terrascale.tech/terrabase-go/terrabase/v1;v1";

// Shared recursive document values. They live in this imported contract so
// every engine message can use the same wire types without an import cycle.
enum NullValue {
  NULL_VALUE_UNSPECIFIED = 0;
  NULL_VALUE_NULL = 1;
}

message ValueEntry {
  string name = 1;
  Value value = 2;
}

message ValueList { repeated Value items = 1; }

message Value {
  oneof kind {
    NullValue null = 1;
    bool boolean = 2;
    sint64 integer = 3;
    double number = 4;
    string text = 5;
    ValueList list = 6;
    ValueMap map = 7;
  }
}

message ValueMap { repeated ValueEntry entries = 1; }
