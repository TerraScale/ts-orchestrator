// TerraBase engine protocol (TBEP) over gRPC.
//
// This file is the contract of record between the Rust engine
// (`terrabase-tbep`, served by tonic) and every client, led by the
// terrabase-go client in this repository. See
// docs/adr/0025-private-protobuf-grpc.md.
//
// Identity: `terrabase.engine.protocol`, registry lineage 1.x, gRPC
// protocol generation 2 (gRPC replaces the custom framing of wire
// generation 1).
//
// Cross-cutting conventions:
//
// - The bound database scope rides gRPC metadata, not request fields: every
//   RPC except `Channel/Bind` requires exactly one `x-tb-principal`,
//   `x-tb-tenant`, `x-tb-project`, and `x-tb-database` value. A missing,
//   duplicated, or invalid value fails closed. On production mTLS the
//   principal must equal the authenticated client certificate's sole SPIFFE
//   URI SAN.
// - Mutations carry their retry identity in the `x-tb-idempotency-key`
//   metadata key (1..=128 bytes, no control characters); the engine
//   deduplicates retries within its retained horizon.
// - Host failures return a gRPC status whose `details` carry one
//   `TbepError` message naming the closed error code and the bounded
//   detail. Clients map codes, never string-match details.
// - Field bounds named in comments are enforced fail-closed by the
//   server; `0` is never a valid enum value on the wire for the closed
//   vocabularies below.

syntax = "proto3";

package terrabase.v1;

import "terrabase/v1/family.proto";

option go_package = "terrascale.tech/terrabase-go/terrabase/v1;v1";

// ---------------------------------------------------------------------------
// Shared closed vocabularies
// ---------------------------------------------------------------------------

// The cluster mode of the serving topology.
enum ClusterMode {
  CLUSTER_MODE_UNSPECIFIED = 0;
  CLUSTER_MODE_STANDALONE = 1;
  CLUSTER_MODE_ACTIVE = 2;
  CLUSTER_MODE_BACKUP = 3;
}

// The kind of one backbone change event.
enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_PUT = 1;
  CHANGE_KIND_DELETE = 2;
}

// One ordered backbone change event.
message ChangeEvent {
  uint64 sequence = 1;
  string operation_id = 2; // <= 128 bytes.
  ChangeKind kind = 3;
  string collection = 4;   // <= 64 bytes.
  string document = 5;     // <= 64 bytes.
}

// Where a subscription starts.
message SubscriptionStart {
  oneof start {
    SubscriptionLive live = 1;
    uint64 sequence = 2;
  }
}

// Start from the live edge.
message SubscriptionLive {}

// The serving health of the engine.
enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_STARTING = 1;
  HEALTH_STATE_SERVING = 2;
  HEALTH_STATE_DRAINING = 3;
  HEALTH_STATE_STOPPED = 4;
}

// Why the engine was asked to shut down.
enum ShutdownReason {
  SHUTDOWN_REASON_UNSPECIFIED = 0;
  SHUTDOWN_REASON_OPERATOR = 1;
  SHUTDOWN_REASON_SUPERVISOR = 2;
}

// Why a subscription closed.
enum SubscriptionCloseReason {
  SUBSCRIPTION_CLOSE_REASON_UNSPECIFIED = 0;
  SUBSCRIPTION_CLOSE_REASON_REPLACED = 1;
  SUBSCRIPTION_CLOSE_REASON_SHUTTING_DOWN = 2;
}

// The transport a binding serves. The gRPC serving replaces the retired
// UDS/QUIC custom bindings; local sockets and mTLS TCP remain.
enum BindingKind {
  BINDING_KIND_UNSPECIFIED = 0;
  BINDING_KIND_LOCAL = 1;
  BINDING_KIND_NETWORK_MTLS = 2;
}

// ---------------------------------------------------------------------------
// Backbone subscriptions
// ---------------------------------------------------------------------------

message BackboneServiceSubscribeRequest {
  uint64 subscription_id = 1;
  repeated string collections = 2; // <= 64 items, each <= 64 bytes.
  SubscriptionStart from = 3;
}

message BackboneServiceSubscribeResponse {
  uint64 subscription_id = 1;
  uint64 start_sequence = 2;
}

message BackboneServiceAcknowledgeRequest {
  uint64 subscription_id = 1;
  uint64 through_sequence = 2;
}

message BackboneServiceAcknowledgeResponse {
  uint64 subscription_id = 1;
  uint64 acknowledged_through = 2;
}

message BackboneServiceUnsubscribeRequest {
  uint64 subscription_id = 1;
}

message BackboneServiceUnsubscribeResponse {
  uint64 subscription_id = 1;
}

// An ordered, bounded batch of change events.
message SubscriptionBatch {
  uint64 subscription_id = 1;
  uint64 from_sequence = 2;
  repeated ChangeEvent events = 3; // <= 256 items.
  uint64 next_sequence = 4;
}

// The content-free change trigger: the client re-pulls.
message TriggerNotification {
  uint64 subscription_id = 1;
  string collection = 2;     // <= 64 bytes.
  uint64 sequence = 3;
  string operation_id = 4;   // <= 128 bytes.
}

// The subscription closed.
message SubscriptionClosed {
  uint64 subscription_id = 1;
  SubscriptionCloseReason reason = 2;
}

// The server-stream event of one backbone subscription: the initial
// confirmation, then ordered batches, triggers, and the close frame.
message SubscribeResponse {
  oneof event {
    BackboneServiceSubscribeResponse subscribed = 1;
    SubscriptionBatch batch = 2;
    TriggerNotification trigger = 3;
    SubscriptionClosed closed = 4;
  }
}

// ---------------------------------------------------------------------------
// Schema and migrations
// ---------------------------------------------------------------------------

// One field of a declared schema rule document.
message SchemaViolation {
  string field = 1; // <= 64 bytes.
  ViolationKind kind = 2;
}

// The closed schema-violation vocabulary.
enum ViolationKind {
  VIOLATION_KIND_UNSPECIFIED = 0;
  VIOLATION_KIND_DOCUMENT_NOT_OBJECT = 1;
  VIOLATION_KIND_MISSING_REQUIRED_FIELD = 2;
  VIOLATION_KIND_TYPE_MISMATCH = 3;
  VIOLATION_KIND_VALUE_NOT_ALLOWED = 4;
  VIOLATION_KIND_NUMBER_OUT_OF_RANGE = 5;
  VIOLATION_KIND_LENGTH_OUT_OF_RANGE = 6;
}

// The closed coercion vocabulary of a retype transform.
enum Coercion {
  COERCION_UNSPECIFIED = 0;
  COERCION_INTEGER_TO_TEXT = 1;
  COERCION_TEXT_TO_INTEGER = 2;
  COERCION_INTEGER_TO_NUMBER = 3;
  COERCION_NUMBER_TO_INTEGER = 4;
}

// Why a transform literal was rejected.
enum TransformRejection {
  TRANSFORM_REJECTION_UNSPECIFIED = 0;
  TRANSFORM_REJECTION_VALUE_NOT_COERCIBLE = 1;
  TRANSFORM_REJECTION_TARGET_FIELD_OCCUPIED = 2;
}

// The literal default of a retype transform.
message TransformLiteral {
  oneof literal {
    bool boolean = 1;
    sint64 integer = 2;
    string text = 3;
  }
}

// The closed field-transform vocabulary.
enum FieldTransform {
  FIELD_TRANSFORM_UNSPECIFIED = 0;
  FIELD_TRANSFORM_ADD_FIELD = 1;
  FIELD_TRANSFORM_REMOVE_FIELD = 2;
  FIELD_TRANSFORM_RENAME_FIELD = 3;
  FIELD_TRANSFORM_RETYPE_FIELD = 4;
}

// One step of a migration contract.
message FieldTransformStep {
  FieldTransform kind = 1;
  string field = 2; // <= 64 bytes.
  string to = 3;    // <= 64 bytes.
  TransformLiteral default = 4;
  Coercion coercion = 5;
}

// The declared migration contract.
message SchemaMigrationContract {
  string collection = 1; // <= 64 bytes.
  uint64 from_version = 2;
  uint64 to_version = 3;
  Value target = 4;
  repeated FieldTransformStep transforms = 5; // <= 64 items.
}

// One problem of a migration plan.
message PlanProblem {
  string document = 1; // <= 64 bytes.
  string field = 2;    // <= 64 bytes.
  PlanProblemKind kind = 3;
  TransformRejection rejection = 4;
  repeated SchemaViolation violations = 5; // <= 256 items.
}

// The closed plan-problem vocabulary.
enum PlanProblemKind {
  PLAN_PROBLEM_KIND_UNSPECIFIED = 0;
  PLAN_PROBLEM_KIND_TRANSFORM_REJECTED = 1;
  PLAN_PROBLEM_KIND_TARGET_VIOLATIONS = 2;
}

// The per-kind transform counts of a plan.
message TransformCounts {
  uint64 added = 1;
  uint64 removed = 2;
  uint64 renamed = 3;
  uint64 retyped = 4;
}

// The state of a collection's migration.
message MigrationState {
  MigrationStateKind kind = 1;
  string manifest = 2; // <= 128 bytes.
  uint64 from_version = 3;
  uint64 to_version = 4;
  uint64 documents = 5;
  uint64 transformed = 6;
  uint64 pages = 7;
}

// The closed migration-state vocabulary.
enum MigrationStateKind {
  MIGRATION_STATE_KIND_UNSPECIFIED = 0;
  MIGRATION_STATE_KIND_NONE = 1;
  MIGRATION_STATE_KIND_IN_PROGRESS = 2;
  MIGRATION_STATE_KIND_ROLLING_BACK = 3;
  MIGRATION_STATE_KIND_COMPLETE = 4;
}

// The closed rollback-limit vocabulary.
enum RollbackLimitKind {
  ROLLBACK_LIMIT_KIND_UNSPECIFIED = 0;
  ROLLBACK_LIMIT_KIND_REVERSIBLE = 1;
  ROLLBACK_LIMIT_KIND_NOT_REVERSIBLE = 2;
}

// The dry-run plan of a migration.
message MigrationPlan {
  string manifest = 1;        // <= 128 bytes.
  string collection = 2;      // <= 64 bytes.
  uint64 from_version = 3;
  uint64 to_version = 4;
  bool ready = 5;
  uint64 documents = 6;
  string source_digest = 7;   // <= 64 bytes.
  string result_digest = 8;   // <= 64 bytes.
  TransformCounts transform_counts = 9;
  repeated PlanProblem problems = 10; // <= 256 items.
  bool problems_truncated = 11;
}

// The receipt of an applied migration.
message MigrationReceipt {
  string collection = 1;
  string manifest = 2;
  uint64 from_version = 3;
  uint64 to_version = 4;
  string source_digest = 5;
  string result_digest = 6;
  uint64 documents = 7;
  uint64 transformed = 8;
  TransformCounts transform_counts = 9;
  uint64 pages = 10;
  RollbackLimitKind rollback_limit = 11;
  bool acknowledged_not_rollbackable = 12;
  bool already_applied = 13;
}

message SchemaServiceDeclareRequest {
  string collection = 1; // <= 64 bytes.
  Value schema = 2;
  string operation_id = 3; // <= 128 bytes.
}

message SchemaServiceDeclareResponse {
  uint64 enforced_version = 1;
  uint32 rule_count = 2;
}

message SchemaServiceStatusRequest {
  string collection = 1; // <= 64 bytes.
}

message SchemaServiceStatusResponse {
  uint64 enforced_version = 1;
  uint32 rule_count = 2;
}

message SchemaServiceValidateRequest {
  string collection = 1; // <= 64 bytes.
  Value document = 2;
}

message SchemaServiceValidateResponse {
  uint64 enforced_version = 1;
  bool valid = 2;
  repeated SchemaViolation violations = 3; // <= 256 items.
}

message MigrationStatusRequest {
  string collection = 1; // <= 64 bytes.
}

message MigrationStatusResponse {
  MigrationState state = 1;
}

message MigrationDryRunRequest {
  SchemaMigrationContract contract = 1;
}

message MigrationDryRunResponse {
  MigrationPlan plan = 1;
}

message MigrationApplyRequest {
  SchemaMigrationContract contract = 1;
  bool acknowledge_not_rollbackable = 2;
  string operation_id = 3; // <= 128 bytes.
}

message MigrationApplyResponse {
  MigrationReceipt receipt = 1;
}

// ---------------------------------------------------------------------------
// Replication observation
// ---------------------------------------------------------------------------

message ReplicationServiceConflictsRequest {}

// One causal-clock stamp of a conflict participant.
message ClockStamp {
  uint64 ticks = 1;
  uint64 counter = 2;
}

// The outcome of one resolved conflict.
message ConflictOutcome {
  ConflictOutcomeKind kind = 1;
  string member = 2; // <= 128 bytes.
}

// The closed conflict-outcome vocabulary.
enum ConflictOutcomeKind {
  CONFLICT_OUTCOME_KIND_UNSPECIFIED = 0;
  CONFLICT_OUTCOME_KIND_WINNER = 1;
  CONFLICT_OUTCOME_KIND_DEPOSED_OWNER_RETAINED = 2;
  CONFLICT_OUTCOME_KIND_UNTRUSTED_CLOCK = 3;
}

// One observed conflict.
message ConflictRecord {
  string tenant = 1; // <= 64 bytes.
  repeated string operations = 2; // <= 16 items.
  repeated string members = 3;    // <= 16 items.
  repeated ClockStamp clocks = 4; // <= 16 items.
  ConflictOutcome outcome = 5;
}

message ReplicationServiceConflictsResponse {
  string member = 1;
  repeated ConflictRecord records = 2; // <= 256 items.
}

message ReplicationServiceFencedRequest {}

// One observed fenced range.
message FencedRecord {
  string range = 1;       // <= 128 bytes.
  uint64 batch_epoch = 2;
  uint64 highest_epoch = 3;
  string source = 4;      // <= 128 bytes.
}

message ReplicationServiceFencedResponse {
  string member = 1;
  repeated FencedRecord records = 2; // <= 256 items.
}

message ReplicationServiceDepositionsRequest {}

// One observed leadership deposition.
message DepositionRecord {
  string range = 1;      // <= 128 bytes.
  uint64 held_epoch = 2;
  uint64 owner_epoch = 3;
  string new_owner = 4;  // <= 128 bytes.
}

message ReplicationServiceDepositionsResponse {
  string member = 1;
  repeated DepositionRecord records = 2; // <= 256 items.
}

message ReplicationServiceCursorRequest {}

message ReplicationServiceCursorResponse {
  string member = 1;
  uint64 position = 2;
}

message ReplicationServiceHealthRequest {}

// The closed replication-status vocabulary.
enum ReplicationStatus {
  REPLICATION_STATUS_UNSPECIFIED = 0;
  REPLICATION_STATUS_ASSIGNED = 1;
  REPLICATION_STATUS_ACTIVE = 2;
  REPLICATION_STATUS_RESPONSIVE = 3;
  REPLICATION_STATUS_STALE = 4;
  REPLICATION_STATUS_UNAVAILABLE = 5;
  REPLICATION_STATUS_DEGRADED = 6;
  REPLICATION_STATUS_UNKNOWN = 7;
}

message ReplicationServiceHealthResponse {
  string member = 1;
  ReplicationStatus status = 2;
}

message ReplicationServiceDenialsRequest {}

// Which seam observed a cross-tenant denial.
enum DenialSeam {
  DENIAL_SEAM_UNSPECIFIED = 0;
  DENIAL_SEAM_SERVE_REQUEST = 1;
  DENIAL_SEAM_APPLY_DELIVERY = 2;
}

// One observed cross-tenant denial.
message DenialRecord {
  DenialSeam seam = 1;
  string scope_tenant = 2;     // <= 64 bytes.
  string attempted_tenant = 3; // <= 64 bytes.
  string counterparty = 4;     // <= 128 bytes.
}

message ReplicationServiceDenialsResponse {
  string member = 1;
  repeated DenialRecord records = 2; // <= 256 items.
}

// ---------------------------------------------------------------------------
// Topology, administration, supervision
// ---------------------------------------------------------------------------

message ChannelServiceBindRequest {
  string principal = 1; // 1..=128 bytes.
  string tenant = 2;    // 1..=64 bytes.
  string project = 3;   // 1..=255 bytes.
  string database = 4;  // 1..=255 bytes.
}

message ChannelServiceBindResponse {
  string principal = 1;
  string tenant = 2;
  uint64 serving_instance = 3;
  string project = 4;
  string database = 5;
}

message MaintenanceServiceTopologyReadRequest {}

message MaintenanceServiceTopologyReadResponse {
  BindingKind binding = 1;
  repeated string subsystems = 2; // <= 16 items.
  bool engine_topology_available = 3;
  ClusterMode cluster_mode = 4;
}

message MaintenanceServiceAdminStatusRequest {}

message MaintenanceServiceAdminStatusResponse {
  string registry_version = 1;
  uint64 frames_served = 2;
  uint32 sessions = 3;
  uint32 subscriptions = 4;
  uint32 scopes = 5;
}

message MaintenanceServiceSupervisionHealthRequest {}

message MaintenanceServiceSupervisionHealthResponse {
  HealthState state = 1;
  uint32 sessions = 2;
  uint32 subscriptions = 3;
  uint64 frames_served = 4;
}

message MaintenanceServiceSupervisionShutdownRequest {
  ShutdownReason reason = 1;
}

message MaintenanceServiceSupervisionShutdownResponse {
  HealthState state = 1;
  uint32 in_flight = 2;
}

// ---------------------------------------------------------------------------
// Authoritative usage facts
// ---------------------------------------------------------------------------

// The closed usage meter vocabulary. Meter versions are immutable and travel
// beside this kind so a consumer never guesses which accounting rule applied.
enum UsageMeter {
  USAGE_METER_UNSPECIFIED = 0;
  USAGE_METER_ADMITTED_REQUEST_UNITS = 2;
  USAGE_METER_PUBLIC_EGRESS_BYTES = 3;
  USAGE_METER_DOCUMENT_WRITE_UNITS = 4;
  USAGE_METER_STORAGE_BYTE_SECONDS = 5;
  reserved 1, 6 to 10;
  reserved "USAGE_METER_STORED_BYTE_HOURS", "USAGE_METER_ACTIVE_REGION_SEATS",
      "USAGE_METER_BACKUP_BYTE_HOURS", "USAGE_METER_RESTORE_WORK";
}

// The integer unit carried by one usage fact.
enum UsageUnit {
  USAGE_UNIT_UNSPECIFIED = 0;
  USAGE_UNIT_REQUEST_UNIT = 2;
  USAGE_UNIT_BYTE = 3;
  USAGE_UNIT_WRITE_UNIT = 4;
  USAGE_UNIT_BYTE_SECOND = 5;
  reserved 1, 6 to 10;
  reserved "USAGE_UNIT_BYTE_HOUR", "USAGE_UNIT_SEAT_HOUR",
      "USAGE_UNIT_RESTORE_WORK";
}

// The scope at which the meter charges one unit.
enum UsageChargeScope {
  USAGE_CHARGE_SCOPE_UNSPECIFIED = 0;
  USAGE_CHARGE_SCOPE_ADMITTED_REQUEST = 2;
  USAGE_CHARGE_SCOPE_PUBLIC_EGRESS = 3;
  USAGE_CHARGE_SCOPE_DOCUMENT_WRITE = 4;
  USAGE_CHARGE_SCOPE_LOGICAL_STORAGE = 5;
  reserved 1, 6 to 10;
  reserved "USAGE_CHARGE_SCOPE_ACTIVE_REGION_COPY",
      "USAGE_CHARGE_SCOPE_ACTIVE_REGION_SEAT", "USAGE_CHARGE_SCOPE_BACKUP_COPY",
      "USAGE_CHARGE_SCOPE_EXPLICIT_RESTORE";
}

// The stable event identity that prevents retries and replicas from minting a
// second fact.
enum UsageMintingRule {
  USAGE_MINTING_RULE_UNSPECIFIED = 0;
  USAGE_MINTING_RULE_STABLE_ADMITTED_REQUEST = 2;
  USAGE_MINTING_RULE_PUBLIC_RESPONSE = 3;
  USAGE_MINTING_RULE_ACCEPTED_ORIGIN_COMMIT = 4;
  USAGE_MINTING_RULE_LOGICAL_STORAGE = 5;
  reserved 1, 6 to 10;
  reserved "USAGE_MINTING_RULE_ACTIVE_REGION_HOUR",
      "USAGE_MINTING_RULE_BACKUP_BYTE_HOUR",
      "USAGE_MINTING_RULE_EXPLICIT_RESTORE";
}

// Closed Region vocabulary for usage accounting. These values are canonical
// airport codes; callers cannot supply aliases or free-form Region names.
enum UsageRegion {
  USAGE_REGION_UNSPECIFIED = 0;
  USAGE_REGION_GRU = 1;
  USAGE_REGION_SFO = 2;
  USAGE_REGION_FRA = 3;
}

// Record admits only facts whose public-boundary work cannot be attached to
// an engine mutation. One call records one fact and is idempotent by the
// (meter, fact_id) identity. x-tb-idempotency-key must equal fact_id.
enum UsageRecordMeter {
  USAGE_RECORD_METER_UNSPECIFIED = 0;
  USAGE_RECORD_METER_ADMITTED_REQUEST_UNITS = 1;
  USAGE_RECORD_METER_PUBLIC_EGRESS_BYTES = 2;
  USAGE_RECORD_METER_DOCUMENT_WRITE_UNITS = 3;
  USAGE_RECORD_METER_STORAGE_BYTE_SECONDS = 4;
}

message UsageServiceRecordRequest {
  UsageRecordMeter meter = 1;
  string project = 2;       // 1..=255 bytes.
  string database = 3;      // 1..=255 bytes.
  string partition = 4;     // 1..=255 bytes.
  UsageRegion origin_region = 5;
  string fact_id = 6;       // 1..=128 bytes.
  uint64 recorded_at_millis = 7;
  uint32 meter_version = 8;
  // Canonical positive i128. Admitted-request units are <= 1,000,000;
  // public-egress bytes are <= 1,099,511,627,776 (1 TiB).
  string integer_units = 9;
}

message UsageServiceRecordResponse {
  uint64 sequence = 1;
  uint64 replica_epoch = 2;
  bool already_recorded = 3;
}

// One WAL-durable, canonically encoded usage fact. The signed quantity is a
// canonical base-10 i128 string because protobuf has no portable i128 scalar.
// Consumers deduplicate on (minting_rule, fact_id) and preserve the canonical
// bytes for audit. The tenant must equal the identity metadata bound to the RPC.
message UsageFact {
  string fact_id = 1; // 1..=255 bytes.
  UsageMeter meter = 2;
  uint32 meter_version = 3;
  UsageUnit unit = 4;
  UsageChargeScope charge_scope = 5;
  UsageMintingRule minting_rule = 6;
  string tenant = 7;      // 1..=64 bytes.
  string project = 8;     // 1..=255 bytes.
  string database = 9;    // 1..=255 bytes.
  string partition = 10;  // 1..=255 bytes.
  UsageRegion region = 11;
  uint64 measurement_start_millis = 12;
  uint64 measurement_end_millis = 13;
  string integer_delta = 14; // Canonical signed i128, <= 40 bytes and nonzero.
  uint64 sequence = 15;
  uint64 replica_epoch = 16;
  uint32 format_version = 17;
  bytes canonical = 18; // Canonical durable fact envelope, <= 64 KiB.
  bytes checksum = 19;  // Exactly 32 bytes; the envelope's trailing checksum.
}

// Reads one stable, tenant-bound snapshot. Window bounds are an all-or-none
// half-open pair. The continuation is opaque and bound to the tenant, exact
// filters, and snapshot sequence selected by the first page.
message UsageServiceExportRequest {
  optional uint64 window_start_millis = 1;
  optional uint64 window_end_millis = 2;
  uint32 page_size = 3;   // 1..=256 facts.
  bytes continuation = 4; // <= 1024 bytes; empty starts a snapshot.
}

// Facts are ordered by (sequence, minting_rule, fact_id). An empty
// continuation completes the snapshot. Facts committed after
// snapshot_sequence are excluded from every page in this response chain.
message UsageServiceExportResponse {
  repeated UsageFact facts = 1; // <= 256 facts.
  bytes continuation = 2;       // <= 1024 bytes.
  uint64 snapshot_sequence = 3;
}

// ---------------------------------------------------------------------------
// The error detail
// ---------------------------------------------------------------------------

// The closed engine error vocabulary, carried in gRPC status details.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNSUPPORTED_VERSION = 1;
  ERROR_CODE_MALFORMED_REQUEST = 2;
  ERROR_CODE_UNKNOWN_OPERATION = 3;
  ERROR_CODE_DIGEST_MISMATCH = 4;
  ERROR_CODE_IDEMPOTENCY_PAIRING = 5;
  ERROR_CODE_UNBOUND_CHANNEL = 6;
  ERROR_CODE_ALREADY_BOUND = 7;
  ERROR_CODE_INVALID_REQUEST = 8;
  ERROR_CODE_OPERATION_REFUSED = 9;
  ERROR_CODE_ENGINE_FAILURE = 10;
  ERROR_CODE_SESSION_REFUSED = 11;
  ERROR_CODE_SUBSCRIPTION_REFUSED = 12;
  ERROR_CODE_CHECKPOINT_REFUSED = 13;
  ERROR_CODE_SHUTTING_DOWN = 14;
  ERROR_CODE_REQUEST_TOO_LARGE = 15;
  ERROR_CODE_OVERLOADED = 16;
  ERROR_CODE_PROTOCOL_VERSION_MISMATCH = 17;
  ERROR_CODE_BACKUP_CLUSTER_READ_ONLY = 18;
  ERROR_CODE_BACKUP_CLUSTER_IMMUTABLE = 19;
  reserved 20;
  ERROR_CODE_FRONTIER_UNREACHABLE = 21;
  ERROR_CODE_USAGE_UNAVAILABLE = 22;
  ERROR_CODE_USAGE_CORRUPT = 23;
}

// The machine-readable failure detail of one refused RPC.
message TbepError {
  ErrorCode code = 1;
  string detail = 2; // <= 512 bytes.
}

// A protobuf `Any`, as defined by the language-neutral wire contract; the
// status envelope below is the `google.rpc.Status` shape so stock gRPC
// clients decode engine failures without extra dependencies.
message Any {
  string type_url = 1;
  bytes value = 2;
}

// The `google.rpc.Status` shape carried in gRPC trailing status details.
message RpcStatus {
  int32 code = 1;
  string message = 2;
  repeated Any details = 3;
}

// ---------------------------------------------------------------------------
// Services
// ---------------------------------------------------------------------------

// Channel identity: validates the application identity the metadata
// carries and answers the serving instance.
service ChannelService {
  rpc Bind(ChannelServiceBindRequest) returns (ChannelServiceBindResponse);
}

// The backbone change stream.
service BackboneService {
  // Opens one subscription; the stream delivers the confirmation, then
  // ordered batches, triggers, and the close frame. Acknowledgements and
  // teardown ride the sibling unary RPCs on the same channel.
  rpc Subscribe(BackboneServiceSubscribeRequest) returns (stream SubscribeResponse);
  rpc Acknowledge(BackboneServiceAcknowledgeRequest) returns (BackboneServiceAcknowledgeResponse);
  rpc Unsubscribe(BackboneServiceUnsubscribeRequest) returns (BackboneServiceUnsubscribeResponse);
}

// Schema declaration and migrations.
service SchemaService {
  rpc Declare(SchemaServiceDeclareRequest) returns (SchemaServiceDeclareResponse);
  rpc Status(SchemaServiceStatusRequest) returns (SchemaServiceStatusResponse);
  rpc Validate(SchemaServiceValidateRequest) returns (SchemaServiceValidateResponse);
  rpc MigrationStatus(MigrationStatusRequest) returns (MigrationStatusResponse);
  rpc MigrationDryRun(MigrationDryRunRequest) returns (MigrationDryRunResponse);
  rpc MigrationApply(MigrationApplyRequest) returns (MigrationApplyResponse);
}

// Replication observation (read-only).
service ReplicationService {
  rpc Conflicts(ReplicationServiceConflictsRequest) returns (ReplicationServiceConflictsResponse);
  rpc Fenced(ReplicationServiceFencedRequest) returns (ReplicationServiceFencedResponse);
  rpc Depositions(ReplicationServiceDepositionsRequest) returns (ReplicationServiceDepositionsResponse);
  rpc Cursor(ReplicationServiceCursorRequest) returns (ReplicationServiceCursorResponse);
  rpc Health(ReplicationServiceHealthRequest) returns (ReplicationServiceHealthResponse);
  rpc Denials(ReplicationServiceDenialsRequest) returns (ReplicationServiceDenialsResponse);
}

// Host-wide observation of the complete immutable admitted database scope set.
message MaintenanceServiceCatchUpStatusRequest {}
message DatabaseCatchUpStatus {
  string tenant = 1;
  string project = 2;
  string database = 3;
  uint64 source_sequence = 4;
  uint64 regional_sequence = 5;
  bool regional_measured = 6;
  bool causal_measured = 7;
  bool causal_caught_up = 8;
  uint64 backup_source_sequence = 9;
  uint64 backup_protected_sequence = 10;
  bool backup_measured = 11;
  bool backup_caught_up = 12;
}
message MaintenanceServiceCatchUpStatusResponse {
  bool complete = 1;
  string assignment_revision = 2;
  uint64 observed_at_unix_ms = 3;
  repeated DatabaseCatchUpStatus databases = 4;
}

// Topology, administration, and supervision.
service MaintenanceService {
  rpc CatchUpStatus(MaintenanceServiceCatchUpStatusRequest) returns (MaintenanceServiceCatchUpStatusResponse);
  rpc TopologyRead(MaintenanceServiceTopologyReadRequest) returns (MaintenanceServiceTopologyReadResponse);
  rpc AdminStatus(MaintenanceServiceAdminStatusRequest) returns (MaintenanceServiceAdminStatusResponse);
  rpc SupervisionHealth(MaintenanceServiceSupervisionHealthRequest) returns (MaintenanceServiceSupervisionHealthResponse);
  rpc SupervisionShutdown(MaintenanceServiceSupervisionShutdownRequest) returns (MaintenanceServiceSupervisionShutdownResponse);
}

// Tenant-bound export of authoritative WAL-durable usage facts.
service UsageService {
  rpc Record(UsageServiceRecordRequest) returns (UsageServiceRecordResponse);
  rpc Export(UsageServiceExportRequest) returns (UsageServiceExportResponse);
}

// Host-scoped orchestrator control. These RPCs require x-tb-principal matching
// the authenticated mTLS certificate and a dedicated orchestrator allowlist.
// They do not accept database scope metadata and never grant permission to serve.
service PlacementControlService {
  // Persists an intent only. x-tb-idempotency-key binds the exact canonical
  // request and authenticated principal. A retry returns its original revision.
  rpc Stage(PlacementStageRequest) returns (PlacementProposalResponse);
  rpc Get(PlacementGetRequest) returns (PlacementProposalResponse);
  // Verifies and durably retains a signed GRU epoch proof matching staged intent.
  // Admission permits catch-up only; it does not assert data readiness.
  rpc Accept(PlacementAcceptRequest) returns (PlacementAcceptanceResponse);
  rpc GetAccepted(PlacementGetRequest) returns (PlacementAcceptanceResponse);
  // Executes a durably authorized old-epoch fence and returns a member-signed
  // frontier receipt only after origin+physical work has durably drained.
  rpc Drain(PlacementDrainRequest) returns (PlacementDrainResponse);
  rpc Readiness(PlacementReadinessRequest) returns (PlacementDrainResponse);
}

// Authenticated private lifecycle control. Every mutation is bound to the
// accepted placement and authority proof; mTLS identity alone is insufficient.
service LifecycleControlService {
  rpc ResolveRecoveryPoint(ResolveRecoveryPointRequest) returns (ResolveRecoveryPointResponse);
  rpc RestoreToTarget(RestoreToTargetRequest) returns (LifecycleControlResponse);
  rpc RestoreStats(RestoreStatsRequest) returns (RestoreStatsResponse);
  rpc EnsureSnapshot(LifecycleControlRequest) returns (LifecycleControlResponse);
  rpc VerifySnapshotPlacement(LifecycleControlRequest) returns (LifecycleControlResponse);
  rpc CloseDatabase(LifecycleControlRequest) returns (LifecycleControlResponse);
  rpc StopNativeBackup(LifecycleControlRequest) returns (LifecycleControlResponse);
  rpc Reactivate(LifecycleReactivateRequest) returns (LifecycleControlResponse);
  rpc DeleteOwnedData(LifecycleControlRequest) returns (LifecycleControlResponse);
}

// Read-only source resolution under its accepted placement and lifecycle grant.
message ResolveRecoveryPointRequest {
  LifecycleControlContext context = 1;
  string operation_id = 2;
  string selection_kind = 3; // latest or point_id; unsupported time selections refuse.
  string point_id = 4;
  uint64 unix_millis = 5;
}

// One physical participant in a logical recovery envelope. Participants are
// ordered by participant_id in the canonical envelope and each local cut is
// retained independently; a logical recovery point must never collapse these
// boundaries into one scalar.
message RecoveryParticipant {
  string participant_id = 1;
  string database_id = 2;
  uint64 journal_cut = 3;
  string manifest_digest = 4;
  string checksum = 5;
  uint64 row_count = 6;
  uint64 captured_at_millis = 7;
  uint64 retained_until_millis = 8;
}

// Authenticated logical recovery-point facts. The envelope_digest binds the
// complete ordered participant set, including unequal journal boundaries.
// Producers must reject duplicate, missing, or reordered participants before
// exposing this message as a restore point.
message RecoveryEnvelopeFacts {
  string envelope_digest = 1;
  string database_id = 2;
  string database_incarnation = 3; // lowercase 32-digit hexadecimal u128.
  uint64 route_generation = 4;
  repeated RecoveryParticipant participants = 5;
}

message ResolveRecoveryPointResponse {
  string operation_id = 1;
  string source_database = 2;
  string recovery_point_id = 3;
  string recovery_point_digest = 4;
  string journal_cut = 5;
  RestoreProvider provider = 6;
  uint64 captured_at_millis = 7;
  string checksum = 8;
  uint64 row_count = 9;
  repeated string placement = 10;
  // Set for a multi-participant logical point. Scalar fields above remain
  // populated for current callers during the coordinated migration; restore
  // authorization must use this complete envelope when present.
  RecoveryEnvelopeFacts envelope = 11;
}

message RestoreStatsRequest {
  LifecycleControlContext context = 1;
  string operation_id = 2;
  string target_owner = 3;
  string target_database = 4;
  string journal_cut = 5;
  uint64 restore_epoch = 6;
  // Required for envelope restores once the coordinated consumer migration
  // lands; absent means the legacy single-participant shape.
  RecoveryEnvelopeFacts envelope = 7;
}
message RestoreStatsResponse {
  string operation_id = 1;
  string target_owner = 2;
  string target_database = 3;
  string checksum = 4;
  int64 row_count = 5;
  string journal_cut = 6;
  repeated string placement = 7;
  bytes signed_completed_receipt = 8; // Complete-only pinned Ed25519 observation.
  RecoveryEnvelopeFacts envelope = 9;
}

message RestoreToTargetRequest {
  LifecycleControlContext context = 1;
  string operation_id = 2;
  string source_owner = 3; // Exact tenantID/projectID tuple.
  string source_database = 4;
  string recovery_point_id = 5;
  string recovery_point_digest = 6;
  string target_owner = 7; // Exact tenantID/projectID tuple.
  string target_database = 8;
  string journal_cut = 9;
  uint64 restore_epoch = 10;
  RestoreProvider provider = 11;
  // Carries every participant boundary and manifest identity for a logical
  // envelope restore. The scalar journal_cut remains during migration only.
  RecoveryEnvelopeFacts envelope = 12;
}

enum RestoreProvider {
  RESTORE_PROVIDER_UNSPECIFIED = 0;
  RESTORE_PROVIDER_OCI = 1;
  RESTORE_PROVIDER_TIGRIS = 2;
}

message LifecycleControlContext {
  string environment = 1;
  string tenant = 2;
  string project = 3;
  string database = 4;
  string region = 5;
  string member = 6;
  uint64 placement_revision = 7;
  uint64 authority_epoch = 8;
  string authority_lease = 9;
  bytes authority_signature = 10;
  bytes operation_grant = 11;
}

message LifecycleControlRequest {
  LifecycleControlContext context = 1;
  string operation_id = 2;
}

message LifecycleReactivateRequest {
  LifecycleControlRequest request = 1;
}

enum LifecycleStatus {
  LIFECYCLE_STATUS_UNSPECIFIED = 0;
  LIFECYCLE_STATUS_APPLIED = 1;
  LIFECYCLE_STATUS_ALREADY_APPLIED = 2;
  LIFECYCLE_STATUS_UNAVAILABLE = 3;
  LIFECYCLE_STATUS_ACCEPTED = 4;
}

message LifecycleControlResponse {
  LifecycleStatus status = 1;
  string operation_id = 2;
  string detail = 3;
  string recovery_point_id = 4;
  string recovery_point_digest = 5;
  repeated string placement = 6;
  bytes signed_completed_receipt = 7; // Empty until restore completion.
}

message PlacementRegionSeats {
  string region = 1; // GRU, SFO, or FRA.
  repeated string members = 2; // Exactly two distinct canonical Member ULIDs.
}

message PlacementDatabaseAssignment {
  string tenant = 1; // Canonical ULID.
  string project = 2; // Canonical ULID.
  string database = 3; // Canonical ULID.
  string region = 4;
  string writer_member = 5; // Explicit role; seat order never elects a writer.
  string follower_member = 6;
}

message PlacementProposal {
  string environment = 1; // Exact configured environment.
  string cluster = 2; // Exact configured Cluster ULID.
  uint64 generation = 3; // Positive; replacement strictly increases this and epoch.
  uint64 epoch = 4;
  repeated PlacementRegionSeats regions = 5; // 1..3; disjoint Member identities.
  repeated PlacementDatabaseAssignment assignments = 6; // Up to 1024 scopes x 3 Regions; unique scope/Region, subject to proposal byte limit.
}

// Immutable database residency supplied by authenticated provisioning authority.
// This declares control metadata only; it grants no local storage or writer seat.
message PlacementDatabaseDeclaration {
  string tenant = 1;
  string project = 2;
  string database = 3;
  repeated string selected_regions = 4;
}

message PlacementStageRequest {
  uint64 expected_revision = 1; // Local journal CAS revision, zero before first Stage.
  PlacementProposal proposal = 2;
  repeated PlacementDatabaseDeclaration declarations = 3; // Exact provisioning scope/residency; committed with proposal CAS.
}

message PlacementGetRequest {}

enum PlacementProposalStatus {
  PLACEMENT_PROPOSAL_STATUS_UNSPECIFIED = 0;
  // Persisted control intent; no membership, writer, or readiness authority.
  PLACEMENT_PROPOSAL_STATUS_PENDING = 1;
}

message PlacementProposalResponse {
  uint64 revision = 1;
  PlacementProposal proposal = 2;
  PlacementProposalStatus status = 3;
  // Member-signed fresh join challenge bound to the staged proposal.
  bytes join_challenge = 4;
}

// Dedicated GRU-authorized auth consensus bootstrap control. No user data.
// A pending placement proposal never authorizes this service's grants.
service AuthGroupBootstrapService {
  rpc Identity(AuthStorageIdentityRequest) returns (AuthStorageIdentity);
  rpc Bootstrap(AuthGroupBootstrapRequest) returns (AuthGroupBootstrapReceipt);
}
message AuthStorageIdentityRequest {}
message AuthStorageIdentity {
  string environment = 1;
  string cluster = 2;
  string member = 3;
  // Persisted engine-generated ULID. Changes after storage loss.
  string storage_incarnation = 4;
}
message AuthGroupVoter {
  uint64 node_id = 1;
  string member = 2;
  string spiffe_uri = 3;
  string region = 4;
  string storage_incarnation = 5;
}
message AuthGroupBootstrapGrant {
  string environment = 1;
  string cluster = 2;
  string group_id = 3; // Canonical ULID, allocated once by GRU control authority.
  string tenant = 4;
  string project = 5;
  string database = 6;
  uint64 generation = 7; // Exactly one; this API cannot change membership.
  repeated string regions = 8; // Immutable placement, sorted and unique.
  repeated AuthGroupVoter voters = 9; // Sorted by positive unique node_id.
  uint64 authority_revision = 10; // Exact committed GRU control journal sequence.
  uint64 genesis_node = 11; // Only this voter may initialize the new Raft group.
}
message AuthGroupBootstrapRequest {
  string operation_id = 1; // Stable control retry identity.
  AuthGroupBootstrapGrant grant = 2;
}
enum AuthGroupBootstrapStatus {
  AUTH_GROUP_BOOTSTRAP_STATUS_UNSPECIFIED = 0;
  // Persisted grant; this does not report quorum, durability, or API readiness.
  AUTH_GROUP_BOOTSTRAP_STATUS_PERSISTED = 1;
}
message AuthGroupBootstrapReceipt {
  string group_id = 1;
  uint64 generation = 2;
  uint64 authority_revision = 3;
  string storage_incarnation = 4;
  AuthGroupBootstrapStatus status = 5;
  AuthGroupBootstrapGrant grant = 6; // Exact immutable request grant echo.
  string operation_id = 7;
}

// Exact Signed JSON envelope from the GRU placementtransition producer.
message PlacementAcceptRequest {
  uint64 proposal_revision = 1;
  bytes proof = 2; // <=256 KiB; raw signed payload authenticated before decoding.
}

enum PlacementAcceptanceStatus {
  PLACEMENT_ACCEPTANCE_STATUS_UNSPECIFIED = 0;
  PLACEMENT_ACCEPTANCE_STATUS_ADMITTED_CATCHING_UP = 1;
}

message PlacementAcceptanceResponse {
  uint64 proposal_revision = 1;
  uint64 epoch = 2;
  uint64 generation = 3;
  string proof_digest = 4; // SHA256 of authenticated raw proof payload, lowercase hex.
  PlacementAcceptanceStatus status = 5;
}

message PlacementDrainRequest {
  bytes prepared_transition = 1; // <=256KiB Signed prepared_epoch GRU envelope.
}
message PlacementDrainResponse {
  bytes signed_receipt = 1; // Signed old_epoch_drained_fenced envelope.
}

message PlacementReadinessRequest {
  string tenant = 1; // Canonical tenant ULID.
  string project = 2; // Canonical project ULID.
  string database = 3; // Canonical database ULID.
  string operation_id = 4; // Exact durable provisioning operation.
  string nonce = 5; // Fresh challenge, exactly64 lowercase hex characters.
}
