rule_files:
  - ../../../../deploy/observability/production/operational-rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'ts_host_service_tasks_expected{job="host-storage",host="ts-sjc-1",region="sjc",service="ts-dashboard"}'
        values: '0+0x20'
      - series: 'ts_host_service_tasks_expected{job="host-storage",host="ts-sjc-2",region="sjc",service="ts-dashboard"}'
        values: '0+0x20'
      - series: 'ts_host_service_tasks_expected{job="host-storage",host="ts-fra-1",region="fra",service="ts-dashboard"}'
        values: '0+0x20'
      - series: 'ts_host_service_tasks_expected{job="host-storage",host="ts-fra-2",region="fra",service="ts-dashboard"}'
        values: '0+0x20'
      - series: 'ts_host_service_tasks_expected{job="host-storage",host="ts-gru-1",region="gru",service="ts-dashboard"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: HostServiceTaskInventoryMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: HostServiceTaskInventoryMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: host-storage
              host: ts-gru-2
              region: gru
            exp_annotations:
              summary: Service task inventory is absent on ts-gru-2
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 15m
        alertname: HostServiceTaskInventoryMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: host-storage
              host: ts-sjc-1
              region: sjc
            exp_annotations:
              summary: Service task inventory is absent on ts-sjc-1
          - exp_labels:
              severity: critical
              job: host-storage
              host: ts-sjc-2
              region: sjc
            exp_annotations:
              summary: Service task inventory is absent on ts-sjc-2
          - exp_labels:
              severity: critical
              job: host-storage
              host: ts-fra-1
              region: fra
            exp_annotations:
              summary: Service task inventory is absent on ts-fra-1
          - exp_labels:
              severity: critical
              job: host-storage
              host: ts-fra-2
              region: fra
            exp_annotations:
              summary: Service task inventory is absent on ts-fra-2
          - exp_labels:
              severity: critical
              job: host-storage
              host: ts-gru-1
              region: gru
            exp_annotations:
              summary: Service task inventory is absent on ts-gru-1
          - exp_labels:
              severity: critical
              job: host-storage
              host: ts-gru-2
              region: gru
            exp_annotations:
              summary: Service task inventory is absent on ts-gru-2
