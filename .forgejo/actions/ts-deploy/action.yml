name: TerraScale ts-deploy
description: >-
  Install the version-pinned ts-deploy release binary, verify both downloaded
  digests, and run the repository's declared CI with it.

# The composite installer is the tool surface every workflow uses. Consumers
# pin this action to a reviewed commit and supply the release identity through
# TS_DEPLOY_VERSION, TS_DEPLOY_SHA256, and TS_DEPLOY_SIGNATURE_SHA256, so a
# moving release tag cannot change the executable a job consumes.
inputs:
  repo:
    description: Literal repository name passed to ts-deploy ci --repo.
    required: true
  terrabase_path:
    description: >-
      Repository-relative path to a pinned TerraBase checkout. When set the
      action exports VM_TERRABASE_REPO before running CI (ts-orchestrator).
    required: false
    default: ""

outputs:
  cli:
    description: Absolute path of the verified ts-deploy binary.
    value: ${{ steps.install.outputs.cli }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      run: |
        set -eu
        case "$(uname -m)" in
          aarch64|arm64) asset=ts-deploy-linux-arm64 ;;
          x86_64|amd64) asset=ts-deploy-linux-amd64 ;;
          *) echo "ts-deploy: unsupported runner architecture" >&2; exit 1 ;;
        esac
        release="${TS_DEPLOY_VERSION:?TS_DEPLOY_VERSION is required}"
        case "${release}" in
          v[0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "ts-deploy: invalid ts-deploy release '${release}'" >&2; exit 1 ;;
        esac
        test "${#TS_DEPLOY_SHA256}" -eq 64
        case "${TS_DEPLOY_SHA256}" in *[!0-9a-fA-F]*) echo "ts-deploy: invalid ts-deploy artifact checksum" >&2; exit 1 ;; esac
        test "${#TS_DEPLOY_SIGNATURE_SHA256}" -eq 64
        case "${TS_DEPLOY_SIGNATURE_SHA256}" in *[!0-9a-fA-F]*) echo "ts-deploy: invalid ts-deploy signature checksum" >&2; exit 1 ;; esac
        directory="${RUNNER_TEMP:-/tmp}/ts-deploy-${release}"
        rm -rf -- "${directory}"
        mkdir -p -- "${directory}"
        cli="${directory}/ts-deploy"
        fj release view "${release}" --repo TerraScale/ts-deploy >/dev/null
        fj release asset download "${release}" "${asset}" --repo TerraScale/ts-deploy --output "${cli}"
        fj release asset download "${release}" "${asset}.sig" --repo TerraScale/ts-deploy --output "${cli}.sig"
        printf '%s  %s\n' "${TS_DEPLOY_SHA256}" "${cli}" | sha256sum --check --strict -
        printf '%s  %s\n' "${TS_DEPLOY_SIGNATURE_SHA256}" "${cli}.sig" | sha256sum --check --strict -
        chmod +x -- "${cli}"
        echo "ts-deploy ${release} (${asset}) verified"
        echo "cli=${cli}" >> "${GITHUB_OUTPUT}"
    - shell: bash
      env:
        TS_DEPLOY_CLI: ${{ steps.install.outputs.cli }}
        TS_DEPLOY_REPO: ${{ inputs.repo }}
        TS_DEPLOY_TERRABASE_PATH: ${{ inputs.terrabase_path }}
      run: |
        set -eu
        test -n "${TS_DEPLOY_REPO}" || { echo "ts-deploy: input 'repo' is required" >&2; exit 1; }
        case "${TS_DEPLOY_REPO}" in
          *[!A-Za-z0-9_-]*) echo "ts-deploy: invalid repository name '${TS_DEPLOY_REPO}'" >&2; exit 1 ;;
        esac
        if [ -n "${TS_DEPLOY_TERRABASE_PATH}" ]; then
          case "${TS_DEPLOY_TERRABASE_PATH}" in
            /*|*..*|*\\*) echo "ts-deploy: invalid TerraBase path '${TS_DEPLOY_TERRABASE_PATH}'" >&2; exit 1 ;;
          esac
          VM_TERRABASE_REPO="${GITHUB_WORKSPACE:-$(pwd)}/${TS_DEPLOY_TERRABASE_PATH}"
          export VM_TERRABASE_REPO
        fi
        exec "${TS_DEPLOY_CLI}" ci --repo "${TS_DEPLOY_REPO}"
