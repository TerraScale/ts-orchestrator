name: TerraScale orchestrator checks

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ format('pr-{0}-{1}', forgejo.repository, forgejo.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  diagnostic-host:
    name: diagnostic/runner-host
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: uname -s

  diagnostic-host-go:
    name: diagnostic/runner-host-go
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: go version

  diagnostic-host-setup-go:
    name: diagnostic/runner-host-setup-go
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - uses: https://data.forgejo.org/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version: "1.27.0", cache: false }
      - run: go version

  diagnostic-host-docker:
    name: diagnostic/runner-host-docker
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: docker version

  diagnostic-host-podman:
    name: diagnostic/runner-host-podman
    runs-on: terrascale-builder
    timeout-minutes: 5
    steps:
      - run: podman version

  diagnostic-public-container:
    name: diagnostic/public-go-container
    runs-on: terrascale-builder
    timeout-minutes: 5
    container:
      image: docker.io/library/golang@sha256:eef6a67266eeed3c86dd47fd01b32faa8bf0229eb83eb3d4d466e80391bd3820
    steps:
      - run: go version

  bootstrap:
    name: deploy-cli
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          repository: TerraScale-Old/TerraScale.Deploy
          fetch-depth: 0
          persist-credentials: false
          path: ts-deploy
      - uses: https://data.forgejo.org/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: ts-deploy/go.mod
          cache: false
      - name: Install the exact reviewed Deploy CLI module
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOPRIVATE: git.terrascale.tech
          GONOSUMDB: git.terrascale.tech
        run: |
          set -euo pipefail
          test "$(git -C ts-deploy rev-parse HEAD)" = "7bab7e06ae78c86162126e9b1a0d9600038e90bc"
          git config --global url."file://${PWD}/ts-deploy".insteadOf "https://git.terrascale.tech/TerraScale/ts-deploy.git"
          GOBIN=.tools go install git.terrascale.tech/TerraScale/ts-deploy/cmd/terrascale-deploy@v1.0.81-0.20260830224025-7bab7e06ae78
          go version -m .tools/terrascale-deploy
          .tools/terrascale-deploy ci resolve-cli
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: deploy-cli
          path: .tools
          if-no-files-found: error
          retention-days: 1

  plan:
    name: plan
    needs: bootstrap
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          fetch-depth: 0
          persist-credentials: false
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli, path: .tools }
      - name: Plan the orchestrator profiles
        run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci plan --repository-root . --require-clean-source --output artifacts/plan.json

  pr-static:
    name: pr/static
    needs: [bootstrap, plan]
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0, persist-credentials: false }
      - uses: https://data.forgejo.org/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version-file: go.mod, cache: false }
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli, path: .tools }
      - name: Run the static profile
        run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci pr --repository-root . --profile static

  pr-build:
    name: pr/build
    needs: [bootstrap, plan]
    runs-on: terrascale-builder
    timeout-minutes: 45
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0, persist-credentials: false }
      - uses: https://data.forgejo.org/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version-file: go.mod, cache: false }
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli, path: .tools }
      - name: Run the build profile
        run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci pr --repository-root . --profile build

  pr-test:
    name: pr/test
    needs: [bootstrap, plan]
    runs-on: terrascale-builder
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0, persist-credentials: false }
      - uses: https://data.forgejo.org/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version-file: go.mod, cache: false }
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli, path: .tools }
      - name: Run the test profile
        run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci pr --repository-root . --profile test

  pr-artifact:
    name: pr/artifact
    needs: [bootstrap, plan]
    runs-on: terrascale-builder
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0, persist-credentials: false }
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli, path: .tools }
      - name: Build the architecture artifacts
        run: chmod +x .tools/terrascale-deploy && .tools/terrascale-deploy ci pr --repository-root . --profile artifact
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: orchestrator-linux-amd64-arm64
          path: artifacts/orchestrator
          if-no-files-found: error
          retention-days: 7
