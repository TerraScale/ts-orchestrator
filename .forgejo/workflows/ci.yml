# CI = the repository verification set (workspace GOAL.md section 5),
# the same commands `make check` runs.
name: check

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 30
    runs-on: terrascale-builder
    container:
      image: git.terrascale.tech/terrascale/terrascale-builder@sha256:0c5a6f8c1c18fdd801acd6b02bc3cb159d080a0aa40e41832312a455a34cdf2d
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech", persist-credentials: false }
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race -count=1 ./...
