name: ts-orchestrator CI

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  ci:
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      TS_DEPLOY_RELEASE_SIGNING_KEY: ${{ secrets.TS_DEPLOY_RELEASE_SIGNING_KEY }}
      TERRASCALE_RELEASE_MANIFEST: .terrascale-develop-release/manifest.json
      TERRASCALE_DELIVERY_REQUEST: .terrascale-develop-release/request.json
      TERRASCALE_ORCHESTRATOR_DELIVERY_URL: ${{ secrets.TERRASCALE_ORCHESTRATOR_DELIVERY_URL }}
      TERRASCALE_ORCHESTRATOR_TOKEN: ${{ secrets.TERRASCALE_ORCHESTRATOR_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run ts-deploy CI
        env:
          TS_DEPLOY_READ_TOKEN: ${{ secrets.TS_DEPLOY_READ_TOKEN }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) asset=ts-deploy-linux-arm64 ;;
            x86_64|amd64) asset=ts-deploy-linux-amd64 ;;
            *) echo "unsupported runner architecture" >&2; exit 1 ;;
          esac
          location=$(curl --proto '=https' --tlsv1.2 -fsSI -H "Authorization: token ${TS_DEPLOY_READ_TOKEN}" "https://git.terrascale.tech/TerraScale/ts-deploy/releases/latest" | tr -d '\r' | awk 'tolower($1) == "location:" { count++; location=$2 } END { if (count != 1) exit 1; print location }')
          printf '%s\n' "${location}" | grep -Eq '^/TerraScale/ts-deploy/releases/tag/v0\.0\.0-dev\.([0-9a-f]{40}|[0-9a-f]{64})$'
          tag=${location##*/}
          release="https://git.terrascale.tech/TerraScale/ts-deploy/releases/download/${tag}"
          curl -fsSL -H "Authorization: token ${TS_DEPLOY_READ_TOKEN}" -o SHA256SUMS "${release}/SHA256SUMS" -o ts-deploy "${release}/${asset}"
          test "$(grep -Fc "  ${asset}" SHA256SUMS)" -eq 1
          awk -v asset="${asset}" '$2 == asset { print $1 "  ts-deploy" }' SHA256SUMS | sha256sum -c -
          chmod +x ts-deploy
          ./ts-deploy ci --repo ts-orchestrator
