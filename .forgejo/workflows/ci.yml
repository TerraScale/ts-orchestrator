name: ts-orchestrator CI

on:
  push:
    branches: [develop]

permissions:
  contents: read

# vm-test builds the TerraBase artifact from this exact source revision. Keep
# this pin in the consuming workflow so a clean checkout has the sibling
# repository that Makefile's default local path expects.
env:
  TS_TERRABASE_REV: de48591e0e37263c47b1a3ee6ce272346587d50d

jobs:
  ci:
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      TS_DEPLOY_VERSION: ${{ vars.TS_DEPLOY_VERSION }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          repository: TerraScale/terrabase
          ref: de48591e0e37263c47b1a3ee6ce272346587d50d
          path: terrabase
          fetch-depth: 1
          persist-credentials: false
      - run: |
          set -eu
          test "$(git -C terrabase rev-parse HEAD)" = "$TS_TERRABASE_REV"
          test -f terrabase/Cargo.toml
          test -f terrabase/rust-toolchain.toml
      - run: |
          set -eu
          case "$(uname -m)" in
            aarch64|arm64) asset=ts-deploy-linux-arm64 ;;
            x86_64|amd64) asset=ts-deploy-linux-amd64 ;;
            *) echo "unsupported runner architecture" >&2; exit 1 ;;
          esac
          release="${TS_DEPLOY_VERSION:-latest}"
          case "${release}" in
            latest|v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid ts-deploy release" >&2; exit 1 ;;
          esac
          fj release view "${release}" --repo TerraScale/ts-deploy >/dev/null
          fj release asset download "${release}" "${asset}" --repo TerraScale/ts-deploy --output ts-deploy
          chmod +x ts-deploy
      - run: VM_TERRABASE_REPO="$PWD/terrabase" ./ts-deploy ci --repo ts-orchestrator
