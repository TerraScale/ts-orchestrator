name: TerraScale Orchestrator Go checks

# Documentation and evidence never change a build: they neither run the
# checks nor produce a candidate or an image.
on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# A newer push supersedes a running check of the same branch. On main the
# newer revision contains the older one and becomes the candidate.
concurrency:
  group: ts-orchestrator-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify/go + artifact/linux-amd64-arm64
    runs-on: terrascale-builder
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ forgejo.sha }}
      # Persist dependency, build and test-result caches in the runner mount.
      GOCACHE: /cache/go/build
      GOMODCACHE: /cache/go/mod
      # Bound nested parallelism: make, Go packages, race shards and Python
      # otherwise each try to use every CPU on the shared builder.
      GOFLAGS: -p=2
      GOMAXPROCS: '2'
      TS_RACE_JOBS: '6'
      PYTHON_TEST_JOBS: '8'
    steps:
      - name: Check out the exact source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the source revision and Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "${source_commit}" = "${SOURCE_SHA:?event SHA is required}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          go_version="$(go env GOVERSION)"
          test "${go_version}" = "go1.27.1"
          mkdir -p "$(go env GOCACHE)" "$(go env GOMODCACHE)"
          test -w "$(go env GOCACHE)"
          test -w "$(go env GOMODCACHE)"
          printf 'gocache=%s gomodcache=%s goflags=%s gomaxprocs=%s cpus=%s\n' \
            "$(go env GOCACHE)" "$(go env GOMODCACHE)" "$(go env GOFLAGS)" "${GOMAXPROCS}" "$(nproc)"
          for pressure in cpu io memory; do
            if [[ -r /proc/pressure/${pressure} ]]; then
              printf '%s pressure: ' "${pressure}"
              cat "/proc/pressure/${pressure}"
            fi
          done
          printf 'source=%s tree=%s go=%s\n' \
            "${source_commit}" "$(git rev-parse "HEAD^{tree}")" "${go_version}"

      - name: Check, test and build static binaries in parallel
        shell: bash
        run: make ci-verify GO=go GOFMT=gofmt

      - name: Prepare pinned Forgejo admission client
        shell: bash
        run: |
          set -euo pipefail
          export TS_FJ_ADMISSION_CACHE_DIR="${TS_FJ_ADMISSION_CACHE_DIR-/cache/ts-orchestrator/fj-admission}"
          bash scripts/ci/prepare-fj-admission.sh "${RUNNER_TEMP}/fj-admission-bin"
          printf '%s\n' "${RUNNER_TEMP}/fj-admission-bin" >> "${GITHUB_PATH}"

      - name: Retain verified binaries and qualification manifest
        if: ${{ forgejo.event_name != 'pull_request' }}
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          FORGEJO_READ_TOKEN: ${{ secrets.TS_DEPLOY_READ_TOKEN }}
          FORGEJO_SERVER_URL: ${{ github.server_url }}
        run: bash scripts/ci/publish-qualification.sh

      # Last, so the image job finds the retained release at once. The run's
      # own result never depends on it: a failed dispatch is visible here and
      # is repaired by dispatching image.yml for this revision by hand.
      - name: Start the image build for this revision
        if: ${{ forgejo.event_name != 'pull_request' && forgejo.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          FORGEJO_SERVER_URL: ${{ github.server_url }}
        run: bash scripts/ci/dispatch-image.sh
