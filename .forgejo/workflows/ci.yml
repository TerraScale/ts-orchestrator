name: TerraScale orchestrator checks

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.repository }}-${{ forgejo.ref }}
  cancel-in-progress: true

env:
  TS_DEPLOY_REVISION: "5c6c68d95eb2dcbf0a9b1f57afd53a120ac1af3c"
  TS_DEPLOY_VERSION: "v1.0.81-0.20260831025036-5c6c68d95eb2"

jobs:
  bootstrap:
    name: deploy-cli
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      # The owner provisions this token with Contents: Read on only
      # TerraScale-Old/TerraScale.Deploy. It needs no write, package, or admin scope.
      - name: Require the read-only Deploy source token
        shell: bash
        env:
          TS_DEPLOY_READ_TOKEN: ${{ secrets.TS_DEPLOY_READ_TOKEN }}
        run: test -n "${TS_DEPLOY_READ_TOKEN}"
      - name: Fetch the exact reviewed Deploy source
        shell: bash
        env:
          TS_DEPLOY_READ_TOKEN: ${{ secrets.TS_DEPLOY_READ_TOKEN }}
        run: |
          set -euo pipefail
          askpass="${RUNNER_TEMP}/ts-deploy-askpass"
          trap 'rm -f "${askpass}"' EXIT
          cat >"${askpass}" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${TS_DEPLOY_READ_TOKEN:?}" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "${askpass}"
          git init --initial-branch=empty ts-deploy
          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 git -C ts-deploy \
            -c credential.helper= fetch --no-tags --depth=1 \
            https://git.terrascale.tech/TerraScale-Old/TerraScale.Deploy.git \
            "${TS_DEPLOY_REVISION}"
          git -C ts-deploy checkout --detach FETCH_HEAD
          test "$(git -C ts-deploy rev-parse HEAD)" = "${TS_DEPLOY_REVISION}"
      - uses: https://data.forgejo.org/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: ts-deploy/go.mod
          cache: false
      - name: Build the exact reviewed Deploy CLI
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOPRIVATE: git.terrascale.tech
          GONOSUMDB: git.terrascale.tech
          GOPROXY: direct
          GOBIN: ${{ runner.temp }}/terrascale-deploy/bin
        working-directory: ts-deploy
        run: |
          set -euo pipefail
          case "${GOBIN}" in /*) ;; *) echo "GOBIN must be absolute" >&2; exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "${TS_DEPLOY_REVISION}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "${GOBIN}"
          git config --global url."file://${PWD}".insteadOf "https://git.terrascale.tech/TerraScale/ts-deploy.git"
          go install git.terrascale.tech/TerraScale/ts-deploy/cmd/terrascale-deploy@v1.0.81-0.20260831025036-5c6c68d95eb2
          go version -m "${GOBIN}/terrascale-deploy" | tee "${RUNNER_TEMP}/terrascale-deploy-build.txt"
          grep -F "mod git.terrascale.tech/TerraScale/ts-deploy v1.0.81-0.20260831025036-5c6c68d95eb2" "${RUNNER_TEMP}/terrascale-deploy-build.txt"
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: deploy-cli-5c6c68d95eb2
          path: ${{ runner.temp }}/terrascale-deploy/bin
          if-no-files-found: error
          retention-days: 1

  plan:
    name: plan
    needs: bootstrap
    runs-on: terrascale-builder
    timeout-minutes: 15
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          fetch-depth: 0
          persist-credentials: false
      - name: Verify clean source before CLI download
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: deploy-cli-5c6c68d95eb2
          path: ${{ runner.temp }}/terrascale-deploy/bin
      - name: Plan the orchestrator profiles from clean source
        shell: bash
        run: |
          chmod +x "${RUNNER_TEMP}/terrascale-deploy/bin/terrascale-deploy"
          "${RUNNER_TEMP}/terrascale-deploy/bin/terrascale-deploy" ci plan \
            --repository-root . \
            --require-clean-source \
            --output "${RUNNER_TEMP}/orchestrator-plan.json"

  static:
    name: verify/static
    needs: [bootstrap, plan]
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0, persist-credentials: false }
      - uses: https://data.forgejo.org/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version-file: go.mod, cache: false }
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli-5c6c68d95eb2, path: "${{ runner.temp }}/terrascale-deploy/bin" }
      - name: Run the static profile
        run: chmod +x "${RUNNER_TEMP}/terrascale-deploy/bin/terrascale-deploy" && "${RUNNER_TEMP}/terrascale-deploy/bin/terrascale-deploy" ci pr --repository-root . --profile static

  build:
    name: verify/build
    needs: [bootstrap, plan]
    runs-on: terrascale-builder
    timeout-minutes: 45
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0, persist-credentials: false }
      - uses: https://data.forgejo.org/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version-file: go.mod, cache: false }
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli-5c6c68d95eb2, path: "${{ runner.temp }}/terrascale-deploy/bin" }
      - name: Run the build profile
        run: chmod +x "${RUNNER_TEMP}/terrascale-deploy/bin/terrascale-deploy" && "${RUNNER_TEMP}/terrascale-deploy/bin/terrascale-deploy" ci pr --repository-root . --profile build

  test:
    name: verify/test
    needs: [bootstrap, plan]
    runs-on: terrascale-builder
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0, persist-credentials: false }
      - uses: https://data.forgejo.org/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version-file: go.mod, cache: false }
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli-5c6c68d95eb2, path: "${{ runner.temp }}/terrascale-deploy/bin" }
      - name: Run the test profile
        run: chmod +x "${RUNNER_TEMP}/terrascale-deploy/bin/terrascale-deploy" && "${RUNNER_TEMP}/terrascale-deploy/bin/terrascale-deploy" ci pr --repository-root . --profile test

  artifact:
    name: artifact/linux-amd64-arm64
    needs: [bootstrap, plan, static, build, test]
    runs-on: terrascale-builder
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { github-server-url: "https://git.terrascale.tech", fetch-depth: 0, persist-credentials: false }
      - uses: https://data.forgejo.org/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version-file: go.mod, cache: false }
      - name: Require Podman artifact tooling
        shell: bash
        run: |
          set -euo pipefail
          command -v podman
          podman version
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with: { name: deploy-cli-5c6c68d95eb2, path: "${{ runner.temp }}/terrascale-deploy/bin" }
      - name: Build and validate the architecture artifacts with Podman
        run: chmod +x "${RUNNER_TEMP}/terrascale-deploy/bin/terrascale-deploy" && "${RUNNER_TEMP}/terrascale-deploy/bin/terrascale-deploy" ci pr --repository-root . --profile artifact
      - name: Stage the validated artifacts outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/orchestrator"
          cp -a artifacts/orchestrator/. "${RUNNER_TEMP}/orchestrator/"
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: orchestrator-linux-amd64-arm64
          path: ${{ runner.temp }}/orchestrator
          if-no-files-found: error
          retention-days: 7
