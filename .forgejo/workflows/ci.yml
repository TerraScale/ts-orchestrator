name: ts-orchestrator CI

on:
  push:
    branches: [develop]

permissions:
  contents: write

# vm-test builds the TerraBase artifact from this exact source revision. Keep
# this pin in the consuming workflow so a clean checkout has the sibling
# repository that Makefile's default local path expects.
env:
  TS_TERRABASE_REV: de48591e0e37263c47b1a3ee6ce272346587d50d

jobs:
  ci:
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      TS_DEPLOY_VERSION: ${{ vars.TS_DEPLOY_VERSION }}
      TS_DEPLOY_SHA256: ${{ vars.TS_DEPLOY_SHA256 }}
      TS_DEPLOY_SIGNATURE_SHA256: ${{ vars.TS_DEPLOY_SIGNATURE_SHA256 }}
      TS_DEPLOY_READ_TOKEN: ${{ secrets.TS_DEPLOY_READ_TOKEN }}
      FORGEJO_TOKEN: ${{ forgejo.token }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          repository: TerraScale/terrabase
          ref: de48591e0e37263c47b1a3ee6ce272346587d50d
          path: terrabase
          fetch-depth: 1
          persist-credentials: false
      - run: |
          set -eu
          test "$(git -C terrabase rev-parse HEAD)" = "$TS_TERRABASE_REV"
          test -f terrabase/Cargo.toml
          test -f terrabase/rust-toolchain.toml
      - uses: ./.forgejo/actions/ts-deploy
        with:
          repo: ts-orchestrator
          terrabase_path: terrabase
