name: TerraScale Orchestrator Go checks

# Documentation and evidence never change a build: they neither run the
# checks nor produce a candidate or an image.
on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
  # Weekly full check of main that also rebuilds the image, so base and
  # package updates land even when no image input changed.
  schedule:
    - cron: '17 3 * * 1'

# A newer push supersedes a running check of the same branch. On main the
# newer revision contains the older one and becomes the candidate.
concurrency:
  group: ts-orchestrator-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify/go + artifact/linux-amd64-arm64
    runs-on: terrascale-builder
    container:
      # Process labs and bounded log collectors must meet real lease/cleanup
      # deadlines even when Rust jobs saturate the shared Docker disk. This
      # per-job scratch mount retains files across child-process restarts;
      # dependency/build caches and published binaries remain persistent.
      # --init reaps the orphans that killed test shards and their helper
      # processes leave behind, instead of tail as PID 1.
      options: --init --tmpfs /tmp:rw,exec,nosuid,nodev,size=8g
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ forgejo.sha }}
      # Persist dependency, build and test-result caches in the runner mount.
      GOCACHE: /cache/go/build
      GOMODCACHE: /cache/go/mod
      # Bound nested parallelism: make, Go packages and race shards
      # otherwise each try to use every CPU on the shared builder.
      GOFLAGS: -p=4
      GOMAXPROCS: '2'
      TS_RACE_JOBS: '6'
      # Timer-bound controller labs run in their own pool beside the CPU jobs.
      TS_RACE_IDLE_JOBS: '5'
      # Pull requests run the fast tier (go test -short); pushes run every
      # tier-gated test and the fixturetest build. Images are built only
      # from main pushes, so the full tier still gates every image.
      TS_TEST_TIER: ${{ forgejo.event_name == 'pull_request' && 'pr' || 'full' }}
    steps:
      - name: Check out the exact source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the source revision and Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "${source_commit}" = "${SOURCE_SHA:?event SHA is required}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          go_version="$(go env GOVERSION)"
          test "${go_version}" = "go1.27.1"
          mkdir -p "$(go env GOCACHE)" "$(go env GOMODCACHE)"
          test -w "$(go env GOCACHE)"
          test -w "$(go env GOMODCACHE)"
          test "$(stat -f -c %T /tmp)" = tmpfs
          df -h /tmp
          printf 'gocache=%s gomodcache=%s goflags=%s gomaxprocs=%s cpus=%s\n' \
            "$(go env GOCACHE)" "$(go env GOMODCACHE)" "$(go env GOFLAGS)" "${GOMAXPROCS}" "$(nproc)"
          for pressure in cpu io memory; do
            if [[ -r /proc/pressure/${pressure} ]]; then
              printf '%s pressure: ' "${pressure}"
              cat "/proc/pressure/${pressure}"
            fi
          done
          printf 'source=%s tree=%s go=%s\n' \
            "${source_commit}" "$(git rev-parse "HEAD^{tree}")" "${go_version}"

      # Go's test cache keys the repository files a test reads on size and
      # modification time. Content-derived times let tests whose inputs did
      # not change hit the persistent cache after this fresh checkout.
      - name: Stamp tracked files with content-derived times
        shell: bash
        run: go run ./scripts/ci/stablemtime

      - name: Check, test and build static binaries in parallel
        shell: bash
        run: make ci-verify GO=go GOFMT=gofmt

      # Only the retain step uses the admission client; pull requests skip both.
      - name: Prepare pinned Forgejo admission client
        if: ${{ forgejo.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          export TS_FJ_ADMISSION_CACHE_DIR="${TS_FJ_ADMISSION_CACHE_DIR-/cache/ts-orchestrator/fj-admission}"
          bash scripts/ci/prepare-fj-admission.sh "${RUNNER_TEMP}/fj-admission-bin"
          printf '%s\n' "${RUNNER_TEMP}/fj-admission-bin" >> "${GITHUB_PATH}"

      - name: Retain verified binaries and qualification manifest
        if: ${{ forgejo.event_name != 'pull_request' }}
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          FORGEJO_READ_TOKEN: ${{ secrets.TS_DEPLOY_READ_TOKEN }}
          FORGEJO_SERVER_URL: ${{ github.server_url }}
        run: bash scripts/ci/publish-qualification.sh

      # Last, after the release is retained, so the image job never holds a
      # builder slot while it waits for these checks; it still confirms this
      # run succeeded and skips itself if it did not. The run's own result
      # never depends on it: a failed dispatch is visible here and is
      # repaired by dispatching image.yml for this revision by hand. Only a
      # change to an image input (scripts/ci/image-inputs-changed.sh) or the
      # weekly schedule starts a build.
      - name: Start the image build for this revision
        if: ${{ forgejo.event_name != 'pull_request' && forgejo.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          FORGEJO_SERVER_URL: ${{ github.server_url }}
        run: bash scripts/ci/dispatch-image.sh

      # A main build must dispatch delivery; missing configuration fails deployment visibly.
      # The weekly run deploys nothing: its revision is already deployed.
      - name: Start the fleet deployment for this revision
        if: ${{ forgejo.event_name != 'pull_request' && forgejo.event_name != 'schedule' && forgejo.ref == 'refs/heads/main' }}
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          FORGEJO_SERVER_URL: ${{ github.server_url }}
        run: bash scripts/ci/dispatch-image.sh deploy.yml
