name: Deployment lag guard

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: deployment-lag-guard
  cancel-in-progress: false

jobs:
  zero-config:
    name: Reject new configuration switches
    runs-on: terrascale-builder
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.policy.outputs.source_sha }}
    steps:
      - name: Check out the exact change with its history
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared TerraScale policy
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          repository: TerraScale/ts-builder
          ref: 4abae826a08090c4505d7c8f3d7adcd78be616ef
          path: .zero-config-policy
          token: ${{ secrets.TERRASCALE_BOT_TOKEN }}
          persist-credentials: false
      - name: Check the added lines
        id: policy
        env:
          ZERO_CONFIG_BASE: ${{ forgejo.event.pull_request.base.sha || forgejo.event.before }}
        run: |
          set -eu
          ZERO_CONFIG_HEAD=$(git rev-parse HEAD)
          if [ -z "$ZERO_CONFIG_BASE" ]; then
            ZERO_CONFIG_BASE=$(git rev-parse "$ZERO_CONFIG_HEAD^")
          fi
          python3 .zero-config-policy/scripts/zero-config-check.py "$ZERO_CONFIG_BASE" "$ZERO_CONFIG_HEAD"
          printf 'source_sha=%s\n' "$ZERO_CONFIG_HEAD" >> "$GITHUB_OUTPUT"

  guard:
    needs: [zero-config]
    runs-on: terrascale-builder
    timeout-minutes: 15
    env:
      CI: 'true'
      GOCACHE: /cache/go/build
      GOMODCACHE: /cache/go/mod
    steps:
      - name: Check out the protected main guard
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ needs.zero-config.outputs.source_sha }}
          persist-credentials: false

      - name: Compare qualified builds with fresh regional deployment proofs
        shell: bash
        env:
          FORGEJO_READ_TOKEN: ${{ secrets.TS_DEPLOY_READ_TOKEN }}
          FORGEJO_WRITE_TOKEN: ${{ forgejo.token }}
          TS_OBJECT_NAMESPACE: ${{ vars.TS_OBJECT_NAMESPACE }}
          TS_DEPLOY_OCI_USER: ${{ vars.TS_DEPLOY_OCI_USER }}
          TS_DEPLOY_OCI_TENANCY: ${{ vars.TS_DEPLOY_OCI_TENANCY }}
          TS_DEPLOY_OCI_FINGERPRINT: ${{ vars.TS_DEPLOY_OCI_FINGERPRINT }}
          TS_DEPLOY_OCI_KEY: ${{ secrets.TS_DEPLOY_OCI_KEY }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          printf '%s\n' "$TS_DEPLOY_OCI_KEY" > "$work/key.pem"
          unset TS_DEPLOY_OCI_KEY
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=sa-saopaulo-1\nkey_file=%s\n' \
            "$TS_DEPLOY_OCI_USER" "$TS_DEPLOY_OCI_FINGERPRINT" "$TS_DEPLOY_OCI_TENANCY" "$work/key.pem" > "$work/config"
          export OCI_CONFIG_FILE="$work/config"
          go run ./scripts/ci/deploylag
