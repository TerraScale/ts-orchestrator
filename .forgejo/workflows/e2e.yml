name: TerraScale E2E

on:
  pull_request:
    paths:
      - 'e2e/**'
      - '.forgejo/workflows/e2e.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: E2E target (prod uses the dedicated terrascale-e2e organization)
        required: true
        default: local
        type: choice
        options:
          - local
          - prod

# Let the harness finish cleanup rather than cancelling an active run.
concurrency:
  group: ts-orchestrator-e2e-${{ forgejo.ref }}-${{ inputs.target || 'local' }}
  cancel-in-progress: false

env:
  CI: 'true'
  SOURCE_SHA: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
  GOCACHE: /cache/go/build
  GOMODCACHE: /cache/go/mod
  GOFLAGS: -p=4
  GOMAXPROCS: '2'
  E2E_REPORT: report.json

defaults:
  run:
    shell: bash
    working-directory: e2e

jobs:
  zero-config:
    name: Reject new configuration switches
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Check out the exact change with its history
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared TerraScale policy
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          repository: TerraScale/ts-builder
          ref: 4abae826a08090c4505d7c8f3d7adcd78be616ef
          path: .zero-config-policy
          token: ${{ secrets.TERRASCALE_BOT_TOKEN }}
          persist-credentials: false
      - name: Check the added lines
        working-directory: .
        env:
          ZERO_CONFIG_BASE: ${{ forgejo.event.pull_request.base.sha || forgejo.event.before }}
          ZERO_CONFIG_HEAD: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
        run: |
          set -eu
          if [ -z "$ZERO_CONFIG_BASE" ]; then
            ZERO_CONFIG_BASE=$(git rev-parse "$ZERO_CONFIG_HEAD^")
          fi
          python3 .zero-config-policy/scripts/zero-config-check.py "$ZERO_CONFIG_BASE" "$ZERO_CONFIG_HEAD"

  local:
    needs: [zero-config]
    name: local E2E
    if: ${{ forgejo.event_name != 'workflow_dispatch' || inputs.target == 'local' }}
    runs-on: terrascale-builder
    container:
      options: --init --tmpfs /tmp:rw,exec,nosuid,nodev,size=8g
    timeout-minutes: 60
    env:
      E2E_TARGET: local
    steps:
      - name: Check out the exact source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the source revision and Go toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA:?event SHA is required}"
          test "$(go env GOVERSION)" = go1.27.1
          mkdir -p "$(go env GOCACHE)" "$(go env GOMODCACHE)"
          test -w "$(go env GOCACHE)"
          test -w "$(go env GOMODCACHE)"

      - name: Test, vet and build the standalone E2E module
        run: |
          set -euo pipefail
          go test -race ./...
          go vet ./...
          go build ./...

      - name: Run local E2E
        env:
          # Read-only artifact and source credentials; no production identity.
          TERRABASE_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          E2E_FORGEJO_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: go run .

      - name: Retain the local JSON report even on failure
        if: ${{ always() }}
        # Forgejo's v3-node20 fork uses the legacy artifact protocol.
        uses: https://data.forgejo.org/forgejo/upload-artifact@ed48a7bb0c8a9079492c354d37994c413423c83e
        with:
          name: e2e-local-${{ forgejo.sha }}-${{ forgejo.run_id }}
          path: e2e/report.json
          if-no-files-found: warn
          retention-days: 30

  prod:
    needs: [zero-config]
    name: production E2E (manual only)
    if: ${{ forgejo.event_name == 'workflow_dispatch' && inputs.target == 'prod' }}
    runs-on: terrascale-builder
    container:
      options: --init --tmpfs /tmp:rw,exec,nosuid,nodev,size=8g
    timeout-minutes: 30
    env:
      E2E_TARGET: prod
    steps:
      - name: Check out the exact source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the source revision and Go toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA:?event SHA is required}"
          test "$(go env GOVERSION)" = go1.27.1
          mkdir -p "$(go env GOCACHE)" "$(go env GOMODCACHE)"
          test -w "$(go env GOCACHE)"
          test -w "$(go env GOMODCACHE)"

      - name: Run production E2E in the dedicated organization
        env:
          TERRABASE_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          E2E_FORGEJO_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          # This URL configures the harness, not a public SDK default.
          E2E_TERRABASE_URL: https://gru.api.terrascale.tech
          E2E_AUTH_URL: https://gru.auth.terrascale.tech
          E2E_DASHBOARD_URL: ${{ vars.E2E_DASHBOARD_URL }}
          E2E_MANAGEMENT_CREDENTIAL: ${{ secrets.E2E_MANAGEMENT_CREDENTIAL }}
          E2E_USER_ID: ${{ secrets.E2E_USER_ID }}
          E2E_ORGANIZATION_ID: ${{ secrets.E2E_ORGANIZATION_ID }}
          # Existing org-scoped key: the SDK has no key-management API.
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          E2E_STATUS_URL: https://status.terrascale.tech
        run: go run .

      - name: Retain the production JSON report even on failure
        if: ${{ always() }}
        uses: https://data.forgejo.org/forgejo/upload-artifact@ed48a7bb0c8a9079492c354d37994c413423c83e
        with:
          name: e2e-prod-${{ forgejo.sha }}-${{ forgejo.run_id }}
          path: e2e/report.json
          if-no-files-found: warn
          retention-days: 30
