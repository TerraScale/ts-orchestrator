schemaVersion: 1
evidenceId: DLV-CREATENODE-001
title: CreateNode fail-closed provider-operation recovery slice
status: implementation-and-focused-test-evidence-not-production-enabled
scope:
  included:
    - existing OperationEngine dispatch intent is required as the operation authority
    - existing ProviderOwnershipEngine CreateNode intent is required as the provider authority
    - dedicated regional ORCH_OPERATIONS JetStream KV journal plus expiry-bounded ORCH_OPERATION_PROOFS single-use authority-proof ledger, with immutable infrastructure-owned RF3 configuration and an explicit pre-controller provision-journal path
    - signed persisted handoff receipt with full immutable provider/authorization binding and kid-based verification
    - deterministic fake provider and disabled-by-default OCI client boundary
  excluded:
    - live OCI provisioning, credentials, cloud mutation, and deployment qualification
    - node enrollment, scheduling, and cluster deployment
invariants:
  - INV-004: exact existing operation and provider authorization intents are required.
  - INV-005: a provider invocation is checkpointed before the side effect; a recorded create is never automatically reissued.
  - INV-006: a stale invocation reconciles only by the durable create key; unknown/not-found transitions to manual recovery.
security:
  receipt: ECDSA P-256 SHA-256, bound to operation/action, authenticated authorization tenant, node request, idempotency/create key, cell, compartment, generation/epoch, template, placement, bootstrap digest, authorization sequence/digest, issue time, and expiry; signed tenant proof must exactly equal the nonempty authenticated authorization-evidence tenant before binding or journaling
  recoveryLookup: separately signed, provider-audience-limited, binding-digest lookup authority persists at dispatch for at most seven days; every ProviderCallStarted reconciliation requires it independently, even while the mutation receipt remains valid; missing, null, malformed, or expired authority holds manual recovery without lookup
  invocationCapability: an enabled external actuator verifies a separately keyed, audience-bound capability bound to operation, checkpoint version, lease owner/token, nonce, binding digest, and lease expiry; immediately before mutation it must atomically consume that capability through the same authoritative R3 journal, which rereads the ProviderCallStarted checkpoint and rejects expired, finalized, stale-version, binding, lease-owner/token, nonce, or already-consumed claims
  journalEnvelope: one bounded AES-256-GCM envelope per operation key, with AAD binding the CreateNode journal domain, hashed operation key, key ID, and CAS precondition version; a rotation-aware injected regional key service supplies the active key and retained verification keys, and unknown/retired keys fail closed
  writerBoundary: the controller `run`/`check` role rejects every journal-writer NKey, mTLS, and reply-private-key environment value before resolving files; the separately admitted native `journal-writer` role rejects controller NKey/mTLS values and alone starts the private writer service with writer credentials. `provision-journal` resolves only its infrastructure NKey/mTLS identity, never loads the generic Infisical runtime secret environment, and never opens controller or writer private material. The controller's mutation client uses only its scoped NATS request/reply identity and the reply public verifier.
  mutationGate: CreateNode journal mutation, capability minting, and capability consumption require an existing exact immutable JetStream ORCH_OPERATIONS RF3 configuration and a healthy injected journal-key service; private mutation additionally requires the exact R3 ORCH_OPERATION_PROOFS store (history 1, five-minute max age, 256-byte values, 8 MiB cap). TS_ORCH_REPLICAS cannot influence either bucket and no RF1 fallback is permitted. Before controllers start, the explicit provision-journal command uses TS_ORCH_INFRA_NATS_NKEY_FILE plus TS_ORCH_INFRA_NATS_TLS_* mTLS material to create/update both exact raw KV streams. The NATS 2.14 allow_batch_publish field is written explicitly false through the raw JetStream API and read back as false; absent or true is rejected. The controller runtime opens and validates the operation journal for both R3 and R5; RF1 development does not construct or open it and CreateNode remains disabled. A private writer substrate is hosted only when the separate TS_ORCH_JOURNAL_NATS_NKEY_FILE, TS_ORCH_JOURNAL_NATS_TLS_*, NIST P-256 TS_ORCH_JOURNAL_AUTHORITY_PUBLIC_KEY_FILE, owner-private TS_ORCH_JOURNAL_REPLY_SIGNING_KEY_FILE, and TS_ORCH_JOURNAL_CONTROLLER_NKEYS are all present, the regional URL is TLS/R3-or-R5, and the local controller is an eligible identity. The journal-writer admission checks its writer TLS identity against the authority and reply SPKIs. Provision-journal resolves only infrastructure credentials and does not inspect controller or writer private material; cross-workload identity separation is enforced by the external credential-delivery policy. This substrate is not advertised as an authoritative CreateNode capability: the production NatsCreateNodeOperationJournal/key/signer/CreateNodeCoordinator composition and OCI remain unwired. NatsCreateNodeOperationJournal receives the actual configured NatsTopology and validates its same-cell description, not a test cell; all of its Create/Update calls require the private mutation client rather than direct KV publication. Persisted reads and transitions reject a binding from another cell. Validation compares each stream name/description/subject, retention, consumer/message/byte/age/size limits, file storage, compression, replicas, ack/discard/duplicate behavior, no placement/source/mirror/republish, sealing, delete/purge, rollup/direct, message TTL/delete-marker/counter/schedule/atomic-publish, persistence mode, and no user metadata. AllowRollupHdrs is false because CAS uses Nats-Expected-Last-Subject-Sequence and needs no rollup. Controllers publish only the exact private create/update subjects for journal mutations and subscribe only to caller-identity-scoped journal reply subjects; they have neither journal mutation subscription nor broad _INBOX permission. Regional writers share one queue group, retain the sole KV writer credentials, and accept any configured eligible controller identity. Each request additionally needs a separately signed authority proof bound to controller identity, cell, action, operation key, expected revision, ciphertext digest, lease, expiry, and nonce; after verification, a writer atomically create-consumes the proof's `(cell, controller, lease, nonce)` record in ORCH_OPERATION_PROOFS before attempting ORCH_OPERATIONS CAS. Duplicate or ledger-unavailable proofs fail closed before mutation; proof records expire after the five-minute maximum accepted proof lifetime. Every reply is signed by the distinct reply key over request digest, success, and revision; clients reject unsigned, mismatched, or forged replies. The Create/Update CAS acknowledgement is the authoritative JetStream Raft-quorum commit boundary. Management leader/follower/lag fields are sampled readiness/observability only and never an atomic all-three mutation fence.
  keyLifecycle: strict NIST P-256 algorithm/curve allowlist plus distinct receipt, tenant-authority, provider-attestation, recovery, and invocation key material/key-ID domains; composition rejects shared public material or kid across domains
  tamperHandling: receipt and every authoritative journal envelope are authenticated before any provider call
  secrets: no credential, private key, or receipt payload is logged or included in this evidence
validation:
  journalCommand: dotnet run --project tests/TerraScale.Orchestrator.Tests/TerraScale.Orchestrator.Tests.csproj --no-build --no-restore -- --reflection --treenode-filter '/*/*/NatsCreateNodeOperationJournalTests/**' --maximum-parallel-tests 4 --no-progress --timeout 5m --no-ansi
  journalResult: passed; 10 total, 10 succeeded, 0 failed; duration 20.871s at maximum parallelism 4; the same group also passed serially in 23.484s; one local nats-server process only
  credentialedPermissionCommand: dotnet run --project tests/TerraScale.Orchestrator.Tests/TerraScale.Orchestrator.Tests.csproj --no-build --no-restore -- --reflection --treenode-filter '/*/*/NatsCreateNodeOperationJournalTests/CredentialedControllerReceivesImmediateRejectionsAndStopsBothWritersBeforeFixtureTeardown' --maximum-parallel-tests 4 --no-progress --timeout 5m --no-ansi
  credentialedPermissionResult: included in journalResult; eight immediate invalid-request rejections are received after reply-subscription confirmation, two local controller NKeys use the queue-grouped private writer services without duplicate replies, and both writer services stop within the bounded teardown before their local fixture exits. Controllers cannot subscribe to mutation subjects, publish journal replies, use _INBOX, access either journal KV store, use either journal stream's JetStream DIRECT.GET or STREAM.MSG.GET APIs, or create push consumers and fetch pull consumers for either journal stream. The external production ACL gate must deny every protected-stream consumer create/list/info/delete/msg-next/acknowledgement/flow-control and push-delivery path. A syntactically valid writer-published forged reply is rejected by the client-side reply verifier; wrong-caller, cross-cell, ciphertext-digest-tampered, and replayed authority proofs are rejected before mutation
  permissionCommand: dotnet run --project tests/TerraScale.Orchestrator.Tests/TerraScale.Orchestrator.Tests.csproj --no-build --no-restore -- --reflection --treenode-filter '/*/*/DevelopmentNatsSecurityTests/DevelopmentNatsIdentitiesArePrivateDistinctAndPlaneScoped' --maximum-parallel-tests 4 --no-progress --timeout 5m --no-ansi
  permissionResult: passed; 1 total, 1 succeeded, 0 failed; duration 1.536s
  coordinatorCommand: dotnet run --project tests/TerraScale.Orchestrator.ControlPlane.Tests/TerraScale.Orchestrator.ControlPlane.Tests.csproj --no-build --no-restore -- --reflection --treenode-filter '/*/*/CreateNodeCoordinatorTests/**' --maximum-parallel-tests 4 --no-progress --timeout 5m --no-ansi
  coordinatorResult: passed; 17 total, 17 succeeded, 0 failed; duration 5.601s
  cases:
    - signed receipt tamper, expiry, tenant, and node-request binding
    - crash-after-provider-success reconciles without a second CreateNode against a deliberately non-deduplicating provider, including after mutation-receipt expiry
    - expired in-flight lease with not-found reconciliation enters manual recovery without a second CreateNode
    - full immutable receipt binding-field tamper, P-384 rejection, and key-rotation/unknown-kid checks
    - verified tenant-authorization proof and malicious provider reconciliation-proof rejection; provider proof signs the full canonical request binding digest
    - AES-GCM envelope tamper and retained-key rotation require a targeted R3 JetStream qualification lane; they are not claimed from the local RF1 process
    - two independent child processes contend through the actual development filesystem lock/CAS path; exactly one writes version 1 and the other observes the committed version without overwrite
    - OCI adapter disabled fail-closed without invoking its client
    - expired recovery authority holds manual recovery without provider lookup even while its mutation receipt remains valid
    - enabled OCI provider is rejected without client invocation when the journal is not authoritative crash-durable
    - direct enabled OCI CreateNode without a valid authoritative invocation capability is rejected before its client call
    - shared receipt/tenant trust material is rejected at coordinator composition; tenant proofs are issued only by the tenant-authority signer and must equal authenticated authorization evidence
    - missing persisted recovery authority holds manual recovery without provider lookup
    - actual local one-node JetStream KV persistence across nats-server restart and compare-and-set conflict convergence
    - actual local RF1 JetStream management status rejects authoritative journal mutation despite no caller-supplied replica configuration
    - a local RF1 ORCH_OPERATIONS stream is rejected by the controller open/validate path without a journal write; the operation record revision remains unchanged. This is RF1-mismatch evidence only, not an attempted R3-to-RF1 downgrade proof
    - configured exact-cell R3 and R5 stream validation accepts only the supplied cell's canonical configuration; RF1 and a different cell description fail before mutation; persisted cross-cell bindings also fail before a journal mutation
    - NATS 2.14 allow_batch_publish wire configuration must be explicitly false; true or omitted readback is rejected
    - NATS TLS identity comparison uses SubjectPublicKeyInfo, so distinct certificates reusing one key are rejected as the same identity
    - journal-writer identity admission rejects authority/reply public-key reuse with its writer TLS identity
    - provision-journal succeeds without controller or journal-writer private credential mounts
    - two local RF1 writer connections atomically consume one authority proof across the shared proof ledger, and the consumption remains after a local NATS restart; a pre-consumed proof is rejected by the private writer before its absent target operation can be created
    - proof-consumption keys use a fixed big-endian length-prefixed SHA-256 framing vector, independent of process CPU endianness
    - controller and journal-writer process-role options reject the other role's mounted credential variables before file resolution; a complete journal-writer configuration leaves controller NKey/mTLS options null
    - two credentialed controller identities publish only exact private create/update requests and each receives only its caller-scoped reply; two writer service instances form one NATS queue group. A writer-published syntactically valid forged reply fails the client-side signature/request-digest/result/revision verifier. Controllers are rejected for mutation-subject subscription, journal-reply publishing, _INBOX access, either journal KV store, $KV.ORCH_OPERATIONS delete/purge/rollup protocol publishes, and management delete/purge. Cross-cell, wrong-caller, ciphertext-tampered, and replayed proof attempts fail before mutation. CAS uses Nats-Expected-Last-Subject-Sequence while stream-level AllowRollupHdrs rejects a rollup attempt; retained state remains and a CreateAsync replay cannot prepare the old operation again
    - documented TOCTOU proof: a follower may transition after any management-health sample; the next CAS is still acknowledged only by the JetStream Raft quorum, or fails/times out, so no sampled peer state is treated as a commit guarantee
    - authoritative invocation consume is single-use and checkpoint-version-bound; a crash after consume recovers only by reconciliation without another CreateNode
    - configuration rejects RF1 CreateNode mutation and an unhealthy injected journal-key service before a KV write
    - delayed first worker capability after lease expiry and post-lease recovery/finalization is rejected before OCI client invocation
limitations:
  - The two-process proof establishes Development file-journal mutual exclusion only. Its missing parent-directory fsync means it does not establish crash-persistent ProviderCallStarted; it is explicitly marked non-crash-durable and cannot be paired with an external CreateNode mutation provider.
  - ORCH_OPERATIONS has no age expiry: a ProviderCallStarted or final operation tombstone cannot silently disappear after seven days and be re-prepared. Bounded capacity rejects new writes rather than making an external operation replayable; capacity sizing/retention is an R3 production qualification input.
  - Normal runtime does not bootstrap ORCH_OPERATIONS or ORCH_OPERATION_PROOFS. RF1 development deliberately neither opens nor creates the authoritative journal, so CreateNode remains disabled without bricking development. Before any RF3 controller runtime starts, infrastructure must run provision-journal with the separate TS_ORCH_INFRA_NATS_* identity; that command does not mount or inspect controller or journal-writer private material. An absent or mismatched bucket then fails startup closed. Production authorization must preserve controller denial of both journal KV stores and all stream mutation subjects, including message delete and purge.
  - The isolated `journal-writer` command and its closed workload role enforce process/configuration separation only; no deployed external writer workload, production credential mount policy, or R3 proof is claimed from the local fixture.
  - The local JetStream test is one-node persistence/CAS and RF1-rejection evidence only. It does not prove R3 replication, envelope encryption/rotation under mutation, quorum loss/recovery, JetStream placement, cross-host disk behavior, or production mTLS/NKey authorization.
  - No local R3 component lane was run. Production proof must demonstrate follower transition after a readiness sample: the adapter may observe that sample, but a subsequent Create/Update CAS succeeds only after the then-current JetStream Raft quorum acknowledges it; loss of quorum must fail or time out rather than relying on stale sampled health.
  - Production qualification still requires a targeted regional three-server JetStream proof for ORCH_OPERATIONS (replicas=3): run provision-journal with an authenticated mTLS/NKey infrastructure identity, validate the complete canonical stream configuration including deny-delete/deny-purge and disabled rollup, then prove the distinct authenticated controller identity cannot publish journal KV DEL/PURGE/rollup markers or create/update/delete/message-delete/purge the stream while the private typed mutation service's CAS is quorum-acknowledged. NATS permissions are subject-level and cannot inspect headers: any principal with the journal-writer KV publish subject could synthesize a KV delete/purge marker, so that identity must remain adapter-only, independently protected, and unavailable to controllers. The same lane must cover tenant/provider authorization prerequisites, healthy rotation-aware journal-key service, one-member-loss recovery, retained-key rotation, and capability-consume fencing under quorum.
  - Precise production composition, external account/JWT ACL bootstrap prerequisites, and the required R3 qualification evidence are documented in docs/guides/nats-journal-production-prerequisites.md. This repository does not emit a production ACL/bootstrap artifact because it has no owner-controlled source of truth for account issuance, public identity inventory, host configuration delivery, or private credential handling.
  - OCI mutation remains deliberately unavailable and unwired until a separately reviewed OCI client, scoped provider identity, complete external composition, and L4 evidence gate exist.
