schemaVersion: 1
evidenceId: DLV-CREATENODE-001
title: CreateNode fail-closed provider-operation recovery slice
status: implementation-and-focused-test-evidence-not-production-enabled
scope:
  included:
    - existing OperationEngine dispatch intent is required as the operation authority
    - existing ProviderOwnershipEngine CreateNode intent is required as the provider authority
    - injected authoritative compare-and-swap journal contract; no local journal is a production default
    - signed persisted handoff receipt with full immutable provider/authorization binding and kid-based verification
    - deterministic fake provider and disabled-by-default OCI client boundary
  excluded:
    - live OCI provisioning, credentials, cloud mutation, and deployment qualification
    - node enrollment, scheduling, and cluster deployment
invariants:
  - INV-004: exact existing operation and provider authorization intents are required.
  - INV-005: provider invocation is durably recorded before the side effect; a recorded create is never automatically reissued.
  - INV-006: a stale invocation reconciles only by the durable create key; unknown/not-found transitions to manual recovery.
security:
  receipt: ECDSA P-256 SHA-256, bound to operation/action, authenticated authorization tenant, node request, idempotency/create key, cell, compartment, generation/epoch, template, placement, bootstrap digest, authorization sequence/digest, issue time, and expiry
  keyLifecycle: strict algorithm allowlist plus kid resolver/key ring supports retained old verification keys through receipt lifetime
  tamperHandling: receipt and full development-journal record tags are verified before any provider call
  secrets: no credential, private key, or receipt payload is logged or included in this evidence
validation:
  command: dotnet run --project tests/TerraScale.Orchestrator.ControlPlane.Tests/TerraScale.Orchestrator.ControlPlane.Tests.csproj --no-build --no-restore -- --maximum-parallel-tests 4 --no-progress
  result: focused control-plane executable passed after adding CreateNode coordinator cases
  cases:
    - signed receipt tamper, expiry, tenant, and node-request binding
    - crash-after-provider-success reconciles without a second CreateNode against a deliberately non-deduplicating provider
    - expired in-flight lease with not-found reconciliation enters manual recovery without a second CreateNode
    - full immutable receipt binding-field tamper and key-rotation/unknown-kid checks
    - HMAC-tagged development-journal tamper rejection
    - OCI adapter disabled fail-closed without invoking its client
limitations:
  - No reviewed R3/CAS journal adapter is available in the current tree; CreateNode is not production enabled and production composition must reject the development file journal.
  - OCI mutation remains deliberately unavailable until a separately reviewed OCI client, scoped identity, authoritative R3 journal, and L4 evidence gate exist.
