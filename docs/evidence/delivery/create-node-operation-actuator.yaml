schemaVersion: 1
evidenceId: DLV-CREATENODE-001
title: CreateNode fail-closed provider-operation recovery slice
status: implementation-and-focused-test-evidence-not-production-enabled
scope:
  included:
    - existing OperationEngine dispatch intent is required as the operation authority
    - existing ProviderOwnershipEngine CreateNode intent is required as the provider authority
    - dedicated regional ORCH_OPERATIONS JetStream KV journal with bounded encrypted envelopes, CAS, retained replay/recovery state, immutable infrastructure-owned RF3 configuration, and an explicit pre-controller provision-journal path
    - signed persisted handoff receipt with full immutable provider/authorization binding and kid-based verification
    - deterministic fake provider and disabled-by-default OCI client boundary
  excluded:
    - live OCI provisioning, credentials, cloud mutation, and deployment qualification
    - node enrollment, scheduling, and cluster deployment
invariants:
  - INV-004: exact existing operation and provider authorization intents are required.
  - INV-005: a provider invocation is checkpointed before the side effect; a recorded create is never automatically reissued.
  - INV-006: a stale invocation reconciles only by the durable create key; unknown/not-found transitions to manual recovery.
security:
  receipt: ECDSA P-256 SHA-256, bound to operation/action, authenticated authorization tenant, node request, idempotency/create key, cell, compartment, generation/epoch, template, placement, bootstrap digest, authorization sequence/digest, issue time, and expiry; signed tenant proof must exactly equal the nonempty authenticated authorization-evidence tenant before binding or journaling
  recoveryLookup: separately signed, provider-audience-limited, binding-digest lookup authority persists at dispatch for at most seven days; every ProviderCallStarted reconciliation requires it independently, even while the mutation receipt remains valid; missing, null, malformed, or expired authority holds manual recovery without lookup
  invocationCapability: an enabled external actuator verifies a separately keyed, audience-bound capability bound to operation, checkpoint version, lease owner/token, nonce, binding digest, and lease expiry; immediately before mutation it must atomically consume that capability through the same authoritative R3 journal, which rereads the ProviderCallStarted checkpoint and rejects expired, finalized, stale-version, binding, lease-owner/token, nonce, or already-consumed claims
  journalEnvelope: one bounded AES-256-GCM envelope per operation key, with AAD binding the CreateNode journal domain, hashed operation key, key ID, and CAS precondition version; a rotation-aware injected regional key service supplies the active key and retained verification keys, and unknown/retired keys fail closed
  mutationGate: CreateNode journal mutation, capability minting, and capability consumption require an existing exact immutable JetStream ORCH_OPERATIONS RF3 configuration and a healthy injected journal-key service; TS_ORCH_REPLICAS cannot influence this bucket and no RF1 fallback is permitted. Before controllers start, the explicit provision-journal command uses TS_ORCH_INFRA_NATS_NKEY_FILE plus TS_ORCH_INFRA_NATS_TLS_* mTLS material to create/update the exact raw KV stream. The controller runtime only opens and validates that stream in RF3 mode; RF1 development does not construct or open it and CreateNode remains disabled. NatsCreateNodeOperationJournal receives the actual configured NatsTopology and validates its same-cell description, not a test cell; all of its Create/Update calls require the private mutation client rather than direct KV publication. Validation compares stream name/description/subject, retention, consumer/message/byte/age/size limits, file storage, compression, replicas, ack/discard/duplicate behavior, no placement/source/mirror/republish, sealing, delete/purge, rollup/direct, message TTL/delete-marker/counter/schedule/atomic-publish, persistence mode, and no user metadata. AllowRollupHdrs is false because CAS uses Nats-Expected-Last-Subject-Sequence and needs no rollup. Controller identities have no ORCH_OPERATIONS KV data-subject permission; they retain only their named runtime KV buckets and are denied journal KV, stream create/update/delete, message delete, and purge. The isolated journal-writer identity is held only by a private typed mutation service with exact create/update operation-key requests; it exposes neither a generic request subject nor public ingress. The Create/Update CAS acknowledgement is the authoritative JetStream Raft-quorum commit boundary. Management leader/follower/lag fields are sampled readiness/observability only and never an atomic all-three mutation fence.
  keyLifecycle: strict NIST P-256 algorithm/curve allowlist plus distinct receipt, tenant-authority, provider-attestation, recovery, and invocation key material/key-ID domains; composition rejects shared public material or kid across domains
  tamperHandling: receipt and every authoritative journal envelope are authenticated before any provider call
  secrets: no credential, private key, or receipt payload is logged or included in this evidence
validation:
  journalCommand: dotnet run --project tests/TerraScale.Orchestrator.Tests/TerraScale.Orchestrator.Tests.csproj --no-build --no-restore -- --reflection --treenode-filter '/*/*/NatsCreateNodeOperationJournalTests/**' --maximum-parallel-tests 4 --no-progress --timeout 5m --no-ansi
  journalResult: passed; 6 total, 6 succeeded, 0 failed; duration 7.907s; one local nats-server process only
  credentialedPermissionCommand: dotnet run --project tests/TerraScale.Orchestrator.Tests/TerraScale.Orchestrator.Tests.csproj --no-build --no-restore -- --reflection --treenode-filter '/*/*/NatsCreateNodeOperationJournalTests/CredentialedControllerCannotDeletePurgeOrRollupJournalWhileWriterCasPersists' --maximum-parallel-tests 4 --no-progress --timeout 5m --no-ansi
  credentialedPermissionResult: included in journalResult; local NKey-authenticated controller is rejected for KV delete/purge/rollup protocol publishes and management delete/purge, while the private typed mutation client reaches the separate journal-writer service for CAS and the old key cannot be re-created
  permissionCommand: dotnet run --project tests/TerraScale.Orchestrator.Tests/TerraScale.Orchestrator.Tests.csproj --no-build --no-restore -- --reflection --treenode-filter '/*/*/DevelopmentNatsSecurityTests/DevelopmentNatsIdentitiesArePrivateDistinctAndPlaneScoped' --maximum-parallel-tests 4 --no-progress --timeout 5m --no-ansi
  permissionResult: passed; 1 total, 1 succeeded, 0 failed; duration 1.536s
  coordinatorCommand: dotnet run --project tests/TerraScale.Orchestrator.ControlPlane.Tests/TerraScale.Orchestrator.ControlPlane.Tests.csproj --no-build --no-restore -- --reflection --treenode-filter '/*/*/CreateNodeCoordinatorTests/**' --maximum-parallel-tests 4 --no-progress --timeout 5m --no-ansi
  coordinatorResult: passed; 17 total, 17 succeeded, 0 failed; duration 5.601s
  cases:
    - signed receipt tamper, expiry, tenant, and node-request binding
    - crash-after-provider-success reconciles without a second CreateNode against a deliberately non-deduplicating provider, including after mutation-receipt expiry
    - expired in-flight lease with not-found reconciliation enters manual recovery without a second CreateNode
    - full immutable receipt binding-field tamper, P-384 rejection, and key-rotation/unknown-kid checks
    - verified tenant-authorization proof and malicious provider reconciliation-proof rejection; provider proof signs the full canonical request binding digest
    - AES-GCM envelope tamper and retained-key rotation require a targeted R3 JetStream qualification lane; they are not claimed from the local RF1 process
    - two independent child processes contend through the actual development filesystem lock/CAS path; exactly one writes version 1 and the other observes the committed version without overwrite
    - OCI adapter disabled fail-closed without invoking its client
    - expired recovery authority holds manual recovery without provider lookup even while its mutation receipt remains valid
    - enabled OCI provider is rejected without client invocation when the journal is not authoritative crash-durable
    - direct enabled OCI CreateNode without a valid authoritative invocation capability is rejected before its client call
    - shared receipt/tenant trust material is rejected at coordinator composition; tenant proofs are issued only by the tenant-authority signer and must equal authenticated authorization evidence
    - missing persisted recovery authority holds manual recovery without provider lookup
    - actual local one-node JetStream KV persistence across nats-server restart and compare-and-set conflict convergence
    - actual local RF1 JetStream management status rejects authoritative journal mutation despite no caller-supplied replica configuration
    - a local RF1 ORCH_OPERATIONS stream is rejected by the controller open/validate path without a journal write; the operation record revision remains unchanged. This is RF1-mismatch evidence only, not an attempted R3-to-RF1 downgrade proof
    - configured exact-cell R3 stream validation accepts only the supplied cell's canonical configuration; RF1 and a different cell description fail before mutation
    - credentialed development controller authorization rejects actual protocol publishes on $KV.ORCH_OPERATIONS.* with KV-Operation: DEL, KV-Operation: PURGE, and Nats-Rollup: sub, plus $JS.API.STREAM.MSG.DELETE.KV_ORCH_OPERATIONS and $JS.API.STREAM.PURGE.KV_ORCH_OPERATIONS. Its permitted CAS instead travels through the exact private create/update mutation subjects to the separate journal-writer service, which validates operation-key request shape and holds the sole KV writer credential. CAS uses Nats-Expected-Last-Subject-Sequence while stream-level AllowRollupHdrs rejects a rollup attempt; retained state remains and a CreateAsync replay cannot prepare the old operation again
    - documented TOCTOU proof: a follower may transition after any management-health sample; the next CAS is still acknowledged only by the JetStream Raft quorum, or fails/times out, so no sampled peer state is treated as a commit guarantee
    - authoritative invocation consume is single-use and checkpoint-version-bound; a crash after consume recovers only by reconciliation without another CreateNode
    - configuration rejects RF1 CreateNode mutation and an unhealthy injected journal-key service before a KV write
    - delayed first worker capability after lease expiry and post-lease recovery/finalization is rejected before OCI client invocation
limitations:
  - The two-process proof establishes Development file-journal mutual exclusion only. Its missing parent-directory fsync means it does not establish crash-persistent ProviderCallStarted; it is explicitly marked non-crash-durable and cannot be paired with an external CreateNode mutation provider.
  - ORCH_OPERATIONS has no age expiry: a ProviderCallStarted or final operation tombstone cannot silently disappear after seven days and be re-prepared. Bounded capacity rejects new writes rather than making an external operation replayable; capacity sizing/retention is an R3 production qualification input.
  - Normal runtime does not bootstrap ORCH_OPERATIONS. RF1 development deliberately neither opens nor creates the authoritative journal, so CreateNode remains disabled without bricking development. Before any RF3 controller runtime starts, infrastructure must run provision-journal with the separate TS_ORCH_INFRA_NATS_* identity; an absent or mismatched bucket then fails startup closed. Production authorization must preserve controller denial of ORCH_OPERATIONS KV data and all stream mutation subjects, including message delete and purge.
  - The local JetStream test is one-node persistence/CAS and RF1-rejection evidence only. It does not prove R3 replication, envelope encryption/rotation under mutation, quorum loss/recovery, JetStream placement, cross-host disk behavior, or production mTLS/NKey authorization.
  - No local R3 component lane was run. Production proof must demonstrate follower transition after a readiness sample: the adapter may observe that sample, but a subsequent Create/Update CAS succeeds only after the then-current JetStream Raft quorum acknowledges it; loss of quorum must fail or time out rather than relying on stale sampled health.
  - Production qualification still requires a targeted regional three-server JetStream proof for ORCH_OPERATIONS (replicas=3): run provision-journal with an authenticated mTLS/NKey infrastructure identity, validate the complete canonical stream configuration including deny-delete/deny-purge and disabled rollup, then prove the distinct authenticated controller identity cannot publish journal KV DEL/PURGE/rollup markers or create/update/delete/message-delete/purge the stream while the private typed mutation service's CAS is quorum-acknowledged. NATS permissions are subject-level and cannot inspect headers: any principal with the journal-writer KV publish subject could synthesize a KV delete/purge marker, so that identity must remain adapter-only, independently protected, and unavailable to controllers. The same lane must cover tenant/provider authorization prerequisites, healthy rotation-aware journal-key service, one-member-loss recovery, retained-key rotation, and capability-consume fencing under quorum.
  - OCI mutation remains deliberately unavailable and unwired until a separately reviewed OCI client, scoped provider identity, complete external composition, and L4 evidence gate exist.
