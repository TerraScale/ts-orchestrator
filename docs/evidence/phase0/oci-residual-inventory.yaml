authorityAndAccessGaps:
  - gap: OCI CLI installation or another approved read-only OCI API client on the evidence host.
    requiredAuthority: Cloud lane-approved tooling provenance; no mutation capability.
  - gap: Scoped tenancy and compartment discovery visibility.
    requiredAuthority: Read-only access to compartments and the inventory services for compute, block storage, backup, object storage, load balancing, public IPs, networking, OKE, Vault/KMS, Certificates, IAM, and relevant workload/NATS evidence sources.
  - gap: OCI DNS-zone/record and Vault/KMS/secret metadata visibility.
    requiredAuthority: Read-only OCI DNS and Vault/KMS metadata-listing access for the authorized scope; secret values, private keys, and kubeconfigs must not be read or persisted.
  - gap: Kubernetes and Flux repository/configuration presence evidence.
    requiredAuthority: Approved read-only, presence-only repository/configuration scan; it may identify configuration-material presence but must not read or persist secret values, private keys, kubeconfigs, webhook tokens, or credential material.
  - gap: Flux webhook and webhook-token metadata visibility.
    requiredAuthority: Read-only Forgejo/Flux webhook metadata access; webhook tokens must not be read or persisted.
  - gap: NATS stream and durable-consumer metadata visibility.
    requiredAuthority: Read-only NATS management/$SYS access or approved host-level metadata read; NATS credentials must not be read or persisted.
  - gap: Seven-day cost visibility.
    requiredAuthority: Read-only Cost Analysis or Usage API access covering the target tenancy and the seven-day window, with sanitized aggregate export only.
  - gap: Residual-resource ownership and cleanup disposition.
    requiredAuthority: Named accountable owner must approve unrelated, quarantine, or later-cleanup disposition only after positive resource observation and ownership evidence.

