    original_constraint: The deleted OKE estate leaves repository configuration and potentially cloud IAM, DNS, secrets, load balancers, volumes, IPs, and documentation outside any live adoption path.
    preserved_behavior: Safe inventory, ownership attribution, unrelated-resource protection, auditable deletion, and quarantine of unknown ownership.
    native_replacement: Greenfield Pulumi state and resource IDs; read-only provider/repository inventory with removal only after positive stale-resource identification and approval.
    owner_workstream:
      primary: Cross-repository cleanup
      collaborators: [Operations, Cloud, Verification]
    removal: {phase: phase-0-inventory-then-approved-cleanup-packages, pr: one-WRK-scoped-PR-per-repository}
    regression: {layer: L1-plus-L3S-plus-L4, scenario: forbidden Kubernetes/Flux parser and credential scan plus provider orphan inventory}
    recovery_boundary: Cleanup PRs are independently revertible; unknown and unrelated resources are quarantined rather than adopted or deleted.
    cleanup_proof: Signed old/new inventory accounts for repository paths and cloud/IAM/DNS/secret artifacts and proves the new runtime has no compatibility path.

  - id: WRK-019
    status: identified
    evidence:
      - repository: TerraScale.Deploy
        path: src/TerraScale.Deploy.Cli/Kubernetes/KubectlRetry.cs
        line: 7
        detail: Fixed transient-discovery delays retry kubectl when Kubernetes API discovery fails.
      - repository: TerraScale.Deploy
        path: src/TerraScale.Deploy.Cli/Services/ServiceReleasePipeline.cs
        line: 20
        detail: A fixed three-second polling interval drives the Flux notification barrier.
      - repository: TerraScale.Deploy
        path: src/TerraScale.Deploy.Cli/Notifications/NotifyDeploymentCommand.cs
        line: 796
        detail: Rollout polling is configured through a deployment environment variable.
    original_constraint: Eventually consistent Kubernetes discovery and Flux status forced CLI-local polling and transient retry policy without a durable operation subscription.
    preserved_behavior: Tolerate transient control-plane unavailability, bounded wait, cancellation, progress, and actionable timeout diagnostics.
    native_replacement: Durable command receipts and event-driven operation observation over NATS with bounded reconnect/backoff and authoritative terminal status.
    owner_workstream:
      primary: Operations
      collaborators: [Delivery, Messaging/security, Cross-repository cleanup, Verification]
    removal: {phase: cleanup-after-operation-watch-L3S, pr: pending-WRK-019}
    regression: {layer: L2-plus-L3S, scenario: disconnect, reconnect, missed event replay, cancellation, deadline, duplicate terminal event, and controller restart}
    recovery_boundary: Consumers resume from durable sequence and query authoritative state; loss of the watch connection never changes operation ownership.
    cleanup_proof: Kubernetes discovery retries, Flux barrier polling, rollout poll environment variables, and kubectl dependencies are absent from native paths.

  - id: WRK-020
    status: identified
    evidence:
      - repository: Terrabase.Operator
        path: cmd/main.go
        line: 93
        detail: The controller hosts a Kubernetes admission webhook server with mounted serving certificates.
      - repository: Terrabase.Operator
        path: config/default/manager_webhook_patch.yaml
