    original_constraint: Kubernetes admission and Secret mounts supplied trust/bootstrap, while replication observation used controller polling.
    preserved_behavior: Fail-closed configuration validation, certificate readiness, replication peer trust, mirror convergence, and bounded reconciliation cadence.
    native_replacement: Validate typed TerraBase plans before persistence, deliver certificates through the host identity boundary, and reconcile replication from typed admin state/events with bounded fallback polling only at the TerraBase API boundary.
    owner_workstream:
