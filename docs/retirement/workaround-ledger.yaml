  - id: WRK-018
    status: identified
    evidence:
      - repository: TerraScale.Infrastructure
        path: src/TerraScale.Infrastructure/Program.cs
        line: 366
        detail: Pulumi still derives a Flux receiver webhook credential.
      - repository: TerraScale.Infrastructure
        path: gitops/controllers/flux-image-automation/production-sfo/receiver-secret.yaml
        line: 2
